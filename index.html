// ============================================================
//  DRAG TO REORDER
// ============================================================
// Pointer-event-based reorder. On touch devices a long-press
// initiates the drag so single taps and scrolls still work. On mouse,
// drag starts immediately on pointerdown. The lifted row is moved to
// document.body so that re-renders of the view (e.g. from a Drive sync
// completing mid-drag) can't tear it out of the DOM.

const DRAG = {
  active: false,
  pressing: false,
  startX: 0, startY: 0,
  pointerId: null,
  handleEl: null,
  rowEl: null,           // the lifted clone (moved to body)
  originalRowEl: null,   // the original row (now hidden in place as placeholder)
  list: null,
  groupKey: null,
  dragId: null,
  rowRect: null,
  offsetX: 0,
  offsetY: 0,
  pressTimer: null,
  targetIndex: -1,
  isTouch: false,
  cancelled: false,
};

// One persistent indicator lives in body the whole session. Hidden by default.
let DRAG_INDICATOR_EL = null;
function ensureDragIndicator() {
  if (DRAG_INDICATOR_EL && DRAG_INDICATOR_EL.isConnected) return DRAG_INDICATOR_EL;
  DRAG_INDICATOR_EL = document.createElement('div');
  DRAG_INDICATOR_EL.className = 'drop-indicator';
  DRAG_INDICATOR_EL.style.display = 'none';
  DRAG_INDICATOR_EL.style.position = 'fixed';
  DRAG_INDICATOR_EL.style.pointerEvents = 'none';
  DRAG_INDICATOR_EL.style.zIndex = '60';
  document.body.appendChild(DRAG_INDICATOR_EL);
  return DRAG_INDICATOR_EL;
}
function hideDragIndicator() {
  if (DRAG_INDICATOR_EL) DRAG_INDICATOR_EL.style.display = 'none';
}

// Returns the currently-rendered original rows in a drag list (excludes
// any lifted clone living in body).
function dragRowsInList(list) {
  if (!list || !list.isConnected) return [];
  return [...list.querySelectorAll(':scope > [data-drag-id]:not([data-drag-clone])')];
}

function isDragActive() {
  return DRAG.active || DRAG.pressing;
}

function attachDragHandlers() {
  document.querySelectorAll('[data-drag-handle]').forEach(handle => {
    handle.addEventListener('pointerdown', onDragPointerDown);
  });
}

function onDragPointerDown(e) {
  if (e.button !== undefined && e.button !== 0) return;
  // If a previous drag somehow didn't clean up, force-reset now.
  if (DRAG.active || DRAG.pressing) hardResetDrag();

  const handle = e.currentTarget;
  const row = handle.closest('[data-drag-id]');
  if (!row) return;
  const list = row.parentElement;
  if (!list || !list.classList.contains('drag-list')) return;

  DRAG.handleEl = handle;
  DRAG.originalRowEl = row;
  DRAG.list = list;
  DRAG.groupKey = row.dataset.dragKey;
  DRAG.dragId = row.dataset.dragId;
  DRAG.startX = e.clientX;
  DRAG.startY = e.clientY;
  DRAG.pointerId = e.pointerId;
  DRAG.isTouch = e.pointerType === 'touch';
  DRAG.pressing = true;
  DRAG.active = false;
  DRAG.cancelled = false;
  DRAG.targetIndex = -1;

  row.classList.add('drag-pressing');

  // Listen on window so we never miss a pointerup, even if the user
  // releases outside the handle. Avoid pointer capture — pointer
  // capture is lost when the captured element's parent re-renders,
  // which has been a source of stuck drags.
  window.addEventListener('pointermove', onDragPointerMove, { passive: false });
  window.addEventListener('pointerup', onDragPointerUp, true);
  window.addEventListener('pointercancel', onDragPointerCancel, true);

  const initiateDelay = DRAG.isTouch ? 350 : 0;
  DRAG.pressTimer = setTimeout(() => {
    if (DRAG.pressing && !DRAG.cancelled) startDragging(e);
  }, initiateDelay);
}

function startDragging(e) {
  if (!DRAG.originalRowEl || !DRAG.originalRowEl.isConnected) {
    hardResetDrag();
    return;
  }
  DRAG.active = true;
  const rect = DRAG.originalRowEl.getBoundingClientRect();
  DRAG.rowRect = rect;
  DRAG.offsetX = DRAG.startX - rect.left;
  DRAG.offsetY = DRAG.startY - rect.top;

  // Clone the row and lift the clone into document.body so a mid-drag
  // re-render (sync, etc.) can't destroy it.
  const clone = DRAG.originalRowEl.cloneNode(true);
  clone.setAttribute('data-drag-clone', '1');
  clone.classList.remove('drag-pressing');
  clone.classList.add('drag-lifted');
  clone.style.position = 'fixed';
  clone.style.top = rect.top + 'px';
  clone.style.left = rect.left + 'px';
  clone.style.width = rect.width + 'px';
  clone.style.margin = '0';
  clone.style.pointerEvents = 'none';
  clone.style.zIndex = '70';
  // Disable form-control interactivity in the clone.
  clone.querySelectorAll('input, select, button, textarea').forEach(el => {
    el.disabled = true;
    el.tabIndex = -1;
  });
  document.body.appendChild(clone);
  DRAG.rowEl = clone;

  // Hide the original in place so its slot is preserved.
  DRAG.originalRowEl.classList.remove('drag-pressing');
  DRAG.originalRowEl.classList.add('drag-ghost');

  ensureDragIndicator();

  if (DRAG.isTouch && navigator.vibrate) navigator.vibrate(15);

  updateDropTarget(e.clientY);
}

function onDragPointerMove(e) {
  if (!DRAG.pressing) return;

  if (!DRAG.active) {
    const dx = Math.abs(e.clientX - DRAG.startX);
    const dy = Math.abs(e.clientY - DRAG.startY);
    if (dx > 8 || dy > 8) {
      // User moved before long-press fired — treat as scroll, cancel.
      DRAG.cancelled = true;
      clearTimeout(DRAG.pressTimer);
      DRAG.pressTimer = null;
      if (DRAG.originalRowEl) DRAG.originalRowEl.classList.remove('drag-pressing');
      finishDrag(false);
    }
    return;
  }

  e.preventDefault();
  if (DRAG.rowEl) {
    DRAG.rowEl.style.top = (e.clientY - DRAG.offsetY) + 'px';
    DRAG.rowEl.style.left = (e.clientX - DRAG.offsetX) + 'px';
  }
  updateDropTarget(e.clientY);

  const edge = 60;
  if (e.clientY < edge) window.scrollBy(0, -8);
  else if (e.clientY > window.innerHeight - edge) window.scrollBy(0, 8);
}

function updateDropTarget(clientY) {
  if (!DRAG.list || !DRAG.list.isConnected) { hideDragIndicator(); return; }
  const rows = dragRowsInList(DRAG.list).filter(r => r !== DRAG.originalRowEl);
  if (rows.length === 0) {
    DRAG.targetIndex = 0;
    hideDragIndicator();
    return;
  }

  let bestIndex = -1;
  let bestPosition = 'before';
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].getBoundingClientRect();
    const midY = r.top + r.height / 2;
    if (clientY < midY) {
      bestIndex = i;
      bestPosition = 'before';
      break;
    }
    if (i === rows.length - 1) {
      bestIndex = i;
      bestPosition = 'after';
    }
  }
  if (bestIndex === -1) { bestIndex = 0; bestPosition = 'before'; }

  const refRect = rows[bestIndex].getBoundingClientRect();
  const ind = ensureDragIndicator();
  ind.style.display = 'block';
  ind.style.left = refRect.left + 'px';
  ind.style.width = refRect.width + 'px';
  ind.style.top = (bestPosition === 'before' ? refRect.top - 1 : refRect.bottom - 1) + 'px';

  // Compute final index in the underlying data array.
  const fullRows = dragRowsInList(DRAG.list);
  const draggedOriginalIdx = fullRows.indexOf(DRAG.originalRowEl);
  const targetOriginalIdx = fullRows.indexOf(rows[bestIndex]);
  let finalIdx = bestPosition === 'before' ? targetOriginalIdx : targetOriginalIdx + 1;
  if (draggedOriginalIdx >= 0 && draggedOriginalIdx < targetOriginalIdx) finalIdx -= 1;
  DRAG.targetIndex = finalIdx;
}

function onDragPointerUp(e) {
  if (!DRAG.pressing) return;
  clearTimeout(DRAG.pressTimer);
  DRAG.pressTimer = null;

  const shouldCommit = DRAG.active && !DRAG.cancelled && DRAG.targetIndex >= 0;
  finishDrag(shouldCommit);
}

function onDragPointerCancel(e) {
  if (!DRAG.pressing) return;
  clearTimeout(DRAG.pressTimer);
  DRAG.pressTimer = null;
  finishDrag(false);
}

function finishDrag(commit) {
  const groupKey = DRAG.groupKey;
  const dragId = DRAG.dragId;
  const targetIndex = DRAG.targetIndex;

  // Tear down DOM and listeners first so the subsequent render() starts
  // from a clean slate.
  hardResetDrag();

  if (commit) commitReorder(groupKey, dragId, targetIndex);
}

// Synchronously remove every trace of a drag from the DOM and reset state.
// Safe to call at any time, even if no drag is active.
function hardResetDrag() {
  clearTimeout(DRAG.pressTimer);
  DRAG.pressTimer = null;

  window.removeEventListener('pointermove', onDragPointerMove, { passive: false });
  window.removeEventListener('pointerup', onDragPointerUp, true);
  window.removeEventListener('pointercancel', onDragPointerCancel, true);

  // Remove any lifted clone(s). Use a query in case multiple ever leaked.
  document.querySelectorAll('[data-drag-clone]').forEach(el => el.remove());

  // Restore the original row's visual state.
  if (DRAG.originalRowEl) {
    DRAG.originalRowEl.classList.remove('drag-pressing', 'drag-ghost');
  }
  // Belt and suspenders: any row in the document that still has these
  // classes (e.g. survived a re-render with stale state) gets cleaned up.
  document.querySelectorAll('.drag-pressing, .drag-ghost').forEach(el => {
    el.classList.remove('drag-pressing', 'drag-ghost');
  });

  hideDragIndicator();

  DRAG.active = false;
  DRAG.pressing = false;
  DRAG.cancelled = false;
  DRAG.handleEl = null;
  DRAG.rowEl = null;
  DRAG.originalRowEl = null;
  DRAG.list = null;
  DRAG.groupKey = null;
  DRAG.dragId = null;
  DRAG.pointerId = null;
  DRAG.targetIndex = -1;
}

function commitReorder(groupKey, id, targetIndex) {
  if (targetIndex < 0) return;
  const plan = currentPlan();
  let arr;
  if (groupKey === 'income') arr = plan.income.sources;
  else arr = plan[groupKey];
  if (!arr) return;
  const fromIdx = arr.findIndex(x => x.id === id);
  if (fromIdx < 0) return;
  const [item] = arr.splice(fromIdx, 1);
  const clamped = Math.max(0, Math.min(targetIndex, arr.length));
  if (clamped === fromIdx) {
    // No actual change — re-insert in place; skip save+sync.
    arr.splice(fromIdx, 0, item);
    return;
  }
  arr.splice(clamped, 0, item);
  saveLocal();
  render();
  debouncedSync();
}

// ============================================================
//  VIEWS
// ============================================================
function render() {
  // If a re-render happens while a drag is in flight (e.g. a Drive sync
  // completed mid-drag, or some other state mutation triggered render),
  // tear the drag down first so we never leave orphaned DOM behind.
  if (typeof hardResetDrag === 'function' && (DRAG.active || DRAG.pressing)) {
    hardResetDrag();
  }
  document.getElementById('month-label').textContent = 'Personal · ' + monthLabel(activeMonth);
  updateMonthTrigger();
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === activeTab);
  });
  const mobileSelect = document.getElementById('tabs-mobile-select');
  if (mobileSelect) mobileSelect.value = activeTab;
  document.getElementById('settings-btn').classList.toggle('active', activeTab === 'settings');
  document.getElementById('version-label').textContent = 'v' + APP_VERSION;
  const fab = document.getElementById('fab');
  if (fab) {
    const fabHidden = activeTab === 'plan' || activeTab === 'settings';
    fab.style.display = fabHidden ? 'none' : 'flex';
    fab.setAttribute('aria-label', activeTab === 'assets' ? 'Add asset snapshot' : activeTab === 'funds' ? 'Add fund' : 'Add transaction');
    fab.title = activeTab === 'assets' ? 'New snapshot' : activeTab === 'funds' ? 'New fund' : 'New transaction';
  }
  const view = document.getElementById('view');
  if (activeTab === 'dashboard') view.innerHTML = renderDashboard();
  else if (activeTab === 'transactions') view.innerHTML = renderTransactions();
  else if (activeTab === 'plan') view.innerHTML = renderPlan();
  else if (activeTab === 'assets') view.innerHTML = renderAssets();
  else if (activeTab === 'funds') view.innerHTML = renderFunds();
  else if (activeTab === 'settings') view.innerHTML = renderSettings();
  attachViewHandlers();
}

function renderDashboard() {
  const { needs, wants, savings, needsPlanned, wantsPlanned, savingsPlanned } = groupTotals();
  const takeHome = currentTakeHome();
  const allSpent = needs + wants + savings;
  const remaining = takeHome - allSpent;
  const remainingPct = takeHome > 0 ? (remaining / takeHome) * 100 : 0;
  const needsPct = takeHome > 0 ? (needs / takeHome) * 100 : 0;
  const wantsPct = takeHome > 0 ? (wants / takeHome) * 100 : 0;
  const savingsPct = takeHome > 0 ? (savings / takeHome) * 100 : 0;
  const remainingState = remaining < 0 ? 'negative' : (takeHome > 0 && remaining < takeHome * 0.05) ? 'warn' : '';
  const txnCount = monthTxns().length;
  const spent = spentByCategory();

  // Calculate auto-committed total.
  const allCats = [...currentPlan().needs, ...currentPlan().wants, ...currentPlan().savings];
  const autoTotal = allCats.filter(c => c.isAuto && c.planned > 0).reduce((a, c) => a + c.planned, 0);
  const autoCount = allCats.filter(c => c.isAuto && c.planned > 0).length;

  const catGroup = (title, items, total, planned) => `
    <div class="group-section">
      <div class="group-header">
        <h2 class="group-title">${title}</h2>
        <div class="group-stats">$${fmt(total)} of $${fmt(planned)} planned</div>
      </div>
      <div class="cat-grid">
        ${items.map(item => {
          const s = spent[item.id] || 0;
          const pct = item.planned > 0 ? (s / item.planned) * 100 : 0;
          const isOver = pct > 100;
          const isWarn = pct > 80 && !isOver;
          const isAuto = !!item.isAuto;
          const linkedFund = item.linkedFundId ? state.autoFunds.find(f => f.id === item.linkedFundId) : null;
          const fundBal = linkedFund ? computeFund(linkedFund).balance : 0;
          return `
            <div class="cat-card ${isOver ? 'over' : isWarn ? 'warn' : ''}" ${linkedFund ? `data-action="go-to-fund" data-fund-id="${linkedFund.id}" style="cursor:pointer;"` : ''}>
              <div class="cat-name" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                ${escapeHtml(item.name)}
                ${isAuto ? '<span class="auto-badge"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>Auto</span>' : ''}
              </div>
              <div class="cat-amounts">
                <span class="cat-spent">$${fmt(s)}</span>
                <span class="cat-planned">/ $${item.planned}</span>
              </div>
              <div class="cat-progress">
                <div class="cat-progress-fill ${isOver ? 'over' : isWarn ? 'warn' : ''}" style="width: ${Math.min(pct, 100)}%"></div>
              </div>
              <div class="cat-pct">
                ${item.planned === 0 ? 'No budget set'
                  : isAuto ? 'Auto-deducted'
                  : pct.toFixed(0) + '% used' + (isOver ? ' — over' : '')}
                ${linkedFund ? ` · <span class="linked-badge" style="display:inline-flex;" data-action="go-to-fund" data-fund-id="${linkedFund.id}">↗ Fund: $${fmt(fundBal)}</span>` : ''}
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>`;

  return `
    <div class="dashboard-top">
      <div class="hero-card">
        <div class="hero-label">Remaining this month</div>
        <div class="hero-amount ${remainingState}">$${fmt(remaining)}</div>
        <div class="hero-detail">of $${fmt(takeHome)} take-home · ${takeHome > 0 ? remainingPct.toFixed(0) : '0'}% unspent · ${txnCount} transactions${autoCount > 0 ? ` · $${fmt(autoTotal)} auto-committed` : ''}</div>
        <div class="hero-bar">
          <div class="hero-bar-seg hero-bar-needs" style="width: ${Math.min(needsPct, 100)}%"></div>
          <div class="hero-bar-seg hero-bar-wants" style="width: ${Math.min(wantsPct, 100)}%"></div>
          <div class="hero-bar-seg hero-bar-savings" style="width: ${Math.min(savingsPct, 100)}%"></div>
        </div>
        <div class="hero-legend">
          <div class="hero-legend-item"><div class="hero-legend-dot" style="background:var(--bar-needs)"></div>Needs $${fmt(needs)} (${needsPct.toFixed(0)}%)</div>
          <div class="hero-legend-item"><div class="hero-legend-dot" style="background:var(--bar-wants)"></div>Wants $${fmt(wants)} (${wantsPct.toFixed(0)}%)</div>
          <div class="hero-legend-item"><div class="hero-legend-dot" style="background:var(--bar-savings)"></div>Savings $${fmt(savings)} (${savingsPct.toFixed(0)}%)</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="hero-label">50/30/20 plan</div>
        <div class="summary-row">
          <span class="summary-label">Needs</span>
          <span><span class="summary-value">$${fmt(needs)}</span><span class="summary-pct">${needsPct.toFixed(0)}% / 50%</span></span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Wants</span>
          <span><span class="summary-value">$${fmt(wants)}</span><span class="summary-pct">${wantsPct.toFixed(0)}% / 30%</span></span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Savings</span>
          <span><span class="summary-value">$${fmt(savings)}</span><span class="summary-pct">${savingsPct.toFixed(0)}% / 20%</span></span>
        </div>
      </div>
    </div>
    ${catGroup('Savings', currentPlan().savings, savings, savingsPlanned)}
    ${catGroup('Needs', currentPlan().needs, needs, needsPlanned)}
    ${catGroup('Wants', currentPlan().wants, wants, wantsPlanned)}
    ${state.autoFunds.length > 0 ? renderDashboardFundsSummary() : ''}
  `;
}

function renderDashboardFundsSummary() {
  const funds = state.autoFunds;
  const totalBal = funds.reduce((a, f) => a + computeFund(f).balance, 0);
  const totalMonthly = funds.reduce((a, f) => a + f.monthlyAmount, 0);
  return `
    <div class="group-section">
      <div class="group-header">
        <h2 class="group-title">Sinking Funds</h2>
        <div class="group-stats">$${fmt(totalMonthly)}/mo auto-funded</div>
      </div>
      <div class="cat-grid">
        ${funds.map(fund => {
          const c = computeFund(fund);
          const hasGoal = fund.goalAmount > 0;
          const pct = hasGoal ? (c.balance / fund.goalAmount) * 100 : 0;
          const isOver = pct >= 100;
          const isWarn = pct > 70 && !isOver;
          return `
            <div class="cat-card ${isOver ? '' : isWarn ? 'warn' : ''}">
              <div class="cat-name">${escapeHtml(fund.name)}</div>
              <div class="cat-amounts">
                <span class="cat-spent" style="color:var(--accent);">$${fmt(c.balance)}</span>
                ${hasGoal ? `<span class="cat-planned">/ $${fmt(fund.goalAmount)} goal</span>` : `<span class="cat-planned">$${fmt(fund.monthlyAmount)}/mo</span>`}
              </div>
              ${hasGoal ? `
                <div class="cat-progress">
                  <div class="cat-progress-fill ${isOver ? '' : isWarn ? 'warn' : ''}" style="width: ${Math.min(pct, 100)}%;${isOver ? 'background:var(--good);' : ''}"></div>
                </div>
                <div class="cat-pct">${isOver ? 'Goal reached!' : pct.toFixed(0) + '% of goal'}</div>
              ` : `
                <div class="cat-pct">${c.months} month${c.months !== 1 ? 's' : ''} · $${fmt(c.totalContributed)} contributed</div>
              `}
            </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function renderTransactions() {
  const txns = monthTxns();
  const allCats = [...currentPlan().needs, ...currentPlan().wants, ...currentPlan().savings];
  const catMap = Object.fromEntries(allCats.map(c => [c.id, c]));
  const sorted = [...txns].sort((a, b) => new Date(b.date) - new Date(a.date));

  return `
    <div style="display:flex;justify-content:space-between;margin-bottom:16px;align-items:center;flex-wrap:wrap;gap:8px;">
      <h2 style="font-family:var(--display-font);font-size:24px;font-style:italic;font-weight:400;">${txns.length} transactions</h2>
      ${txns.length > 0 ? '<button class="btn-secondary btn-danger" data-action="reset-month">Clear month</button>' : ''}
    </div>
    ${sorted.length === 0 ? `

// Build an SVG trend chart of net worth (plus assets/liabilities) over time.
// Pure SVG so it themes via CSS vars and needs no external library.
function buildAssetsChart(snaps) {
  if (snaps.length === 0) return '';

  const W = 720, H = 280;
  const padL = 56, padR = 18, padT = 18, padB = 34;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  // Compute fund balance at a given date string (YYYY-MM-DD).
  function totalFundBalanceAt(dateStr) {
    const asOfMonth = dateStr.slice(0, 7); // YYYY-MM
    return state.autoFunds.reduce((sum, fund) => {
      const contributed = fundContributedThrough(fund, asOfMonth);
      const withdrawn = fund.withdrawals
        .filter(w => w.date.slice(0, 10) <= dateStr)
        .reduce((a, w) => a + w.amount, 0);
      return sum + Math.max(0, contributed - withdrawn);
    }, 0);
  }

  const hasFunds = state.autoFunds.length > 0;

  // Series: net worth, total assets, total liabilities, available.
  const points = snaps.map(s => {
    const t = snapshotTotals(s);
    // Use stored fundBalance if available, otherwise estimate retroactively.
    const fundBal = s.fundBalance !== null && s.fundBalance !== undefined
      ? s.fundBalance
      : (hasFunds ? totalFundBalanceAt(s.date) : 0);
    // Available = liquid assets (assets − liabilities) minus fund commitments.
    return { date: s.date, net: t.net, assets: t.assets + t.nonAvailable, liabilities: t.liabilities, available: t.liquid - fundBal };
  });

  const allVals = points.flatMap(p => hasFunds
    ? [p.net, p.assets, p.liabilities, p.available]
    : [p.net, p.assets, p.liabilities]);
  let minV = Math.min(0, ...allVals);
  let maxV = Math.max(0, ...allVals);
  if (minV === maxV) { maxV = minV + 1; } // avoid divide by zero
  // Add a little headroom.
  const range = maxV - minV;
  maxV += range * 0.08;
  minV -= range * 0.08;

  const n = points.length;
  const xFor = (i) => n === 1 ? padL + plotW / 2 : padL + (i / (n - 1)) * plotW;
  const yFor = (v) => padT + (1 - (v - minV) / (maxV - minV)) * plotH;

  // Gridlines / y-axis labels (4 ticks).
  const ticks = 4;
  let gridSvg = '';
  for (let i = 0; i <= ticks; i++) {
    const v = minV + (i / ticks) * (maxV - minV);
    const y = yFor(v);
    gridSvg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" class="chart-grid" />`;
    gridSvg += `<text x="${padL - 8}" y="${(y + 3.5).toFixed(1)}" class="chart-axis-label" text-anchor="end">${fmtCompact(v)}</text>`;
  }

  // Zero baseline emphasized if within range.
  let zeroSvg = '';
  if (minV < 0 && maxV > 0) {
    const yz = yFor(0);
    zeroSvg = `<line x1="${padL}" y1="${yz.toFixed(1)}" x2="${W - padR}" y2="${yz.toFixed(1)}" class="chart-zero" />`;
  }

  const linePath = (key) => points.map((p, i) => `${i === 0 ? 'M' : 'L'}${xFor(i).toFixed(1)},${yFor(p[key]).toFixed(1)}`).join(' ');

  // Area under the net-worth line, down to the baseline (zero or bottom).
  const baseY = (minV < 0 && maxV > 0) ? yFor(0) : (padT + plotH);
  const netLine = linePath('net');
  const areaPath = `${netLine} L${xFor(n - 1).toFixed(1)},${baseY.toFixed(1)} L${xFor(0).toFixed(1)},${baseY.toFixed(1)} Z`;

  // Dots + interactive titles for net worth.
  const dots = points.map((p, i) => {
    const cx = xFor(i).toFixed(1), cy = yFor(p.net).toFixed(1);
    const avail = hasFunds ? ` · $${fmt(p.available)} available` : '';
    return `<circle cx="${cx}" cy="${cy}" r="3.5" class="chart-dot"><title>${escapeHtml(formatDateShort(p.date))}: $${fmt(p.net)} net${avail}</title></circle>`;
  }).join('');

  // X-axis date labels — show first, last, and a couple in between to avoid crowding.
  const labelIdx = new Set([0, n - 1]);
  if (n > 2) labelIdx.add(Math.floor((n - 1) / 2));
  if (n > 4) { labelIdx.add(Math.floor((n - 1) / 4)); labelIdx.add(Math.floor(3 * (n - 1) / 4)); }
  let xLabels = '';
  points.forEach((p, i) => {
    if (!labelIdx.has(i)) return;
    const anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
    xLabels += `<text x="${xFor(i).toFixed(1)}" y="${H - 10}" class="chart-axis-label" text-anchor="${anchor}">${escapeHtml(formatDateShort(p.date))}</text>`;
  });

  return `
    <svg class="assets-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Net worth trend chart">
      ${gridSvg}
      ${zeroSvg}
      <path d="${areaPath}" class="chart-area" />
      <path d="${linePath('assets')}" class="chart-line chart-line-assets" />
      <path d="${linePath('liabilities')}" class="chart-line chart-line-liab" />
      ${hasFunds ? `<path d="${linePath('available')}" class="chart-line chart-line-avail" />` : ''}
      <path d="${netLine}" class="chart-line chart-line-net" />
      ${dots}
      ${xLabels}
    </svg>
    <div class="chart-legend">
      <span class="chart-legend-item"><span class="chart-legend-swatch sw-net"></span>Net worth</span>
      ${hasFunds ? '<span class="chart-legend-item"><span class="chart-legend-swatch sw-avail"></span>Available</span>' : ''}
      <span class="chart-legend-item"><span class="chart-legend-swatch sw-assets"></span>Total assets</span>
      <span class="chart-legend-item"><span class="chart-legend-swatch sw-liab"></span>Total liabilities</span>
    </div>
  `;
}

// Compact currency for axis labels: $1.2k, $45k, $1.3M, etc.
function fmtCompact(v) {
  const neg = v < 0;
  let a = Math.abs(v);
  let s;
  if (a >= 1e6) s = (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  else if (a >= 1e3) s = (a / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'k';
  else s = a.toFixed(0);
  return (neg ? '-$' : '$') + s;
}

function formatDateShort(iso) {
  // iso is YYYY-MM-DD; render as e.g. "Jun 7 '26"
  const parts = String(iso).split('-');
  if (parts.length !== 3) return iso;
  const [y, m, d] = parts.map(Number);
  const dt = new Date(y, m - 1, d);
  if (isNaN(dt)) return iso;
  return `${MONTH_NAMES[dt.getMonth()]} ${dt.getDate()} '${String(y).slice(2)}`;
}

    const linked = linkedPlanItem(fund.id);

    // Build event history: monthly contributions + withdrawals, sorted newest first.
    const events = [];
    // Add monthly contribution entries for last 6 months (or since start).
    const [cY, cM] = currentMonthKey().split('-').map(Number);
    for (let i = 0; i < Math.min(c.months, 6); i++) {
      let m = cM - i;
      let y = cY;
      while (m < 1) { m += 12; y--; }
      const mk = `${y}-${String(m).padStart(2, '0')}`;
      events.push({
        date: new Date(y, m - 1, 1).toISOString(),
        month: mk,
        type: 'contribution',
        amount: rateForMonth(fund, mk),
        note: monthLabel(mk),
      });

      events.push({
        date: w.date,

        note: w.note || (w.amount < 0 ? 'Extra deposit' : 'Withdrawal'),
        id: w.id,
        fundId: fund.id,
      });
    });
    events.sort((a, b) => new Date(b.date) - new Date(a.date));

    const historyRows = events.slice(0, 12).map(e => {
      const d = new Date(e.date);
      const dateStr = e.type === 'contribution'
        ? e.note
        : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      return `
        <div class="fund-history-row">
          <span class="fund-history-label">${dateStr}${noteHtml}${deleteBtn}</span>
          <span class="fund-history-amount ${amtClass}">${sign}$${fmt(e.amount, 2)}</span>
        </div>`;
    }).join('');

    return `
      <div class="fund-card">
        <div class="fund-card-head">
          <div class="fund-card-name">${escapeHtml(fund.name)}</div>
          <div class="fund-card-balance">$${fmt(c.balance, 2)}</div>
        </div>
        <div class="fund-card-body">
          <div class="fund-card-meta">
            <span>$<strong>${fmt(fund.monthlyAmount)}</strong>/mo</span>
            <span><strong>${c.months}</strong> month${c.months !== 1 ? 's' : ''} funded</span>
            <span>Contributed: $<strong>${fmt(c.totalContributed, 2)}</strong></span>
            ${c.totalWithdrawn > 0 ? `<span>Spent: $<strong>${fmt(c.totalWithdrawn, 2)}</strong></span>` : ''}
            ${linked ? `<span class="linked-badge" style="display:inline-flex;" title="Linked to ${escapeHtml(linked.item.name)} in ${linked.group}">⚡ ${escapeHtml(linked.item.name)}</span>` : ''}
          </div>
          ${hasGoal ? `
            <div class="fund-card-bar">
              <div class="fund-card-bar-fill ${barClass}" style="width: ${goalPctClamped}%"></div>
            </div>
            <div class="fund-card-goal-text">
              ${c.goalPct >= 100 ? 'Goal reached!' : `${goalPctClamped.toFixed(0)}% of $${fmt(fund.goalAmount)} goal`}
              ${c.goalPct < 100 && fund.monthlyAmount > 0 ? ` · ~${Math.ceil((fund.goalAmount - c.balance) / fund.monthlyAmount)} months to go` : ''}
            </div>
          ` : ''}
        </div>
        <div class="fund-card-actions">
          <button class="fund-btn withdraw" data-action="fund-withdraw" data-fund-id="${fund.id}">↗ Withdraw</button>
          <button class="fund-btn" data-action="fund-deposit" data-fund-id="${fund.id}">↙ Deposit</button>
          <button class="fund-btn" data-action="fund-edit" data-fund-id="${fund.id}">Edit</button>
          <button class="fund-btn delete" data-action="fund-delete" data-fund-id="${fund.id}">×</button>
        </div>
        ${events.length > 0 ? `
          <div class="fund-history">
            ${historyRows}
          </div>
        ` : ''}
      </div>`;
  }).join('');

  // Check if any fund is being edited.
  const editSection = editFundId ? renderFundEditForm(editFundId) : '';

  return `
    <div class="funds-hero">
      <div class="funds-hero-label">Total fund balance</div>
      <div class="funds-hero-amount">$${fmt(totalBalance, 2)}</div>
      <div class="funds-hero-sub">
        ${funds.length} fund${funds.length !== 1 ? 's' : ''} · $${fmt(totalMonthly)} auto-funded per month
      </div>
    </div>
    ${editSection}
    <div class="funds-grid">
      ${fundCards}
    </div>
  `;
}

function renderFundEditForm(fundId) {
  const fund = state.autoFunds.find(f => f.id === fundId);
  if (!fund) { editFundId = null; return ''; }

  const rateRows = fund.rates.length > 1 ? `
    <div style="margin-top:14px;">
      <div class="form-label" style="margin-bottom:8px;">Rate history</div>
      <div style="font-family:var(--mono-font);font-size:11px;color:var(--text-dim);">
        ${fund.rates.map((r, i) => {
          const endLabel = i < fund.rates.length - 1
            ? prevMonthKey(fund.rates[i + 1].startMonth)
            : 'present';
          return `<div style="display:flex;justify-content:space-between;padding:4px 0;${i > 0 ? 'border-top:1px solid var(--border);' : ''}">
            <span>${monthLabel(r.startMonth)} → ${endLabel === 'present' ? 'now' : monthLabel(endLabel)}</span>
            <span style="color:var(--text);">$${fmt(r.amount)}/mo</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  ` : '';

  return `
    <div class="fund-form-section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div class="fund-form-title">Editing: ${escapeHtml(fund.name)}</div>
        <button class="icon-btn" data-action="fund-edit-close" aria-label="Close editor">✕</button>
      </div>
      <div class="fund-edit-grid">
        <div class="form-group">
          <label class="form-label">Fund name</label>
          <input class="form-input fund-name-input" type="text" value="${escapeHtml(fund.name)}"
                 data-fund-id="${fund.id}" data-fund-field="name" placeholder="e.g. Car Maintenance" />
        </div>
        <div class="form-group">
          <label class="form-label">Monthly contribution</label>
          <input class="form-input" type="number" step="0.01" inputmode="decimal"
                 value="${fund.monthlyAmount || 0}"
                 data-fund-id="${fund.id}" data-fund-field="monthlyAmount" placeholder="0" />
        </div>
        <div class="form-group">
          <label class="form-label">Started</label>
          <div style="display:flex;gap:8px;">
            <select class="form-input" style="flex:1;" data-fund-id="${fund.id}" data-fund-field="startMonth" data-part="month">
              ${MONTH_NAMES.map((m, i) => `<option value="${i+1}" ${parseInt(fund.startMonth.split('-')[1]) === i+1 ? 'selected' : ''}>${m}</option>`).join('')}
            </select>
            <select class="form-input" style="flex:1;" data-fund-id="${fund.id}" data-fund-field="startMonth" data-part="year">
              ${(() => {
                const curY = new Date().getFullYear();
                let opts = '';
                for (let y = curY - 5; y <= curY + 1; y++) {
                  opts += '<option value="' + y + '"' + (parseInt(fund.startMonth.split('-')[0]) === y ? ' selected' : '') + '>' + y + '</option>';
                }
                return opts;
              })()}
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Goal amount (0 = no goal)</label>
          <input class="form-input" type="number" step="0.01" inputmode="decimal"
                 value="${fund.goalAmount || 0}"
                 data-fund-id="${fund.id}" data-fund-field="goalAmount" placeholder="0" />
        </div>
      </div>
      ${rateRows}
    </div>
  `;
}

  const themeCards = AVAILABLE_THEMES.map(t => `
    <button class="theme-card ${config.theme === t.id ? 'active' : ''}" data-action="set-theme" data-theme-id="${t.id}">
      <span class="theme-card-check">✓</span>
      <div class="theme-card-name">${t.name}</div>
      <div class="theme-swatch">
        ${t.swatch.map(c => `<div class="theme-swatch-seg" style="background:${c}"></div>`).join('')}
      </div>
    </button>
  `).join('');

  return `
    <div class="settings-card">
      <h2 class="settings-title">Appearance</h2>
      <div class="settings-row" style="border-bottom:none;flex-direction:column;align-items:stretch;">
        <div class="settings-info" style="margin-bottom:8px;">
          <div class="settings-label">Color theme</div>
          <div class="settings-desc">Choose a theme. Your selection is saved on this device.</div>
        </div>
        <div class="theme-grid">
          ${themeCards}
        </div>
      </div>
    </div>

    <div class="settings-card">
      <h2 class="settings-title">Google Drive sync</h2>
      <div class="settings-row">
        <div class="settings-info">
          <div class="settings-label">OAuth Client ID</div>
          <div class="settings-desc">From your Google Cloud project. Paste it once, on each device.</div>
          <input class="config-input" id="client-id-input" placeholder="123456789-abc...apps.googleusercontent.com" value="${escapeHtml(config.clientId || '')}" />
        </div>
      </div>
      <div class="settings-row">
        <div class="settings-info">
          <div class="settings-label">Manual sync</div>
          <div class="settings-desc">Force a pull/push now. Use this the first time on each device to authorize, and any time you want to be sure you're up to date.</div>
        </div>
        <button class="btn-secondary" data-action="manual-sync">Sync now</button>
      </div>
      <div class="help-block">
        <strong style="color:var(--text);">First-time setup:</strong>
        <ol>
          <li>Create a Google account (e.g. <code>yourname@gmail.com</code>)</li>
          <li>Sign into it, go to <code>console.cloud.google.com</code></li>
          <li>Create a new project (any name)</li>
          <li>APIs &amp; Services → Enable APIs → enable <strong>Google Drive API</strong></li>
          <li>APIs &amp; Services → OAuth consent screen → External → fill in app name + your email → add scope <code>drive.file</code> → add yourself as test user</li>
          <li>APIs &amp; Services → Credentials → Create Credentials → OAuth Client ID → Web application → add your URL to <strong>Authorized JavaScript origins</strong> (e.g. <code>file://</code> won't work; use <code>http://localhost</code> if testing locally, or host the file)</li>
          <li>Copy the Client ID, paste above, then click <strong>Sync now</strong></li>
        </ol>
      </div>
    </div>

    <div class="settings-card">
      <h2 class="settings-title">Data</h2>
      <div class="settings-row">
        <div class="settings-info">
          <div class="settings-label">Export backup</div>
          <div class="settings-desc">Download all your data as a JSON file. Useful as a manual backup or to move data without Drive.</div>
        </div>
        <button class="btn-secondary" data-action="export">Export</button>
      </div>
      <div class="settings-row">
        <div class="settings-info">
          <div class="settings-label">Import backup</div>
          <div class="settings-desc">Load data from an exported JSON file. This replaces all current data.</div>
        </div>
        <button class="btn-secondary" data-action="import">Import</button>
        <input type="file" id="import-input" accept="application/json" style="display:none" />
      </div>
    </div>

    <div class="settings-card">
      <h2 class="settings-title">About</h2>
      <div class="settings-row">
        <div class="settings-info">
          <div class="settings-label">Budget Ledger</div>
          <div class="settings-desc">Version ${APP_VERSION}. A simple, private, local-first monthly budget tracker.</div>
        </div>
      </div>
      <div class="settings-row">
        <div class="settings-info">
          <div class="settings-label">Tax estimates</div>
          <div class="settings-desc">Tax calculations use 2026 federal brackets, statutory FICA rates, and approximate state top marginal rates. These are estimates for budgeting — not tax advice. If your withholding differs, use the manual override field in the Plan tab.</div>
        </div>
      </div>

  `;
}

// ============================================================
//  HANDLERS
// ============================================================
function attachViewHandlers() {
  attachDragHandlers();
  // Plan inputs
  document.querySelectorAll('.plan-input').forEach(input => {
    if (input.dataset.srcId || input.dataset.taxField) return; // handled separately
    input.addEventListener('change', e => {
      const { group, id, field } = e.target.dataset;
      if (!group) return;
      updatePlanItem(group, id, field, e.target.value);
    });
  });

  // Fund-link selects inside plan auto-meta rows
  document.querySelectorAll('.plan-row-auto-meta select[data-field="linkedFundId"]').forEach(sel => {
    sel.addEventListener('change', e => {
      const { group, id, field } = e.target.dataset;
      if (!group) return;
      updatePlanItem(group, id, field, e.target.value);
    });
  });

  // Income source inputs (text/number/select)
  document.querySelectorAll('[data-src-id]').forEach(el => {
    if (el.matches('button')) return; // delete buttons handled by data-action
    const field = el.dataset.field;
    if (!field) return;
    if (el.type === 'checkbox') {
      el.addEventListener('change', e => updateIncomeSource(el.dataset.srcId, field, e.target.checked));
    } else {
      el.addEventListener('change', e => updateIncomeSource(el.dataset.srcId, field, e.target.value));
    }
  });

  // Tax config controls
  document.querySelectorAll('[data-tax-field]').forEach(el => {
    el.addEventListener('change', e => updateTaxConfig(el.dataset.taxField, e.target.value));
  });

  // Assets: snapshot date/label
  document.querySelectorAll('[data-snap-field]').forEach(el => {
    el.addEventListener('change', e => updateSnapshotField(el.dataset.snapId, el.dataset.snapField, e.target.value));
  });

  // Assets: entry name/type/amount
  document.querySelectorAll('[data-entry-field]').forEach(el => {
    el.addEventListener('change', e => updateEntry(el.dataset.snapId, el.dataset.entryId, el.dataset.entryField, e.target.value));
  });

  // Action buttons
  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', e => {
      const action = e.currentTarget.dataset.action;
      const ds = e.currentTarget.dataset;
      if (action === 'reset-month') resetMonth();
      else if (action === 'delete-txn') deleteTransaction(ds.id);
      else if (action === 'add-category') addCategory(ds.group);
      else if (action === 'remove-category') removeCategory(ds.group, ds.id);
      else if (action === 'add-source') addIncomeSource();
      else if (action === 'remove-source') removeIncomeSource(ds.srcId);
      else if (action === 'add-snapshot') addSnapshot();
      else if (action === 'remove-snapshot') removeSnapshot(ds.snapId);
      else if (action === 'add-entry') addEntry(ds.snapId, ds.entryType);
      else if (action === 'remove-entry') removeEntry(ds.snapId, ds.entryId);
      else if (action === 'toggle-snapshot') toggleSnapshot(ds.snapId);
      else if (action === 'toggle-all-snapshots') toggleAllSnapshots(ds.collapse === 'true');
      else if (action === 'toggle-section') toggleSection(ds.sectionKey);
      else if (action === 'set-theme') {
        applyTheme(ds.themeId);
        saveConfig();
        render();
      }
      else if (action === 'manual-sync') {
        const idInput = document.getElementById('client-id-input');
        if (idInput) {
          config.clientId = idInput.value.trim();
          saveConfig();
        }
        sync({ interactive: true });
      }
      else if (action === 'export') exportData();
      else if (action === 'import') document.getElementById('import-input').click();
      // Fund actions
      else if (action === 'add-fund') addFund();
      else if (action === 'fund-withdraw') addFundWithdrawal(ds.fundId);
      else if (action === 'fund-deposit') {
        const fund = state.autoFunds.find(f => f.id === ds.fundId);
        if (fund) showFundDepositModal(fund);
      }
      else if (action === 'fund-delete') removeFund(ds.fundId);
      else if (action === 'fund-edit') {
        editFundId = ds.fundId;
        render();
      }
      else if (action === 'fund-edit-close') {
        editFundId = null;
        render();
      }
      else if (action === 'delete-fund-withdrawal') deleteFundWithdrawal(ds.fundId, ds.withdrawalId);
      else if (action === 'toggle-auto') {
        const items = currentPlan()[ds.group];
        const item = items ? items.find(i => i.id === ds.id) : null;
        if (item) updatePlanItem(ds.group, ds.id, 'isAuto', !item.isAuto);
      }
      else if (action === 'go-to-fund') {
        activeTab = 'funds';
        render();
      }
    });
  });

  // Fund field inputs
  document.querySelectorAll('[data-fund-field]').forEach(el => {
    el.addEventListener('change', e => {
      const fundId = el.dataset.fundId;
      const field = el.dataset.fundField;
      if (field === 'startMonth') {
        // Combine month + year selects into YYYY-MM.
        const container = el.closest('.form-group');
        const monthSel = container.querySelector('[data-part="month"]');
        const yearSel = container.querySelector('[data-part="year"]');
        if (monthSel && yearSel) {
          const combined = yearSel.value + '-' + String(monthSel.value).padStart(2, '0');
          updateFund(fundId, field, combined);
        }
      } else {
        updateFund(fundId, field, e.target.value);
      }
    });
  });

  // Client ID save on blur
  const idInput = document.getElementById('client-id-input');
  if (idInput) {
    idInput.addEventListener('change', e => {
      config.clientId = e.target.value.trim();
      saveConfig();
      accessToken = null;
      tokenClient = null;
      gapiReady = false;
      gisReady = false;
    });
  }

  // Import file picker
  const importInput = document.getElementById('import-input');
  if (importInput) {
    importInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        const hasPlan = data.plan || data.plans;
        if (!hasPlan || !data.transactions) throw new Error('Invalid backup file');
        if (!confirm('Replace all current data with this backup?')) return;
        state = data;
        migrateState();
        saveLocal();
        render();
        toast('Data imported', 'success');
        debouncedSync();
      } catch (err) {
        toast('Import failed: ' + err.message, 'error');
      }
    });
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `budget-ledger-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup downloaded', 'success');
}

// ============================================================
//  MODAL
// ============================================================
function showAddModal() {
  const host = document.getElementById('modal-host');
  let selectedCat = '';

  host.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="modal">
        <div class="modal-header">
          <h2 class="modal-title">New transaction</h2>
          <button class="icon-btn" id="modal-close" aria-label="Close">✕</button>
        </div>
        <div class="form-group">
          <label class="form-label">Amount</label>
          <input class="form-input amount-input" type="number" inputmode="decimal" step="0.01" id="amt-input" placeholder="0.00" autofocus />
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <div class="cat-picker" id="cat-picker">
            <div class="cat-pick-group">Needs</div>
            ${currentPlan().needs.map(c => `<button class="cat-pick-btn" data-cat="${c.id}">${escapeHtml(c.name)}</button>`).join('')}
            <div class="cat-pick-group">Wants</div>
            ${currentPlan().wants.map(c => `<button class="cat-pick-btn" data-cat="${c.id}">${escapeHtml(c.name)}</button>`).join('')}
            <div class="cat-pick-group">Savings</div>
            ${currentPlan().savings.map(c => `<button class="cat-pick-btn" data-cat="${c.id}">${escapeHtml(c.name)}</button>`).join('')}
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Note (optional)</label>
          <input class="form-input" type="text" id="note-input" placeholder="Kroger, gas station, etc." />
        </div>
        <button class="btn-primary" id="add-btn">Add transaction</button>
      </div>
    </div>`;

  const closeModal = () => { host.innerHTML = ''; };

  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target.id === 'modal-overlay') closeModal();
  });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.querySelectorAll('[data-cat]').forEach(b => {
    b.addEventListener('click', e => {
      selectedCat = e.currentTarget.dataset.cat;
      document.querySelectorAll('.cat-pick-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.cat === selectedCat);
      });
    });
  });
  document.getElementById('add-btn').addEventListener('click', () => {
    const amt = parseFloat(document.getElementById('amt-input').value);
    const note = document.getElementById('note-input').value.trim();
    if (!amt || amt <= 0 || !selectedCat) {
      toast('Need an amount and a category', 'error');
      return;
    }
    addTransaction({ amount: amt, categoryId: selectedCat, note });
    closeModal();
  });
  setTimeout(() => document.getElementById('amt-input')?.focus(), 50);
}

// ============================================================
//  INIT
// ============================================================
function init() {
  loadLocal();
  applyTheme(config.theme || 'matcha');
  initMonthPicker();
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      activeTab = t.dataset.tab;
      render();
    });
  });
  document.getElementById('tabs-mobile-select').addEventListener('change', (e) => {
    activeTab = e.target.value;
    render();
  });
  document.getElementById('fab').addEventListener('click', () => {
    if (activeTab === 'assets') addSnapshot();
    else if (activeTab === 'funds') addFund();
    else showAddModal();
  });
  document.getElementById('settings-btn').addEventListener('click', () => {
    activeTab = activeTab === 'settings' ? 'dashboard' : 'settings';
    render();
  });
  document.getElementById('sync-status').addEventListener('click', () => {
    if (config.clientId) sync({ interactive: true });
    else { activeTab = 'settings'; render(); }
  });

  render();

  if (config.clientId) {
    setTimeout(() => sync(), 1000);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

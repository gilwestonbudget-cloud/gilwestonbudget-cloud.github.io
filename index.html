}

function renderFunds() {
  const funds = state.autoFunds;
  const totalBalance = funds.reduce((a, f) => a + computeFund(f).balance, 0);
  const totalMonthly = funds.reduce((a, f) => a + f.monthlyAmount, 0);

  if (funds.length === 0) {
    return `
      <div class="fund-empty">
        <div class="fund-empty-big">No sinking funds yet</div>
        <div style="max-width:420px;margin:0 auto 20px;line-height:1.6;">
          Sinking funds let you set aside a fixed amount each month for future expenses — car repairs, vacations, gifts, and more. The balance grows automatically over time.
        </div>
        <button class="btn-primary" style="max-width:280px;margin:0 auto;" data-action="add-fund">
          Create your first fund
        </button>
      </div>`;
  }

  const fundCards = funds.map(fund => {
    const c = computeFund(fund);
    const hasGoal = fund.goalAmount > 0;
    const goalPctClamped = Math.min(c.goalPct, 100);
    const barClass = c.goalPct >= 100 ? 'full' : c.goalPct >= 70 ? 'warn' : '';
    const linked = linkedPlanItem(fund.id);

    // Build event history: monthly contributions + withdrawals, sorted newest first.
    const events = [];
    // Add monthly contribution entries for last 6 months (or since start).
    const [cY, cM] = currentMonthKey().split('-').map(Number);
    for (let i = 0; i < Math.min(c.months, 6); i++) {
      let m = cM - i;
      let y = cY;
      while (m < 1) { m += 12; y--; }
      const mk = `${y}-${String(m).padStart(2, '0')}`;
      events.push({
        date: new Date(y, m - 1, 1).toISOString(),
        month: mk,
        type: 'contribution',
        amount: rateForMonth(fund, mk),
        note: monthLabel(mk),
      });
    }
    // Add withdrawals.
    fund.withdrawals.forEach(w => {
      events.push({
        date: w.date,
        type: w.amount < 0 ? 'deposit' : 'withdrawal',
        amount: Math.abs(w.amount),
        note: w.note || (w.amount < 0 ? 'Extra deposit' : 'Withdrawal'),
        id: w.id,
        fundId: fund.id,
      });
    });
    events.sort((a, b) => new Date(b.date) - new Date(a.date));

    const historyRows = events.slice(0, 12).map(e => {
      const d = new Date(e.date);
      const dateStr = e.type === 'contribution'
        ? e.note
        : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const amtClass = e.type === 'withdrawal' ? 'debit' : 'credit';
      const sign = e.type === 'withdrawal' ? '−' : '+';
      const noteHtml = (e.type !== 'contribution' && e.note) ? `<span class="note">${escapeHtml(e.note)}</span>` : '';
      const deleteBtn = e.id ? ` <button class="icon-btn" style="font-size:12px;padding:2px 4px;" data-action="delete-fund-withdrawal" data-fund-id="${e.fundId}" data-withdrawal-id="${e.id}" aria-label="Remove">×</button>` : '';
      return `
        <div class="fund-history-row">
          <span class="fund-history-label">${dateStr}${noteHtml}${deleteBtn}</span>
          <span class="fund-history-amount ${amtClass}">${sign}$${fmt(e.amount, 2)}</span>
        </div>`;
    }).join('');

    return `
      <div class="fund-card">
        <div class="fund-card-head">
          <div class="fund-card-name">${escapeHtml(fund.name)}</div>
          <div class="fund-card-balance">$${fmt(c.balance, 2)}</div>
        </div>
        <div class="fund-card-body">
          <div class="fund-card-meta">
            <span>$<strong>${fmt(fund.monthlyAmount)}</strong>/mo</span>
            <span><strong>${c.months}</strong> month${c.months !== 1 ? 's' : ''} funded</span>
            <span>Contributed: $<strong>${fmt(c.totalContributed, 2)}</strong></span>
            ${c.totalWithdrawn > 0 ? `<span>Spent: $<strong>${fmt(c.totalWithdrawn, 2)}</strong></span>` : ''}
            ${linked ? `<span class="linked-badge" style="display:inline-flex;" title="Linked to ${escapeHtml(linked.item.name)} in ${linked.group}">⚡ ${escapeHtml(linked.item.name)}</span>` : ''}
          </div>
          ${hasGoal ? `
            <div class="fund-card-bar">
              <div class="fund-card-bar-fill ${barClass}" style="width: ${goalPctClamped}%"></div>
            </div>
            <div class="fund-card-goal-text">
              ${c.goalPct >= 100 ? 'Goal reached!' : `${goalPctClamped.toFixed(0)}% of $${fmt(fund.goalAmount)} goal`}
              ${c.goalPct < 100 && fund.monthlyAmount > 0 ? ` · ~${Math.ceil((fund.goalAmount - c.balance) / fund.monthlyAmount)} months to go` : ''}
            </div>
          ` : ''}
        </div>
        <div class="fund-card-actions">
          <button class="fund-btn withdraw" data-action="fund-withdraw" data-fund-id="${fund.id}">↗ Withdraw</button>
          <button class="fund-btn" data-action="fund-deposit" data-fund-id="${fund.id}">↙ Deposit</button>
          <button class="fund-btn" data-action="fund-edit" data-fund-id="${fund.id}">Edit</button>
          <button class="fund-btn delete" data-action="fund-delete" data-fund-id="${fund.id}">×</button>
        </div>
        ${events.length > 0 ? `
          <div class="fund-history">
            ${historyRows}
          </div>
        ` : ''}
      </div>`;
  }).join('');

  // Check if any fund is being edited.
  const editSection = editFundId ? renderFundEditForm(editFundId) : '';

  return `
    <div class="funds-hero">
      <div class="funds-hero-label">Total fund balance</div>
      <div class="funds-hero-amount">$${fmt(totalBalance, 2)}</div>
      <div class="funds-hero-sub">
        ${funds.length} fund${funds.length !== 1 ? 's' : ''} · $${fmt(totalMonthly)} auto-funded per month
      </div>
    </div>
    ${editSection}
    <div class="funds-grid">
      ${fundCards}
    </div>
  `;
}

function renderFundEditForm(fundId) {
  const fund = state.autoFunds.find(f => f.id === fundId);
  if (!fund) { editFundId = null; return ''; }

  const rateRows = fund.rates.length > 1 ? `
    <div style="margin-top:14px;">
      <div class="form-label" style="margin-bottom:8px;">Rate history</div>
      <div style="font-family:var(--mono-font);font-size:11px;color:var(--text-dim);">
        ${fund.rates.map((r, i) => {
          const endLabel = i < fund.rates.length - 1
            ? prevMonthKey(fund.rates[i + 1].startMonth)
            : 'present';
          return `<div style="display:flex;justify-content:space-between;padding:4px 0;${i > 0 ? 'border-top:1px solid var(--border);' : ''}">
            <span>${monthLabel(r.startMonth)} → ${endLabel === 'present' ? 'now' : monthLabel(endLabel)}</span>
            <span style="color:var(--text);">$${fmt(r.amount)}/mo</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  ` : '';

  return `
    <div class="fund-form-section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div class="fund-form-title">Editing: ${escapeHtml(fund.name)}</div>
        <button class="icon-btn" data-action="fund-edit-close" aria-label="Close editor">✕</button>
      </div>
      <div class="fund-edit-grid">
        <div class="form-group">
          <label class="form-label">Fund name</label>
          <input class="form-input fund-name-input" type="text" value="${escapeHtml(fund.name)}"
                 data-fund-id="${fund.id}" data-fund-field="name" placeholder="e.g. Car Maintenance" />
        </div>
        <div class="form-group">
          <label class="form-label">Monthly contribution</label>
          <input class="form-input" type="number" step="0.01" inputmode="decimal"
                 value="${fund.monthlyAmount || 0}"
                 data-fund-id="${fund.id}" data-fund-field="monthlyAmount" placeholder="0" />
        </div>
        <div class="form-group">
          <label class="form-label">Started</label>
          <div style="display:flex;gap:8px;">
            <select class="form-input" style="flex:1;" data-fund-id="${fund.id}" data-fund-field="startMonth" data-part="month">
              ${MONTH_NAMES.map((m, i) => `<option value="${i+1}" ${parseInt(fund.startMonth.split('-')[1]) === i+1 ? 'selected' : ''}>${m}</option>`).join('')}
            </select>
            <select class="form-input" style="flex:1;" data-fund-id="${fund.id}" data-fund-field="startMonth" data-part="year">
              ${(() => {
                const curY = new Date().getFullYear();
                let opts = '';
                for (let y = curY - 5; y <= curY + 1; y++) {
                  opts += '<option value="' + y + '"' + (parseInt(fund.startMonth.split('-')[0]) === y ? ' selected' : '') + '>' + y + '</option>';
                }
                return opts;
              })()}
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Goal amount (0 = no goal)</label>
          <input class="form-input" type="number" step="0.01" inputmode="decimal"
                 value="${fund.goalAmount || 0}"
                 data-fund-id="${fund.id}" data-fund-field="goalAmount" placeholder="0" />
        </div>
      </div>
      ${rateRows}
    </div>
  `;
}

function attachViewHandlers() {
  attachDragHandlers();
  setupNetWorthChartHover();
  setupStickyBar();
  // Plan inputs
  document.querySelectorAll('.plan-input').forEach(input => {
    if (input.dataset.srcId || input.dataset.taxField) return; // handled separately
    input.addEventListener('change', e => {
      const { group, id, field } = e.target.dataset;
      if (!group) return;
      updatePlanItem(group, id, field, e.target.value);
    });
  });

  // Fund-link selects inside plan auto-meta rows
  document.querySelectorAll('.plan-row-auto-meta select[data-field="linkedFundId"]').forEach(sel => {
    sel.addEventListener('change', e => {
      const { group, id, field } = e.target.dataset;
      if (!group) return;
      updatePlanItem(group, id, field, e.target.value);
    });
  });

  // Income source inputs (text/number/select)
  document.querySelectorAll('[data-src-id]').forEach(el => {
    if (el.matches('button')) return; // delete buttons handled by data-action
    const field = el.dataset.field;
    if (!field) return;
    if (el.type === 'checkbox') {
      el.addEventListener('change', e => updateIncomeSource(el.dataset.srcId, field, e.target.checked));
    } else {
      el.addEventListener('change', e => updateIncomeSource(el.dataset.srcId, field, e.target.value));
    }
  });

  // Tax config controls
  document.querySelectorAll('[data-tax-field]').forEach(el => {
    el.addEventListener('change', e => updateTaxConfig(el.dataset.taxField, e.target.value));
  });

  // Assets: snapshot date/label
  document.querySelectorAll('[data-snap-field]').forEach(el => {
    el.addEventListener('change', e => updateSnapshotField(el.dataset.snapId, el.dataset.snapField, e.target.value));
  });

  // Accounts: per-account balance amount within a snapshot
  document.querySelectorAll('[data-entry-amount-field]').forEach(el => {
    el.addEventListener('change', e => updateEntryAmount(el.dataset.snapId, el.dataset.acctId, e.target.value));
  });

  // Action buttons
  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', e => {
      const action = e.currentTarget.dataset.action;
      const ds = e.currentTarget.dataset;
      if (action === 'reset-month') resetMonth();
      else if (action === 'delete-txn') deleteTransaction(ds.id);
      else if (action === 'add-category') addCategory(ds.group);
      else if (action === 'remove-category') removeCategory(ds.group, ds.id);
      else if (action === 'add-source') addIncomeSource();
      else if (action === 'remove-source') removeIncomeSource(ds.srcId);
      else if (action === 'add-snapshot') addSnapshot();
      else if (action === 'remove-snapshot') removeSnapshot(ds.snapId);
      else if (action === 'add-account') showAccountModal(null);
      else if (action === 'edit-account') showAccountModal(findAccount(ds.acctId));
      else if (action === 'delete-account') removeAccount(ds.acctId);
      else if (action === 'restore-account') restoreAccount(ds.acctId);
      else if (action === 'hard-delete-account') hardDeleteAccount(ds.acctId);
      else if (action === 'toggle-snapshot') toggleSnapshot(ds.snapId);
      else if (action === 'toggle-section') toggleSection(ds.sectionKey);
      else if (action === 'set-chart-range') {
        config.accountsChartRange = ds.range;
        saveConfig();
        render();
      }
      else if (action === 'set-funds-in-net') {
        config.excludeFundsFromNetWorth = ds.value === 'true';
        saveConfig();
        render();
      }
      else if (action === 'set-plan-view') {
        config.planViewMode = ds.view === 'planned' ? 'planned' : 'spent';
        saveConfig();
        render();
      }
      else if (action === 'set-theme') {
        applyTheme(ds.themeId);
        saveConfig();
        render();
      }
      else if (action === 'manual-sync') {
        const idInput = document.getElementById('client-id-input');
        if (idInput) {
          config.clientId = idInput.value.trim();
          saveConfig();
        }
        sync({ interactive: true });
      }
      else if (action === 'export') exportData();
      else if (action === 'import') document.getElementById('import-input').click();
      // Fund actions
      else if (action === 'add-fund') addFund();
      else if (action === 'fund-withdraw') addFundWithdrawal(ds.fundId);
      else if (action === 'fund-deposit') {
        const fund = state.autoFunds.find(f => f.id === ds.fundId);
        if (fund) showFundDepositModal(fund);
      }
      else if (action === 'fund-delete') removeFund(ds.fundId);
      else if (action === 'fund-edit') {
        editFundId = ds.fundId;
        render();
      }
      else if (action === 'fund-edit-close') {
        editFundId = null;
        render();
      }
      else if (action === 'delete-fund-withdrawal') deleteFundWithdrawal(ds.fundId, ds.withdrawalId);
      else if (action === 'toggle-auto') {
        const items = currentPlan()[ds.group];
        const item = items ? items.find(i => i.id === ds.id) : null;
        if (item) updatePlanItem(ds.group, ds.id, 'isAuto', !item.isAuto);
      }
      else if (action === 'go-to-fund') {
        activeTab = 'funds';
        render();
      }
    });
  });

  // Fund field inputs
  document.querySelectorAll('[data-fund-field]').forEach(el => {
    el.addEventListener('change', e => {
      const fundId = el.dataset.fundId;
      const field = el.dataset.fundField;
      if (field === 'startMonth') {
        // Combine month + year selects into YYYY-MM.
        const container = el.closest('.form-group');
        const monthSel = container.querySelector('[data-part="month"]');
        const yearSel = container.querySelector('[data-part="year"]');
        if (monthSel && yearSel) {
          const combined = yearSel.value + '-' + String(monthSel.value).padStart(2, '0');
          updateFund(fundId, field, combined);
        }
      } else {
        updateFund(fundId, field, e.target.value);
      }
    });
  });

  // Client ID save on blur
  const idInput = document.getElementById('client-id-input');
  if (idInput) {
    idInput.addEventListener('change', e => {
      config.clientId = e.target.value.trim();
      saveConfig();
      accessToken = null;
      tokenClient = null;
      gapiReady = false;
      gisReady = false;
    });
  }

  // Import file picker
  const importInput = document.getElementById('import-input');
  if (importInput) {
    importInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        const hasPlan = data.plan || data.plans;
        if (!hasPlan || !data.transactions) throw new Error('Invalid backup file');
        if (!confirm('Replace all current data with this backup?')) return;
        state = data;
        migrateState();
        saveLocal();
        render();
        toast('Data imported', 'success');
        debouncedSync();
      } catch (err) {
        toast('Import failed: ' + err.message, 'error');
      }
    });
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `budget-ledger-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup downloaded', 'success');
}

        </div>
        <div class="form-group">
          <label class="form-label">Category — how it counts toward net worth</label>
          <select class="form-select" id="acct-category">
            <option value="asset" ${draft.category === 'asset' ? 'selected' : ''}>Asset (+, liquid)</option>
            <option value="nonAvailable" ${draft.category === 'nonAvailable' ? 'selected' : ''}>Non-Available asset (+, illiquid e.g. retirement)</option>
            <option value="liability" ${draft.category === 'liability' ? 'selected' : ''}>Liability (−, owed)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Date added</label>
          <input class="form-input" type="date" id="acct-date-added" value="${escapeHtml(draft.dateAdded || today)}" />
          <div style="font-size:11px;color:var(--text-faint);margin-top:6px;line-height:1.5;">
            Snapshots dated before this won't show this account. If you've actually had it for a while and want it reflected in older snapshots, set this back to when you opened it.
          </div>
        </div>
        <button class="btn-primary" id="acct-save-btn">${isEdit ? 'Save changes' : 'Add account'}</button>
        ${isEdit ? `<button class="btn-secondary" id="acct-delete-btn" style="margin-top:8px;">Delete account</button>` : ''}
      </div>
    </div>`;

  const closeModal = () => { host.innerHTML = ''; };
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target.id === 'modal-overlay') closeModal();
  });
  document.getElementById('modal-close').addEventListener('click', closeModal);

  const typeSel = document.getElementById('acct-type');
  const instSel = document.getElementById('acct-institution');
  const instCustom = document.getElementById('acct-institution-custom');
  const instPreview = document.getElementById('acct-inst-preview');
  const categorySel = document.getElementById('acct-category');

  // Picking a type suggests a matching category, but never overrides one
  // the person already chose deliberately on an existing account edit.
  typeSel.addEventListener('change', () => {
    if (!isEdit) categorySel.value = accountTypeInfo(typeSel.value).defaultCategory;
  });

  function refreshInstPreview() {
    const isCustom = instSel.value === 'custom';
    instCustom.style.display = isCustom ? '' : 'none';
    const fake = isCustom
      ? { institutionId: 'custom', institutionCustom: instCustom.value || '?' }
      : { institutionId: instSel.value };
    instPreview.innerHTML = institutionBadge(fake, 36);
  }
  instSel.addEventListener('change', refreshInstPreview);
  instCustom.addEventListener('input', refreshInstPreview);

  document.getElementById('acct-save-btn').addEventListener('click', () => {
    const name = document.getElementById('acct-name').value.trim();
    const type = typeSel.value;
    const institutionId = instSel.value;
    const institutionCustom = instCustom.value.trim();
    const last4 = document.getElementById('acct-last4').value.trim();
    const category = categorySel.value;
    const dateAdded = document.getElementById('acct-date-added').value || today;
    if (institutionId === 'custom' && !institutionCustom) {
      toast('Enter the institution name', 'error');
      return;
    }
    if (last4 && !/^\d{1,4}$/.test(last4)) {
      toast('Last 4 digits should be numbers only', 'error');
      return;
    }
    if (dateAdded > today) {
      toast("Date added can't be in the future", 'error');
      return;
    }
    const data = { name, type, institutionId, institutionCustom, last4, category, dateAdded };
    if (isEdit) updateAccount(existing.id, data);
    else addAccount(data);
    closeModal();
  });

  if (isEdit) {
    document.getElementById('acct-delete-btn').addEventListener('click', () => {
      closeModal();
      removeAccount(existing.id);
    });
  }
}

// ============================================================
//  MODAL
// ============================================================
function showAddModal() {
  const host = document.getElementById('modal-host');
  let selectedCat = '';

  host.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="modal">
        <div class="modal-header">
          <h2 class="modal-title">New transaction</h2>
          <button class="icon-btn" id="modal-close" aria-label="Close">✕</button>
        </div>
        <div class="form-group">
          <label class="form-label">Amount</label>
          <input class="form-input amount-input" type="number" inputmode="decimal" step="0.01" id="amt-input" placeholder="0.00" autofocus />
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <div class="cat-picker" id="cat-picker">
            <div class="cat-pick-group">Needs</div>
            ${currentPlan().needs.map(c => `<button class="cat-pick-btn" data-cat="${c.id}">${escapeHtml(c.name)}</button>`).join('')}
            <div class="cat-pick-group">Wants</div>
            ${currentPlan().wants.map(c => `<button class="cat-pick-btn" data-cat="${c.id}">${escapeHtml(c.name)}</button>`).join('')}
            <div class="cat-pick-group">Savings</div>
            ${currentPlan().savings.map(c => `<button class="cat-pick-btn" data-cat="${c.id}">${escapeHtml(c.name)}</button>`).join('')}
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Note (optional)</label>
          <input class="form-input" type="text" id="note-input" placeholder="Kroger, gas station, etc." />
        </div>
        <button class="btn-primary" id="add-btn">Add transaction</button>
      </div>
    </div>`;

  const closeModal = () => { host.innerHTML = ''; };

  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target.id === 'modal-overlay') closeModal();
  });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.querySelectorAll('[data-cat]').forEach(b => {
    b.addEventListener('click', e => {
      selectedCat = e.currentTarget.dataset.cat;
      document.querySelectorAll('.cat-pick-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.cat === selectedCat);
      });
    });
  });
  document.getElementById('add-btn').addEventListener('click', () => {
    const amt = parseFloat(document.getElementById('amt-input').value);
    const note = document.getElementById('note-input').value.trim();
    if (!amt || amt <= 0 || !selectedCat) {
      toast('Need an amount and a category', 'error');
      return;
    }
    addTransaction({ amount: amt, categoryId: selectedCat, note });
    closeModal();
  });
  setTimeout(() => document.getElementById('amt-input')?.focus(), 50);
}

// ============================================================
//  INIT
// ============================================================
function init() {
  loadLocal();
  applyTheme(config.theme || 'matcha');
  initMonthPicker();
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      activeTab = t.dataset.tab;
      render();
    });
  });
  document.getElementById('tabs-mobile-select').addEventListener('change', (e) => {
    activeTab = e.target.value;
    render();
  });
  document.getElementById('fab').addEventListener('click', () => {
    if (activeTab === 'accounts') addSnapshot();
    else if (activeTab === 'funds') addFund();
    else showAddModal();
  });
  document.getElementById('settings-btn').addEventListener('click', () => {
    activeTab = activeTab === 'settings' ? 'dashboard' : 'settings';
    render();
  });
  document.getElementById('sync-status').addEventListener('click', () => {
    if (config.clientId) sync({ interactive: true });
    else { activeTab = 'settings'; render(); }
  });

  render();

  if (config.clientId) {
    setTimeout(() => sync(), 1000);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>

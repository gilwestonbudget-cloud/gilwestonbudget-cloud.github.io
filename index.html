<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Budget Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: hidden; }

  /* ============================================================
     THEME: Matcha (default) — original colors
     ============================================================ */
  :root,
  [data-theme="matcha"] {
    --bg: #0f1410;
    --bg-card: #161c17;
    --bg-elevated: #1d2520;
    --border: #2a332b;
    --border-bright: #3a463c;
    --text: #e8efe6;
    --text-dim: #8a9489;
    --text-faint: #5a6259;
    --accent: #d4ff4f;
    --accent-dim: #9ab838;
    --accent-rgb: 212, 255, 79;
    --warn: #ff8c42;
    --danger: #ff5e5e;
    --good: #4fd49e;
    --bar-needs: #6fa8dc;
    --bar-wants: #ff8c42;
    --bar-savings: #d4ff4f;
    --glow-1: rgba(212, 255, 79, 0.04);
    --glow-2: rgba(79, 212, 158, 0.03);
  }

  /* ============================================================
     THEME: Midnight — cool blues
     ============================================================ */
  [data-theme="midnight"] {
    --bg: #0a0f1a;
    --bg-card: #131a28;
    --bg-elevated: #1c2438;
    --border: #2b3450;
    --border-bright: #3d4970;
    --text: #e6eaf2;
    --text-dim: #8a93a8;
    --text-faint: #5a6379;
    --accent: #6fa8ff;
    --accent-dim: #4a80d0;
    --accent-rgb: 111, 168, 255;
    --warn: #ffb84d;
    --danger: #ff6b6b;
    --good: #5fd7c2;
    --bar-needs: #9b8cff;
    --bar-wants: #ffb84d;
    --bar-savings: #6fa8ff;
    --glow-1: rgba(111, 168, 255, 0.05);
    --glow-2: rgba(155, 140, 255, 0.04);
  }

  /* ============================================================
     THEME: Warm — warm oranges & deep reds
     ============================================================ */
  [data-theme="warm"] {
    --bg: #14100c;
    --bg-card: #1d1813;
    --bg-elevated: #28211a;
    --border: #3a2f24;
    --border-bright: #4e3f30;
    --text: #f0e9e0;
    --text-dim: #a89a8b;
    --text-faint: #6e6055;
    --accent: #ff9d4d;
    --accent-dim: #d47a30;
    --accent-rgb: 255, 157, 77;
    --warn: #ffd166;
    --danger: #ff5e5e;
    --good: #a8d96f;
    --bar-needs: #c97b63;
    --bar-wants: #ffd166;
    --bar-savings: #ff9d4d;
    --glow-1: rgba(255, 157, 77, 0.05);
    --glow-2: rgba(255, 94, 94, 0.03);
  }

  /* ============================================================
     THEME: Pink — purples & magentas
     ============================================================ */
  [data-theme="pink"] {
    --bg: #120c18;
    --bg-card: #1c1424;
    --bg-elevated: #261b30;
    --border: #382748;
    --border-bright: #4e3760;
    --text: #ece4f2;
    --text-dim: #a293ab;
    --text-faint: #685878;
    --accent: #d68fff;
    --accent-dim: #a868cc;
    --accent-rgb: 214, 143, 255;
    --warn: #ffb070;
    --danger: #ff6b8a;
    --good: #7adba8;
    --bar-needs: #7da6ff;
    --bar-wants: #ffb070;
    --bar-savings: #d68fff;
    --glow-1: rgba(214, 143, 255, 0.05);
    --glow-2: rgba(125, 166, 255, 0.03);
  }

  /* ============================================================
     THEME: Slate — minimal monochrome
     ============================================================ */
  [data-theme="slate"] {
    --bg: #111114;
    --bg-card: #1a1a1f;
    --bg-elevated: #25252d;
    --border: #34343e;
    --border-bright: #494955;
    --text: #ececef;
    --text-dim: #92929c;
    --text-faint: #5e5e68;
    --accent: #e8e8ec;
    --accent-dim: #b8b8c0;
    --accent-rgb: 232, 232, 236;
    --warn: #f5b86b;
    --danger: #ef6e6e;
    --good: #6dcfa1;
    --bar-needs: #7d9bc4;
    --bar-wants: #f5b86b;
    --bar-savings: #d6d6de;
    --glow-1: rgba(232, 232, 236, 0.03);
    --glow-2: rgba(125, 155, 196, 0.02);
  }

  /* ============================================================
     THEME: Daylight — light mode
     ============================================================ */
  [data-theme="daylight"] {
    --bg: #f6f5f0;
    --bg-card: #ffffff;
    --bg-elevated: #ecebe4;
    --border: #d8d6cc;
    --border-bright: #b8b5a6;
    --text: #1f2419;
    --text-dim: #5e6358;
    --text-faint: #8a8e84;
    --accent: #4a8a1c;
    --accent-dim: #3a6e16;
    --accent-rgb: 74, 138, 28;
    --warn: #d97706;
    --danger: #dc2626;
    --good: #059669;
    --bar-needs: #2563eb;
    --bar-wants: #d97706;
    --bar-savings: #4a8a1c;
    --glow-1: rgba(74, 138, 28, 0.04);
    --glow-2: rgba(37, 99, 235, 0.03);
  }

  :root {
    --display-font: 'Fraunces', Georgia, serif;
    --body-font: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono-font: 'JetBrains Mono', ui-monospace, monospace;
  }

  body {
    min-height: 100vh;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body-font);
    padding: max(24px, env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom)) 16px;
    background-image:
      radial-gradient(circle at 15% 10%, var(--glow-1) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, var(--glow-2) 0%, transparent 40%);
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.3s, color 0.3s;
  }
  .container { max-width: 1080px; margin: 0 auto; }
  .header {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
  }
  .header-title {
    font-family: var(--display-font);
    font-weight: 400; font-size: 38px;
    letter-spacing: -0.02em; line-height: 1;
    font-style: italic;
  }
  .header-title .accent { color: var(--accent); font-style: normal; font-weight: 500; }
  .header-sub {
    font-family: var(--mono-font); font-size: 11px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.15em; margin-top: 6px;
  }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .month-picker { position: relative; }
  .month-picker-trigger {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 14px; font-family: var(--mono-font); font-size: 13px;
    color: var(--text); cursor: pointer; outline: none;
    display: inline-flex; align-items: center; gap: 8px;
    transition: border-color 0.2s, color 0.2s;
    min-width: 130px; justify-content: space-between;
  }
  .month-picker-trigger:hover { border-color: var(--border-bright); }
  .month-picker-trigger[aria-expanded="true"] {
    border-color: var(--accent); color: var(--accent);
  }
  .month-picker-trigger svg { color: var(--text-dim); flex-shrink: 0; }
  .month-picker-trigger[aria-expanded="true"] svg { color: var(--accent); }

  .month-popover {
    position: absolute; top: calc(100% + 6px); right: 0;
    background: var(--bg-card); border: 1px solid var(--border-bright);
    border-radius: 14px; padding: 14px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    z-index: 60; width: 260px;
    animation: popover-in 0.15s ease-out;
  }
  @keyframes popover-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .month-popover-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .month-popover-year {
    font-family: var(--display-font); font-size: 18px; font-weight: 500;
    font-style: italic;
  }
  .month-nav {
    background: none; border: none; color: var(--text-dim);
    font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 10px;
    border-radius: 6px; font-family: var(--body-font);
  }
  .month-nav:hover { background: var(--bg-elevated); color: var(--text); }
  .month-popover-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  }
  .month-popover-cell {
    background: none; border: 1px solid transparent;
    color: var(--text-dim); font-family: var(--body-font); font-size: 13px;
    padding: 10px 6px; border-radius: 8px; cursor: pointer;
    transition: all 0.15s;
  }
  .month-popover-cell:hover { background: var(--bg-elevated); color: var(--text); }
  .month-popover-cell.current { border-color: var(--border-bright); color: var(--text); }
  .month-popover-cell.selected {
    background: var(--accent); color: var(--bg);
    font-weight: 600;
  }
  .month-popover-cell.selected:hover { background: var(--accent); }
  .month-popover-cell.disabled,
  .month-popover-cell[disabled] {
    color: var(--text-faint); opacity: 0.35;
    cursor: not-allowed; pointer-events: none;
  }
  .month-nav[disabled] {
    color: var(--text-faint); opacity: 0.3;
    cursor: not-allowed;
  }
  .month-nav[disabled]:hover { background: none; color: var(--text-faint); }

  .sync-status {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px;
    font-family: var(--mono-font); font-size: 11px;
    color: var(--text-dim); cursor: pointer;
    transition: border-color 0.2s;
  }
  .sync-status:hover { border-color: var(--border-bright); }
  .sync-status.synced { color: var(--good); }
  .sync-status.syncing { color: var(--accent); }
  .sync-status.error { color: var(--danger); }
  .sync-status.offline { color: var(--text-faint); }
  .sync-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
  }
  .sync-dot.spin { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

  .settings-btn {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text-dim); cursor: pointer;
    transition: all 0.2s;
  }
  .settings-btn:hover { border-color: var(--border-bright); color: var(--text); }
  .settings-btn.active {
    border-color: var(--accent); color: var(--accent);
    background: rgba(var(--accent-rgb), 0.06);
  }
  .settings-btn svg { display: block; }

  .tabs {
    display: flex; gap: 4px; background: var(--bg-card);
    padding: 4px; border-radius: 12px; border: 1px solid var(--border);
    margin-bottom: 24px; width: fit-content; max-width: 100%;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; /* Firefox */
  }
  .tabs::-webkit-scrollbar { display: none; } /* Chrome/Safari */
  .tab {
    padding: 10px 20px; background: none; border: none;
    color: var(--text-dim); font-family: var(--body-font);
    font-size: 13px; font-weight: 500; cursor: pointer;
    border-radius: 8px; transition: all 0.2s;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--bg-elevated); color: var(--accent); }

  /* Mobile tab dropdown — replaces tab bar on small screens */
  .tabs-mobile {
    display: none; margin-bottom: 24px;
  }
  .tabs-mobile-select {
    width: 100%; appearance: none; -webkit-appearance: none;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 40px 12px 16px;
    font-family: var(--body-font); font-size: 14px; font-weight: 500;
    color: var(--accent); cursor: pointer; outline: none;
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='%238a9489' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
    color-scheme: dark;
    transition: border-color 0.2s;
  }
  [data-theme="daylight"] .tabs-mobile-select { color-scheme: light; }
  .tabs-mobile-select:focus { border-color: var(--accent); }

  .dashboard-top {
    display: grid; grid-template-columns: 2fr 1fr; gap: 16px;
    margin-bottom: 24px;
  }
  @media (max-width: 720px) {
    .dashboard-top { grid-template-columns: 1fr; }
    .header-title { font-size: 32px; }
    /* Swap tab bar for dropdown on mobile */
    .tabs { display: none; }
    .tabs-mobile { display: block; }
  }
  .hero-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 20px; padding: 28px;
    position: relative; overflow: hidden;
  }
  .hero-card::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(var(--accent-rgb), 0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-label {
    font-family: var(--mono-font); font-size: 10px;
    color: var(--text-faint); text-transform: uppercase;
    letter-spacing: 0.2em; margin-bottom: 12px;
  }
  .hero-amount {
    font-family: var(--display-font); font-size: 56px;
    font-weight: 300; letter-spacing: -0.03em; line-height: 1;
  }
  .hero-amount.negative { color: var(--danger); }
  .hero-amount.warn { color: var(--warn); }
  .hero-detail {
    font-family: var(--mono-font); font-size: 12px;
    color: var(--text-dim); margin-top: 12px;
  }
  .hero-bar {
    margin-top: 24px; height: 8px; background: var(--bg-elevated);
    border-radius: 4px; overflow: hidden; display: flex;
  }
  .hero-bar-seg { height: 100%; transition: width 0.4s ease; }
  .hero-bar-needs { background: var(--bar-needs); }
  .hero-bar-wants { background: var(--bar-wants); }
  .hero-bar-savings { background: var(--bar-savings); }
  .hero-legend {
    display: flex; gap: 16px; margin-top: 12px;
    font-family: var(--mono-font); font-size: 11px; flex-wrap: wrap;
  }
  .hero-legend-item {
    display: flex; align-items: center; gap: 6px; color: var(--text-dim);
  }
  .hero-legend-dot { width: 8px; height: 8px; border-radius: 2px; }

  .summary-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 20px; padding: 24px;
  }
  .summary-card-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px; gap: 10px; flex-wrap: wrap;
  }
  .summary-card-head .hero-label { margin-bottom: 0; }
  .plan-view-toggle {
    display: flex; gap: 2px; background: var(--bg-elevated);
    border: 1px solid var(--border); border-radius: 8px; padding: 2px;
  }
  .plan-view-btn {
    background: none; border: none; color: var(--text-faint);
    font-family: var(--body-font); font-size: 11px; font-weight: 500;
    padding: 5px 11px; border-radius: 6px; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .plan-view-btn:hover { color: var(--text-dim); }
  .plan-view-btn.active { background: var(--bg-card); color: var(--accent); }
  .summary-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-label { font-size: 13px; color: var(--text-dim); }
  .summary-value { font-family: var(--mono-font); font-size: 15px; font-weight: 500; }
  .summary-pct { font-family: var(--mono-font); font-size: 11px; color: var(--text-faint); margin-left: 8px; }
  .summary-row-unalloc .summary-label { color: var(--text-faint); font-style: italic; }
  .summary-row-unalloc .summary-value { color: var(--text-faint); }
  .summary-row-unalloc.over .summary-label,
  .summary-row-unalloc.over .summary-value { color: var(--danger); font-style: normal; }

  .group-section { margin-bottom: 32px; }
  .group-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 16px; padding: 0 4px;
  }
  .group-title {
    font-family: var(--display-font); font-size: 24px;
    font-weight: 400; font-style: italic;
  }
  .group-stats {
    font-family: var(--mono-font); font-size: 12px; color: var(--text-dim);
  }
  .cat-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px;
  }
  .cat-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; transition: border-color 0.2s;
  }
  .cat-card:hover { border-color: var(--border-bright); }
  .cat-card.over { border-color: var(--danger); }
  .cat-card.warn { border-color: var(--warn); }
  .cat-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .cat-amounts {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px;
  }
  .cat-spent { font-family: var(--mono-font); font-size: 18px; font-weight: 500; }
  .cat-planned { font-family: var(--mono-font); font-size: 12px; color: var(--text-faint); }
  .cat-progress {
    height: 4px; background: var(--bg-elevated);
    border-radius: 2px; overflow: hidden;
  }
  .cat-progress-fill {
    height: 100%; background: var(--accent);
    transition: width 0.4s ease; border-radius: 2px;
  }
  .cat-progress-fill.warn { background: var(--warn); }
  .cat-progress-fill.over { background: var(--danger); }
  .cat-pct {
    font-family: var(--mono-font); font-size: 10px;
    color: var(--text-faint); margin-top: 6px;
    text-transform: uppercase; letter-spacing: 0.1em;
  }

  .fab {
    position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: 24px;
    width: 64px; height: 64px; background: var(--accent);
    color: var(--bg); border: none; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(var(--accent-rgb), 0.3);
    transition: transform 0.2s; z-index: 50;
    font-size: 32px; font-weight: 300; line-height: 1;
    padding-bottom: 4px;
  }
  .fab:hover { transform: scale(1.05); }
  .fab:active { transform: scale(0.95); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100; padding: 16px; backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  @media (min-width: 720px) { .modal-overlay { align-items: center; } }
  .modal {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 20px; padding: 24px; width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .modal-title { font-family: var(--display-font); font-size: 24px; font-weight: 500; }
  .icon-btn {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; padding: 6px; display: flex; align-items: center;
    justify-content: center; border-radius: 6px; font-size: 18px;
  }
  .icon-btn:hover { background: var(--bg-elevated); color: var(--text); }

  .form-group { margin-bottom: 16px; min-width: 0; }
  .form-label {
    display: block; font-family: var(--mono-font); font-size: 10px;
    color: var(--text-faint); text-transform: uppercase;
    letter-spacing: 0.15em; margin-bottom: 8px;
  }
  .form-input,
  .form-select {
    width: 100%; max-width: 100%; min-width: 0;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; color: var(--text);
    font-family: var(--body-font); font-size: 15px; outline: none;
    color-scheme: dark; box-sizing: border-box;
  }
  [data-theme="daylight"] .form-input,
  [data-theme="daylight"] .form-select { color-scheme: light; }
  .form-input:focus,
  .form-select:focus { border-color: var(--accent); }
  /* iOS Safari can render a date input's internal value box wider than
     the element itself, which spills the text past the right edge.
     Stripping the native appearance forces it to respect our width. */
  input[type="date"].form-input {
    -webkit-appearance: none;
    appearance: none;
    text-align: left;
  }
  .amount-input {
    font-family: var(--mono-font); font-size: 32px; font-weight: 500;
    text-align: center; letter-spacing: 0.02em;
    padding: 16px 14px;
  }

  .cat-picker {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 6px; max-height: 320px;
    overflow-y: auto; overflow-x: hidden;
    padding: 2px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-bright) transparent;
  }
  .cat-picker::-webkit-scrollbar { width: 6px; }
  .cat-picker::-webkit-scrollbar-track { background: transparent; }
  .cat-picker::-webkit-scrollbar-thumb {
    background: var(--border-bright); border-radius: 3px;
  }
  .cat-pick-btn {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text-dim);
    font-size: 12px; cursor: pointer; text-align: left;
    transition: all 0.15s; font-family: var(--body-font);
    min-width: 0; min-height: 42px;
    display: flex; align-items: center;
    line-height: 1.3; word-break: break-word;
  }
  .cat-pick-btn:hover { border-color: var(--border-bright); color: var(--text); }
  .cat-pick-btn.selected {
    border-color: var(--accent); background: rgba(var(--accent-rgb), 0.08);
    color: var(--accent);
  }
  .cat-pick-group {
    font-family: var(--mono-font); font-size: 9px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.15em;
    margin: 12px 0 6px; grid-column: 1 / -1;
  }
  .cat-pick-group:first-child { margin-top: 0; }

  .btn-primary {
    width: 100%; background: var(--accent); color: var(--bg);
    border: none; border-radius: 10px; padding: 14px;
    font-family: var(--body-font); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s; margin-top: 8px;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary {
    background: var(--bg-elevated); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; font-family: var(--body-font); font-size: 12px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--border-bright); }
  .btn-secondary.btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn-danger {
    background: rgba(255, 94, 94, 0.1); color: var(--danger);
    border: 1px solid rgba(255, 94, 94, 0.3);
  }

  .txn-list {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden;
  }
  .txn-row {
    display: grid; grid-template-columns: 1fr auto auto;
    gap: 16px; padding: 14px 18px;
    border-bottom: 1px solid var(--border); align-items: center;
  }
  .txn-row:last-child { border-bottom: none; }
  .txn-row:hover { background: var(--bg-elevated); }
  .txn-cat { font-size: 13px; font-weight: 500; }
  .txn-note {
    font-size: 11px; color: var(--text-faint);
    margin-top: 2px; font-family: var(--mono-font);
  }
  .txn-amount { font-family: var(--mono-font); font-size: 14px; font-weight: 500; }
  .empty {
    padding: 60px 24px; text-align: center;
    color: var(--text-faint); font-size: 13px;
  }
  .empty-big {
    font-family: var(--display-font); font-style: italic;
    font-size: 22px; color: var(--text-dim); margin-bottom: 8px;
  }

  .plan-row {
    display: grid; grid-template-columns: 1fr 110px 32px;
    gap: 12px; padding: 10px 14px;
    align-items: center; border-bottom: 1px solid var(--border);
  }
  .plan-row:last-child { border-bottom: none; }
  .drag-list > .plan-row:last-child { border-bottom: none; }
  .plan-input {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; color: var(--text);
    font-family: var(--mono-font); font-size: 13px; outline: none; width: 100%;
  }
  .plan-input.name-input { font-family: var(--body-font); }
  .plan-input:focus { border-color: var(--accent); }
  .plan-row-delete {
    background: none; border: none; color: var(--text-faint);
    cursor: pointer; padding: 4px 8px; border-radius: 6px;
    font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .plan-row-delete:hover {
    color: var(--danger); background: rgba(255, 94, 94, 0.08);
  }
  .plan-row-add {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 12px 14px;
    background: none; border: none; border-top: 1px dashed var(--border);
    color: var(--text-dim); font-family: var(--body-font); font-size: 12px;
    cursor: pointer; width: 100%;
    transition: all 0.15s;
  }
  .plan-row-add:hover {
    color: var(--accent); background: rgba(var(--accent-rgb), 0.04);
  }
  .plan-row-add-icon {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid currentColor;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
  }
  .plan-section {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 16px; overflow: hidden;
  }
  .plan-section-head {
    padding: 14px 18px; background: var(--bg-elevated);
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .plan-section-title { font-family: var(--display-font); font-size: 18px; font-style: italic; }
  .plan-section-total { font-family: var(--mono-font); font-size: 13px; color: var(--accent); }

  .plan-banner {
    display: flex; align-items: center; gap: 14px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-left: 3px solid var(--warn);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
  }
  .plan-banner-icon {
    font-size: 18px; color: var(--warn);
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 140, 66, 0.1);
    border-radius: 50%; flex-shrink: 0;
  }
  .plan-banner-title { font-size: 13px; font-weight: 500; }
  .plan-banner-sub {
    font-size: 11px; color: var(--text-faint); margin-top: 2px;
    font-family: var(--mono-font); line-height: 1.4;
  }

  /* ============================================================
     INCOME SECTION (multi-source)
     ============================================================ */
  .income-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 16px; overflow: hidden;
  }
  .income-card-head {
    padding: 14px 18px; background: var(--bg-elevated);
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px;
  }
  .income-card-title {
    font-family: var(--display-font); font-size: 18px; font-style: italic;
  }
  .income-card-total {
    font-family: var(--mono-font); font-size: 13px; color: var(--accent);
  }
  .income-source {
    padding: 14px 18px 6px; border-bottom: none;
    display: grid; grid-template-columns: 1fr 130px 130px auto;
    gap: 10px; align-items: center;
  }
  @media (max-width: 720px) {
    .income-source {
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
    }
    .income-source .src-name {
      grid-column: 1 / 3;
      grid-row: 1;
      min-width: 0;
    }
    .income-source .src-delete {
      grid-column: 3 / 4;
      grid-row: 1;
    }
    .income-source .src-freq {
      grid-column: 1 / 2;
      grid-row: 2;
    }
    .income-source .src-amount {
      grid-column: 2 / 4;
      grid-row: 2;
    }
  }
  .income-source-meta {
    padding: 12px 18px 16px;
    margin-top: 4px;
    border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center;
    font-family: var(--mono-font); font-size: 11px; color: var(--text-dim);
  }
  .source-toggle {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    user-select: none;
  }
  .source-toggle input { accent-color: var(--accent); cursor: pointer; }
  .source-net {
    margin-left: auto; color: var(--text);
    font-weight: 500;
  }
  .income-summary {
    padding: 16px 18px; background: var(--bg-elevated);
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;
  }
  @media (max-width: 720px) {
    .income-summary { grid-template-columns: 1fr; gap: 10px; }
  }
  .income-summary-item {
    display: flex; flex-direction: column; gap: 2px;
  }
  .income-summary-label {
    font-family: var(--mono-font); font-size: 10px;
    color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.15em;
  }
  .income-summary-value {
    font-family: var(--mono-font); font-size: 18px; font-weight: 500;
  }
  .income-summary-value.takehome { color: var(--accent); font-size: 22px; }

  /* Tax breakdown details */
  .tax-details {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.15);
  }
  [data-theme="daylight"] .tax-details { background: rgba(0, 0, 0, 0.03); }
  .tax-details summary {
    cursor: pointer; font-family: var(--mono-font); font-size: 11px;
    color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.12em;
    list-style: none;
  }
  .tax-details summary::-webkit-details-marker { display: none; }
  .tax-details summary::before {
    content: '▸ '; display: inline-block; transition: transform 0.15s;
    color: var(--text-faint);
  }
  .tax-details[open] summary::before { transform: rotate(90deg); }
  .tax-details-body {
    margin-top: 12px;
    display: grid; gap: 6px;
    font-family: var(--mono-font); font-size: 12px;
  }
  .tax-line {
    display: flex; justify-content: space-between;
    color: var(--text-dim);
  }
  .tax-line.total {
    border-top: 1px solid var(--border); padding-top: 8px; margin-top: 6px;
    color: var(--text); font-weight: 500;
  }

  /* Tax settings inside plan */
  .tax-config {
    padding: 14px 18px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  @media (max-width: 720px) {
    .tax-config { grid-template-columns: 1fr; }
  }
  .tax-config-group { display: flex; flex-direction: column; gap: 6px; }
  .tax-config-group label {
    font-family: var(--mono-font); font-size: 10px;
    color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.15em;
  }
  .tax-config-group input,
  .tax-config-group select {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; color: var(--text);
    font-family: var(--body-font); font-size: 13px; outline: none;
    color-scheme: dark;
  }
  [data-theme="daylight"] .tax-config-group input,
  [data-theme="daylight"] .tax-config-group select { color-scheme: light; }
  .tax-config-group input:focus,
  .tax-config-group select:focus { border-color: var(--accent); }

  .src-delete-btn {
    background: none; border: none; color: var(--text-faint);
    cursor: pointer; padding: 6px 10px; border-radius: 6px;
    font-size: 18px; line-height: 1;
    transition: all 0.15s;
  }
  .src-delete-btn:hover {
    color: var(--danger); background: rgba(255, 94, 94, 0.08);
  }

  .settings-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; margin-bottom: 16px;
  }
  .settings-title {
    font-family: var(--display-font); font-size: 22px;
    font-style: italic; margin-bottom: 16px;
  }
  .settings-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border); gap: 12px;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-info { flex: 1; min-width: 0; }
  .settings-label { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .settings-desc { font-size: 12px; color: var(--text-faint); line-height: 1.5; }
  .config-input {
    width: 100%; background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text);
    font-family: var(--mono-font); font-size: 12px; outline: none;
    margin-top: 8px;
  }
  .config-input:focus { border-color: var(--accent); }
  .help-block {
    background: var(--bg-elevated); border-left: 2px solid var(--accent);
    padding: 14px 16px; border-radius: 6px; margin-top: 12px;
    font-size: 12px; color: var(--text-dim); line-height: 1.6;
  }
  .help-block ol { margin-left: 18px; }
  .help-block li { margin-bottom: 4px; }
  .help-block code {
    background: var(--bg); padding: 2px 6px; border-radius: 4px;
    font-family: var(--mono-font); font-size: 11px;
    color: var(--accent);
  }

  /* ============================================================
     THEME PICKER
     ============================================================ */
  .theme-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px; margin-top: 12px;
  }
  .theme-card {
    position: relative;
    background: var(--bg-elevated); border: 2px solid var(--border);
    border-radius: 12px; padding: 12px; cursor: pointer;
    transition: all 0.2s; text-align: left;
    display: flex; flex-direction: column; gap: 10px;
    font-family: inherit; color: inherit;
  }
  .theme-card:hover { border-color: var(--border-bright); }
  .theme-card.active { border-color: var(--accent); }
  .theme-card-name {
    font-size: 13px; font-weight: 500; color: var(--text);
    padding-right: 22px; /* room for the corner checkmark */
  }
  .theme-card-check {
    position: absolute; top: 8px; right: 8px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); color: var(--bg);
    display: none; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; line-height: 1;
  }
  .theme-card.active .theme-card-check { display: flex; }
  .theme-swatch {
    display: flex; gap: 4px; height: 32px; border-radius: 6px;
    overflow: hidden; width: 100%;
  }
  .theme-swatch-seg {
    flex: 1; min-width: 0; height: 100%;
    border: 1px solid rgba(255,255,255,0.04);
  }

  /* ============================================================
     FOOTER
     ============================================================ */
  .app-footer {
    margin-top: 48px; padding: 20px 0;
    text-align: center;
    font-family: var(--mono-font); font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.2em;
    border-top: 1px solid var(--border);
  }
  .app-footer .version { color: var(--text-dim); }

  .toast {
    position: fixed; bottom: calc(110px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 18px;
    font-size: 13px; color: var(--text);
    opacity: 0; transition: all 0.3s; z-index: 200;
    pointer-events: none; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--good); color: var(--good); }

  /* ============================================================
     COLLAPSIBLE SECTIONS (Plan tab)
     ============================================================ */
  .section-toggle {
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); padding: 4px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 6px; margin-right: 4px;
    transition: transform 0.2s, color 0.15s, background 0.15s;
    transform-origin: center;
  }
  .section-toggle:hover { color: var(--text); background: var(--bg); }
  .section-toggle.collapsed { transform: rotate(-90deg); }
  .section-toggle svg { display: block; }
  .plan-section-head-left {
    display: flex; align-items: center;
    flex: 1; min-width: 0;
  }
  .plan-section-head-left .plan-section-title { margin-left: 2px; }
  .income-card-head-left {
    display: flex; align-items: center;
    flex: 1; min-width: 0;
  }
  .income-card-head-left .income-card-title { margin-left: 2px; }
  .section-body {
    overflow: hidden;
    max-height: 9999px;
    transition: max-height 0.25s ease;
  }
  .section-body.collapsed {
    max-height: 0;
  }

  /* ============================================================
     DRAG TO REORDER
     ============================================================ */
  .plan-row,
  .income-source,
  .income-source-meta {
    transition: background 0.15s, transform 0.15s, opacity 0.15s;
  }
  .drag-handle {
    cursor: grab;
    color: var(--text-faint);
    padding: 6px 4px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 4px;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    transition: color 0.15s, background 0.15s;
    line-height: 1;
    font-size: 14px;
  }
  .drag-handle:hover { color: var(--text-dim); background: var(--bg); }
  .drag-handle:active { cursor: grabbing; }

  /* The plan-row grid needs columns for drag handle + auto toggle */
  .plan-row {
    grid-template-columns: auto 1fr 110px 34px 32px;
  }
  @media (max-width: 420px) {
    .plan-row {
      grid-template-columns: auto 1fr 80px 30px 28px;
      gap: 6px;
    }
    .plan-row-auto-meta { padding-left: 34px; }
  }

  /* Auto-payment toggle in plan rows */
  .auto-toggle {
    background: none; border: 1px solid var(--border); color: var(--text-faint);
    cursor: pointer; width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; transition: all 0.15s;
    padding: 0; flex-shrink: 0;
  }
  .auto-toggle:hover { border-color: var(--border-bright); color: var(--text-dim); }
  .auto-toggle.active {
    border-color: var(--accent); color: var(--accent);
    background: rgba(var(--accent-rgb), 0.08);
  }
  .auto-toggle[title]::after { content: none; }

  /* Sub-row that appears below auto-enabled plan items */
  .plan-row-auto-meta {
    padding: 4px 14px 10px 46px;
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    font-family: var(--mono-font); font-size: 11px; color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    background: rgba(var(--accent-rgb), 0.02);
  }
  .plan-row-auto-meta select {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; color: var(--text);
    font-family: var(--body-font); font-size: 11px; outline: none;
    cursor: pointer; color-scheme: dark;
  }
  [data-theme="daylight"] .plan-row-auto-meta select { color-scheme: light; }
  .plan-row-auto-meta select:focus { border-color: var(--accent); }
  .auto-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--mono-font); font-size: 9px;
    color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em;
    background: rgba(var(--accent-rgb), 0.08);
    border: 1px solid rgba(var(--accent-rgb), 0.15);
    padding: 2px 7px; border-radius: 4px;
    white-space: nowrap;
  }
  .auto-badge svg { flex-shrink: 0; }

  .linked-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--mono-font); font-size: 9px;
    color: var(--good); text-transform: uppercase; letter-spacing: 0.1em;
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
    background: rgba(79, 212, 158, 0.06);
    border: 1px solid rgba(79, 212, 158, 0.12);
    transition: background 0.15s;
  }
  .linked-badge:hover { background: rgba(79, 212, 158, 0.12); }

  .plan-row.is-auto {
    border-bottom: none;
  }
  .plan-row.is-auto .plan-input.name-input {
    color: var(--accent);
  }

  /* Pair an income-source + its meta row together as a draggable unit */
  .income-source-wrapper {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s, transform 0.15s, opacity 0.15s, box-shadow 0.2s;
    position: relative;
  }
  .drag-list > .income-source-wrapper:last-child { border-bottom: none; }
  .income-source-wrapper .income-source { padding-top: 14px; padding-bottom: 6px; }
  .income-source-wrapper .income-source-meta { border-bottom: none; }

  /* Add a drag handle slot inside the income-source row */
  .income-source { padding-left: 6px; }
  @media (min-width: 721px) {
    .income-source {
      grid-template-columns: auto 1fr 130px 130px auto;
    }
  }
  @media (max-width: 720px) {
    .income-source {
      grid-template-columns: auto 1fr 1fr auto;
    }
    .income-source .src-drag {
      grid-column: 1 / 2;
      grid-row: 1 / 3;
      align-self: center;
    }
    .income-source .src-name {
      grid-column: 2 / 4;
      grid-row: 1;
    }
    .income-source .src-delete {
      grid-column: 4 / 5;
      grid-row: 1;
    }
    .income-source .src-freq {
      grid-column: 2 / 3;
      grid-row: 2;
    }
    .income-source .src-amount {
      grid-column: 3 / 5;
      grid-row: 2;
    }
  }

  /* Drag states */
  .drag-pressing {
    background: var(--bg-elevated) !important;
  }
  .drag-lifted {
    position: relative;
    z-index: 50;
    background: var(--bg-elevated) !important;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    opacity: 0.96;
    cursor: grabbing;
  }
  .drag-ghost {
    opacity: 0.25;
    pointer-events: none;
  }
  .drop-indicator {
    height: 2px;
    background: var(--accent);
    margin: 0 18px;
    border-radius: 1px;
    box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.5);
    pointer-events: none;
  }

  /* ============================================================
     ASSETS / NET WORTH
     ============================================================ */
  .assets-intro { margin-top: 8px; }
  .assets-empty-btn { max-width: 320px; margin: 20px auto 0; }

  .assets-hero {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 20px; padding: 24px; margin-bottom: 24px;
    position: relative; overflow: hidden;
  }
  .net-worth-sticky {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--bg-card); border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    transform: translateY(-100%); opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
    pointer-events: none;
  }
  .net-worth-sticky.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .net-worth-sticky-label {
    font-family: var(--mono-font); font-size: 11px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .net-worth-sticky-value { font-family: var(--mono-font); font-size: 16px; font-weight: 600; }
  .net-worth-sticky-value.negative { color: var(--danger); }
  .net-worth-sticky-delta { font-family: var(--mono-font); font-size: 12px; }
  .net-worth-sticky-delta.pos { color: var(--good); }
  .net-worth-sticky-delta.neg { color: var(--danger); }
  .assets-hero::before {
    content: ''; position: absolute; top: -40%; right: -10%;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(var(--accent-rgb), 0.10) 0%, transparent 70%);
    pointer-events: none;
  }
  .assets-net {
    font-family: var(--mono-font); font-size: 40px; font-weight: 600;
    letter-spacing: -0.01em; margin: 6px 0; line-height: 1;
  }
  .assets-net.negative { color: var(--danger); }
  .assets-delta { font-family: var(--mono-font); font-size: 13px; }
  .assets-delta.pos { color: var(--good); }
  .assets-delta.neg { color: var(--danger); }
  .assets-delta.muted { color: var(--text-faint); }
  .assets-delta-sub {
    font-family: var(--mono-font); font-size: 11px; color: var(--text-faint);
    margin-top: 3px;
  }
  .assets-delta-sub.pos { color: var(--good); opacity: 0.8; }
  .assets-delta-sub.neg { color: var(--danger); opacity: 0.8; }
  .assets-hero .chart-wrap, .assets-hero .chart-hint { margin-top: 16px; }

  .range-pills {
    display: flex; gap: 4px; justify-content: center;
    margin-top: 14px; position: relative; z-index: 1;
  }
  .funds-toggle-row {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 12px; flex-wrap: wrap; position: relative; z-index: 1;
  }
  .funds-toggle-label { font-size: 12px; color: var(--text-faint); }
  .range-pill {
    background: none; border: none; color: var(--text-faint);
    font-family: var(--mono-font); font-size: 11px; font-weight: 600;
    letter-spacing: 0.04em; padding: 7px 14px; border-radius: 20px;
    cursor: pointer; transition: all 0.15s;
  }
  .range-pill:hover { color: var(--text-dim); }
  .range-pill.active { background: var(--bg-elevated); color: var(--accent); }

  .assets-chart { width: 100%; height: auto; display: block; }
  .chart-zero { stroke: var(--border-bright); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart-axis-label {
    fill: var(--text-faint); font-family: var(--mono-font); font-size: 10px;
  }
  .chart-area { fill: rgba(var(--accent-rgb), 0.12); stroke: none; }
  .chart-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart-line-net { stroke: var(--accent); stroke-width: 2.5; }
  .chart-dot { fill: var(--accent); stroke: var(--bg-card); stroke-width: 1.5; }

  /* Hover crosshair + tooltip on the net worth trend chart */
  .chart-wrap { position: relative; }
  .assets-chart { touch-action: none; cursor: crosshair; }
  .chart-hoverline { stroke: var(--text-faint); stroke-width: 1; stroke-dasharray: 3 3; transition: opacity 0.1s; pointer-events: none; }
  .chart-hoverdot { stroke: var(--bg-card); stroke-width: 1.5; transition: opacity 0.1s; pointer-events: none; }
  .chart-hoverdot.dot-net { fill: var(--accent); }
  .chart-tooltip {
    position: absolute; top: 0; left: 0; z-index: 5;
    background: var(--bg-elevated); border: 1px solid var(--border-bright);
    border-radius: 10px; padding: 10px 12px;
    font-family: var(--mono-font); font-size: 12px;
    pointer-events: none; transition: opacity 0.1s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    white-space: nowrap;
  }
  .chart-tooltip-date {
    font-family: var(--body-font); font-size: 11px; font-weight: 600;
    color: var(--text); margin-bottom: 4px;
  }
  .chart-tooltip-row { color: var(--text-dim); }
  .chart-tooltip-row strong { color: var(--text); margin-left: 6px; }
  .chart-hint, .snap-empty {
    color: var(--text-faint); font-size: 13px; text-align: center; padding: 24px 8px;
  }

  .assets-list-header { margin-top: 4px; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
  .assets-list-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .snap-toggle { flex-shrink: 0; }
  .snap-body { border-bottom: none; }
  /* When collapsed, the foot sits directly under the header — keep one clean divider */
  .snap-body.collapsed + .snap-foot { border-top: none; }
  .snap-list { display: flex; flex-direction: column; gap: 14px; }
  .snap-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden;
  }
  .snap-head {
    padding: 14px 18px; background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap;
  }
  .snap-head-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .snap-date-input, .snap-label-input {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; color: var(--text);
    font-family: var(--mono-font); font-size: 13px; outline: none; color-scheme: dark;
  }
  .snap-date-input { -webkit-appearance: none; appearance: none; max-width: 100%; }
  [data-theme="daylight"] .snap-date-input,
  [data-theme="daylight"] .snap-label-input { color-scheme: light; }
  .snap-label-input { font-family: var(--body-font); min-width: 140px; }
  .snap-date-input:focus, .snap-label-input:focus { border-color: var(--accent); }
  .snap-head-right { display: flex; align-items: center; gap: 12px; }
  .snap-net { font-family: var(--mono-font); font-size: 18px; font-weight: 600; color: var(--accent); }
  .snap-net.negative { color: var(--danger); }
  .snap-delete {
    background: none; border: none; color: var(--text-faint); cursor: pointer;
    font-size: 15px; padding: 4px 6px; border-radius: 6px; line-height: 1;
  }
  .snap-delete:hover { color: var(--danger); background: rgba(255, 94, 94, 0.08); }

  .snap-entries { padding: 8px 18px; }
  .entry-row {
    display: grid; grid-template-columns: 1fr 120px 130px;
    gap: 10px; align-items: center; padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .entry-row:last-child { border-bottom: none; }
  .entry-row-head {
    font-family: var(--mono-font); font-size: 9px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.12em; padding-bottom: 6px;
    border-bottom: none;
  }
  .entry-acct-label { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .entry-acct-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-acct-last4 { color: var(--text-faint); font-family: var(--mono-font); font-size: 11px; }
  .entry-amount.is-liab { color: var(--danger); }
  .entry-amount.is-asset { color: var(--good); }
  .entry-amount.is-locked { color: var(--text-dim); }
  @media (max-width: 720px) {
    .entry-row { grid-template-columns: 1fr 90px; }
    .entry-row .acct-cat-badge-sm { grid-column: 1 / 2; grid-row: 2; justify-self: start; }
    .entry-row .entry-amount { grid-column: 2 / 3; grid-row: 2; }
    .entry-row-head { display: none; }
  }
  .snap-foot {
    display: flex; gap: 18px; flex-wrap: wrap;
    padding: 12px 18px; background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    font-family: var(--mono-font); font-size: 12px; color: var(--text-dim);
  }
  .snap-foot strong { font-weight: 600; }
  .snap-foot .pos { color: var(--good); }
  .snap-foot .neg { color: var(--danger); }
  .snap-foot-net { margin-left: auto; }

  /* ============================================================
     ACCOUNTS — management cards, institution badges, category chips
     ============================================================ */
  .inst-badge {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 10px; color: #fff; font-family: var(--mono-font);
    font-weight: 700; flex-shrink: 0; letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  .inst-badge-logo {
    object-fit: contain; background: #fff; padding: 3px;
    border: 1px solid var(--border);
  }
  .acct-cat-badge {
    font-family: var(--mono-font); font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.08em; padding: 3px 8px; border-radius: 20px;
    border: 1px solid var(--border-bright); white-space: nowrap;
  }
  .acct-cat-badge.is-asset { color: var(--good); border-color: var(--good); background: rgba(79, 212, 158, 0.08); }
  .acct-cat-badge.is-liab { color: var(--danger); border-color: var(--danger); background: rgba(255, 94, 94, 0.08); }
  .acct-cat-badge.is-locked { color: var(--text-dim); }
  .acct-cat-badge-sm { padding: 2px 7px; font-size: 8px; justify-self: start; }
  .acct-empty { margin-bottom: 28px; }

  .inst-picker { display: flex; align-items: center; gap: 10px; }
  .inst-preview { display: inline-flex; flex-shrink: 0; }

  /* Grouped account cards (Cash / Investments / Real Estate / Liabilities) */
  .acct-group-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .acct-group-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden;
  }
  .acct-group-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .acct-group-name { font-size: 15px; font-weight: 600; }
  .acct-group-delta {
    font-family: var(--mono-font); font-size: 11px; margin-top: 2px;
  }
  .acct-group-delta.pos { color: var(--good); }
  .acct-group-delta.neg { color: var(--danger); }
  .acct-group-total { font-family: var(--mono-font); font-size: 17px; font-weight: 600; }
  .acct-group-total.pos { color: var(--text); }
  .acct-group-total.neg { color: var(--danger); }
  .acct-group-rows { display: flex; flex-direction: column; }
  .acct-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s;
    min-width: 0;
  }
  .acct-row:last-child { border-bottom: none; }
  .acct-row:hover { background: var(--bg-elevated); }
  .acct-row-info { flex: 1; min-width: 0; }
  .acct-row-name {
    font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .acct-row-meta {
    font-family: var(--mono-font); font-size: 11px; color: var(--text-faint); margin-top: 2px;
  }
  .acct-row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
  .acct-row-balance { font-family: var(--mono-font); font-size: 14px; font-weight: 600; }
  .acct-row-balance.pos { color: var(--text); }
  .acct-row-balance.neg { color: var(--danger); }
  .acct-row-updated { font-family: var(--mono-font); font-size: 10px; color: var(--text-faint); }

  .acct-removed-section { margin-top: 4px; }
  .acct-removed-toggle {
    background: none; border: none; color: var(--text-faint);
    font-family: var(--mono-font); font-size: 11px; letter-spacing: 0.04em;
    cursor: pointer; padding: 8px 4px; display: inline-flex; align-items: center; gap: 6px;
  }
  .acct-removed-toggle:hover { color: var(--text-dim); }
  .acct-removed-toggle svg { transition: transform 0.2s; flex-shrink: 0; }
  .acct-removed-toggle.collapsed svg { transform: rotate(-90deg); }
  .acct-row-removed { cursor: default; opacity: 0.75; }
  .acct-row-removed:hover { background: none; }
  .acct-row-removed-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .acct-row-removed-actions .icon-btn { font-size: 13px; padding: 5px 7px; }

  /* ============================================================
     SINKING FUNDS
     ============================================================ */
  .funds-hero {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 20px; padding: 24px 28px; margin-bottom: 24px;
    position: relative; overflow: hidden;
  }
  .funds-hero::before {
    content: ''; position: absolute; top: -30%; right: -5%;
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(var(--accent-rgb), 0.10) 0%, transparent 70%);
    pointer-events: none;
  }
  .funds-hero-label {
    font-family: var(--mono-font); font-size: 10px;
    color: var(--text-faint); text-transform: uppercase;
    letter-spacing: 0.2em; margin-bottom: 10px;
  }
  .funds-hero-amount {
    font-family: var(--display-font); font-size: 48px;
    font-weight: 300; letter-spacing: -0.03em; line-height: 1;
    color: var(--accent);
  }
  .funds-hero-sub {
    font-family: var(--mono-font); font-size: 12px;
    color: var(--text-dim); margin-top: 10px;
  }

  .funds-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
    gap: 14px; margin-bottom: 24px;
  }
  .fund-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; transition: border-color 0.2s;
    min-width: 0;
  }
  .fund-card:hover { border-color: var(--border-bright); }
  .fund-card-head {
    padding: 18px 20px 14px; display: flex;
    justify-content: space-between; align-items: flex-start; gap: 12px;
    min-width: 0;
  }
  .fund-card-name {
    font-family: var(--display-font); font-size: 20px;
    font-weight: 400; font-style: italic; line-height: 1.2;
    min-width: 0; overflow: hidden; text-overflow: ellipsis;
  }
  .fund-card-balance {
    font-family: var(--mono-font); font-size: 24px;
    font-weight: 600; color: var(--accent); white-space: nowrap;
  }
  .fund-card-body { padding: 0 20px 16px; }
  .fund-card-meta {
    display: flex; gap: 16px; flex-wrap: wrap;
    font-family: var(--mono-font); font-size: 11px; color: var(--text-dim);
    margin-bottom: 14px;
  }
  .fund-card-meta strong { color: var(--text); font-weight: 500; }
  .fund-card-bar {
    height: 6px; background: var(--bg-elevated);
    border-radius: 3px; overflow: hidden; margin-bottom: 8px;
  }
  .fund-card-bar-fill {
    height: 100%; border-radius: 3px;
    background: var(--accent); transition: width 0.4s ease;
  }
  .fund-card-bar-fill.warn { background: var(--warn); }
  .fund-card-bar-fill.full { background: var(--good); }
  .fund-card-goal-text {
    font-family: var(--mono-font); font-size: 10px;
    color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em;
  }
  .fund-card-actions {
    display: flex; gap: 8px; padding: 0 20px 16px; flex-wrap: wrap;
  }
  .fund-btn {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 14px; color: var(--text-dim);
    font-family: var(--body-font); font-size: 12px; cursor: pointer;
    transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
  }
  .fund-btn:hover { color: var(--text); border-color: var(--border-bright); }
  .fund-btn.withdraw { color: var(--warn); border-color: rgba(255, 140, 66, 0.3); }
  .fund-btn.withdraw:hover { background: rgba(255, 140, 66, 0.08); }
  .fund-btn.delete { color: var(--danger); border-color: rgba(255, 94, 94, 0.25); }
  .fund-btn.delete:hover { background: rgba(255, 94, 94, 0.08); }

  .fund-history {
    border-top: 1px solid var(--border); padding: 12px 20px;
    max-height: 180px; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--border-bright) transparent;
  }
  .fund-history::-webkit-scrollbar { width: 5px; }
  .fund-history::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
  .fund-history-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 6px 0; font-size: 12px;
  }
  .fund-history-row + .fund-history-row { border-top: 1px solid var(--border); }
  .fund-history-label { color: var(--text-dim); }
  .fund-history-label .note { color: var(--text-faint); font-family: var(--mono-font); font-size: 11px; margin-left: 6px; }
  .fund-history-amount { font-family: var(--mono-font); font-weight: 500; }
  .fund-history-amount.credit { color: var(--good); }
  .fund-history-amount.debit { color: var(--warn); }

  .fund-form-section {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; margin-bottom: 16px;
    overflow: hidden;
  }
  .fund-form-title {
    font-family: var(--display-font); font-size: 20px;
    font-style: italic; margin-bottom: 14px;
  }
  .fund-edit-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    min-width: 0; overflow: hidden;
  }
  .fund-edit-grid .form-group { min-width: 0; overflow: hidden; }
  @media (max-width: 520px) {
    .fund-edit-grid { grid-template-columns: 1fr; }
  }
  .fund-empty {
    text-align: center; padding: 48px 20px; color: var(--text-faint);
  }
  .fund-empty-big {
    font-family: var(--display-font); font-style: italic;
    font-size: 22px; color: var(--text-dim); margin-bottom: 8px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1 class="header-title"><span class="accent">Monthly Budget</span></h1>
      <div class="header-sub" id="month-label">—</div>
    </div>
    <div class="header-actions">
      <div class="sync-status offline" id="sync-status">
        <span class="sync-dot"></span>
        <span id="sync-text">Not synced</span>
      </div>
      <div class="month-picker">
        <button class="month-picker-trigger" id="month-trigger" type="button" aria-haspopup="true">
          <span id="month-trigger-label">—</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="month-popover" id="month-popover" hidden>
          <div class="month-popover-head">
            <button class="month-nav" id="year-prev" type="button" aria-label="Previous year">‹</button>
            <span class="month-popover-year" id="popover-year">2026</span>
            <button class="month-nav" id="year-next" type="button" aria-label="Next year">›</button>
          </div>
          <div class="month-popover-grid" id="popover-grid"></div>
        </div>
      </div>
      <button class="settings-btn" id="settings-btn" aria-label="Settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="dashboard">Dashboard</button>
    <button class="tab" data-tab="transactions">Transactions</button>
    <button class="tab" data-tab="plan">Plan</button>
    <button class="tab" data-tab="funds">Funds</button>
    <button class="tab" data-tab="accounts">Accounts</button>

// Deep clone helper.
function clonePlan(plan) {
  return JSON.parse(JSON.stringify(plan));
}

// Returns the plan for the given month, creating it via carryover if missing.
function planForMonth(monthKey) {
  if (state.plans[monthKey]) {
    ensurePlanShape(state.plans[monthKey]);
    return state.plans[monthKey];
  }
  const priorKeys = Object.keys(state.plans).filter(k => k < monthKey).sort();
  const source = priorKeys.length
    ? state.plans[priorKeys[priorKeys.length - 1]]
    : DEFAULT_PLAN;
  state.plans[monthKey] = clonePlan(source);
  ensurePlanShape(state.plans[monthKey]);
  return state.plans[monthKey];
}

function currentPlan() {
  return planForMonth(activeMonth);

// Make sure any plan object has the v3 shape (income.sources, income.tax, etc.).
function ensurePlanShape(plan) {
  if (!plan.income) plan.income = { sources: [], tax: clonePlan(DEFAULT_PLAN.income.tax) };
  // v2 -> v3: takeHome single number becomes a single source w/ tax disabled.
  if (typeof plan.income.takeHome === 'number' && !plan.income.sources) {
    plan.income.sources = plan.income.takeHome > 0 ? [{
      id: 'src-legacy-' + Date.now(),
      name: 'Take-home (legacy)',
      gross: plan.income.takeHome,
      frequency: 'monthly',
      applyTax: false,
    }] : [];
    delete plan.income.takeHome;
  }
  if (!Array.isArray(plan.income.sources)) plan.income.sources = [];
  if (!plan.income.tax) plan.income.tax = clonePlan(DEFAULT_PLAN.income.tax);
  // Backfill any missing tax fields.
  const t = plan.income.tax;
  if (!t.filingStatus) t.filingStatus = 'single';
  if (!t.state) t.state = 'TX';
  if (typeof t.localRate !== 'number') t.localRate = 0;
  if (t.manualOverride === undefined) t.manualOverride = null;
}

// Normalize an account definition (name, type, institution, last4, category).
function ensureAccountShape(acct) {
  if (!acct.id) acct.id = 'acct-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
  if (typeof acct.name !== 'string') acct.name = '';
  if (!ACCOUNT_TYPES.some(t => t.id === acct.type)) acct.type = 'other';
  if (typeof acct.institutionId !== 'string' || !acct.institutionId) acct.institutionId = 'custom';
  if (typeof acct.institutionCustom !== 'string') acct.institutionCustom = '';
  if (typeof acct.last4 !== 'string') acct.last4 = String(acct.last4 || '').slice(0, 4);
  if (acct.category !== 'asset' && acct.category !== 'liability' && acct.category !== 'nonAvailable') {
    acct.category = accountTypeInfo(acct.type).defaultCategory;
  }
  // The date this account was added — snapshots dated before this are
  // treated as "the account didn't exist yet" and won't show it as a row,
  // so a brand-new account never appears to retroactively show up (or show
  // a misleading $0) in your history from before you opened it.
  if (typeof acct.dateAdded !== 'string' || !acct.dateAdded) {
    acct.dateAdded = new Date().toISOString().slice(0, 10);
  }
  // The date this account was removed, or null if it's still active.
  // Removing an account with snapshot history archives it as of this date
  // rather than deleting it outright — it disappears from new snapshots
  // and the active account list, but keeps its label and recorded amounts
  // in every snapshot up through this date.
  if (typeof acct.deletedDate !== 'string') acct.deletedDate = null;
}

// Normalize an accounts snapshot to the v6 shape. Each entry now references
// a persistent account (by id) rather than carrying its own freeform
// name/type — the account definition is the single source of truth for
// those, so a balance always stays tied to the account it belongs to.
function ensureSnapshotShape(snap) {
  if (!snap.id) snap.id = 'snap-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
  if (!snap.date) snap.date = new Date().toISOString().slice(0, 10);
  if (typeof snap.label !== 'string') snap.label = '';
  if (!Array.isArray(snap.entries)) snap.entries = [];
  snap.entries.forEach(e => {
    if (!e.id) e.id = 'ent-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
    if (typeof e.amount !== 'number') e.amount = parseFloat(e.amount) || 0;
  });
  // fundBalance is captured at snapshot time for accurate historical Available tracking.
  if (typeof snap.fundBalance !== 'number') snap.fundBalance = null;
}

function migrateState() {
  if (state.plan && !state.plans) {
    state.plans = {};
    const monthsWithData = Object.keys(state.transactions || {});
    const seedMonths = new Set([...monthsWithData, currentMonthKey()]);
    seedMonths.forEach(m => { state.plans[m] = clonePlan(state.plan); });
    delete state.plan;
  }
  if (!state.plans) state.plans = {};
  if (!state.transactions) state.transactions = {};
  // v3 -> v4: assets snapshots.
  if (!Array.isArray(state.assets)) state.assets = [];
  // v5 -> v6: promote each snapshot's freeform named entries into a
  // persistent Accounts list, one-time, before entries lose their name/type
  // fields. Entries are matched to accounts by name (case-insensitive) so
  // repeated entries across snapshots collapse into a single account.
  if (!Array.isArray(state.accounts)) {
    state.accounts = [];
    const byName = new Map();
    state.assets.forEach(snap => {
      (snap.entries || []).forEach(e => {
        const key = (e.name || '').trim().toLowerCase() || 'account';
        if (!byName.has(key)) {
          const acct = {
            id: 'acct-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
            name: e.name || 'Account',
            type: 'other',
            institutionId: 'custom',
            institutionCustom: '',
            last4: '',
            category: e.type === 'liability' ? 'liability' : e.type === 'nonAvailable' ? 'nonAvailable' : 'asset',
            // Backdate to this snapshot's date (the earliest one it appears
            // in, since snapshots are processed oldest-first below) so
            // migrated accounts show up across all the history they were
            // actually part of, not just from today forward.
            dateAdded: snap.date,
          };
          ensureAccountShape(acct);
          state.accounts.push(acct);
          byName.set(key, acct);
        }
        e.accountId = byName.get(key).id;
      });
    });
    // state.assets isn't guaranteed to be stored in date order, so make a
    // second pass to pull each account's dateAdded down to the true
    // earliest snapshot date it appears in.
    state.assets.forEach(snap => {
      (snap.entries || []).forEach(e => {
        const acct = state.accounts.find(a => a.id === e.accountId);
        if (acct && snap.date < acct.dateAdded) acct.dateAdded = snap.date;
      });
    });
  }
  state.accounts.forEach(ensureAccountShape);
  state.assets.forEach(ensureSnapshotShape);
  // v4 -> v5: sinking funds.
  if (!Array.isArray(state.autoFunds)) state.autoFunds = [];
  state.autoFunds.forEach(ensureFundShape);
  // Migrate every stored plan to the v3 income shape.
  Object.values(state.plans).forEach(ensurePlanShape);
}

function institutionBadge(account, size) {
  const s = size || 32;
  const fontSize = Math.round(s * 0.36);
  if (account.institutionId === 'custom' && account.institutionCustom) {
    const name = account.institutionCustom.trim();
    const initials = name.slice(0, 2).toUpperCase() || '?';
    const color = hashColor(name);
    return `<span class="inst-badge" style="width:${s}px;height:${s}px;font-size:${fontSize}px;background:${color};" title="${escapeHtml(name)}">${escapeHtml(initials)}</span>`;
  }
  const inst = institutionInfo(account.institutionId);
  const logo = INSTITUTION_LOGOS[account.institutionId];
  if (logo) {
    return `<img class="inst-badge inst-badge-logo" src="data:image/png;base64,${logo}" style="width:${s}px;height:${s}px;" alt="${escapeHtml(inst.name)}" title="${escapeHtml(inst.name)}" />`;
  }
  return `<span class="inst-badge" style="width:${s}px;height:${s}px;font-size:${fontSize}px;background:${inst.color};" title="${escapeHtml(inst.name)}">${escapeHtml(inst.initials)}</span>`;
}

function institutionDisplayName(account) {
  if (account.institutionId === 'custom') return account.institutionCustom || 'Custom institution';
  return institutionInfo(account.institutionId).name;
}

const CATEGORY_LABELS = { asset: 'Asset', liability: 'Liability', nonAvailable: 'Non-Available' };
function categoryLabel(cat) { return CATEGORY_LABELS[cat] || 'Asset'; }
function categoryClass(cat) { return cat === 'liability' ? 'is-liab' : cat === 'nonAvailable' ? 'is-locked' : 'is-asset'; }
let popoverYear = null;

function updateMonthTrigger() {
  const el = document.getElementById('month-trigger-label');
  if (el) el.textContent = monthLabel(activeMonth);
}
function renderMonthPopoverGrid() {
  const grid = document.getElementById('popover-grid');
  document.getElementById('popover-year').textContent = popoverYear;
  const [activeY, activeM] = activeMonth.split('-').map(Number);
  const [curY, curM] = currentMonthKey().split('-').map(Number);
  document.getElementById('year-next').disabled = popoverYear >= curY;
  grid.innerHTML = MONTH_NAMES.map((name, i) => {
    const m = i + 1;
    const isSelected = popoverYear === activeY && m === activeM;
    const isCurrent = popoverYear === curY && m === curM;
    const isFuture = popoverYear > curY || (popoverYear === curY && m > curM);
    const cls = ['month-popover-cell'];
    if (isSelected) cls.push('selected');
    else if (isCurrent) cls.push('current');
    if (isFuture) cls.push('disabled');
    const disabledAttr = isFuture ? ' disabled aria-disabled="true"' : '';
    return `<button type="button" class="${cls.join(' ')}" data-month="${m}"${disabledAttr}>${name}</button>`;
  }).join('');
  grid.querySelectorAll('[data-month]:not([disabled])').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = +btn.dataset.month;
      activeMonth = `${popoverYear}-${String(m).padStart(2, '0')}`;
      closeMonthPopover();
      render();
    });
  });
}
function openMonthPopover() {
  popoverYear = +activeMonth.split('-')[0];
  document.getElementById('month-trigger').setAttribute('aria-expanded', 'true');
  document.getElementById('month-popover').hidden = false;
  renderMonthPopoverGrid();
  setTimeout(() => document.addEventListener('click', outsideMonthClick), 0);
}
function closeMonthPopover() {
  document.getElementById('month-trigger').setAttribute('aria-expanded', 'false');
  document.getElementById('month-popover').hidden = true;
  document.removeEventListener('click', outsideMonthClick);
}
function outsideMonthClick(e) {
  if (!e.target.closest('.month-picker')) closeMonthPopover();
}
function initMonthPicker() {
  const trigger = document.getElementById('month-trigger');
  trigger.setAttribute('aria-expanded', 'false');
  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    if (document.getElementById('month-popover').hidden) openMonthPopover();
    else closeMonthPopover();
  });
  document.getElementById('year-prev').addEventListener('click', () => {
    popoverYear -= 1;
    renderMonthPopoverGrid();
  });
  document.getElementById('year-next').addEventListener('click', () => {
    popoverYear += 1;
    renderMonthPopoverGrid();
  });
}

function fmt(n, decimals = 0) {
  return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, kind = '') {
  const el = document.getElementById('toast');
  el.className = 'toast show ' + kind;
  el.textContent = msg;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2500);
}

function applyTheme(themeId) {
  // Migrate renamed theme IDs (v3.2.2 → v3.2.3): ember→warm, plum→pink
  const idMap = { ember: 'warm', plum: 'pink' };
  if (idMap[themeId]) themeId = idMap[themeId];
  const valid = AVAILABLE_THEMES.find(t => t.id === themeId);
  const id = valid ? themeId : 'matcha';
  document.documentElement.setAttribute('data-theme', id);
  config.theme = id;
}

// ============================================================
//  TAX ENGINE
// ============================================================

// Compute federal income tax owed on a given annual taxable income
// using the brackets table.
function federalTaxOwed(taxableAnnual, brackets) {
  let tax = 0;
  let prevTop = 0;
  for (const [top, rate] of brackets) {
    if (taxableAnnual <= prevTop) break;
    const slice = Math.min(taxableAnnual, top) - prevTop;
    tax += slice * rate;
    prevTop = top;
    if (taxableAnnual <= top) break;
  }
  return Math.max(0, tax);
}

// Given an array of income sources and a tax profile, compute monthly
// gross, federal, fica, state, local, net per source, plus totals.
function computeIncome(income) {
  const tax = income.tax;
  const filing = tax.filingStatus in FEDERAL_BRACKETS ? tax.filingStatus : 'single';
  const stateInfo = STATE_TAX[tax.state] || { rate: 0, name: tax.state };
  const localRate = (tax.localRate || 0) / 100;

  // Step 1: compute monthly gross per source and overall.
  const sources = income.sources.map(src => {
    const freq = PAY_FREQUENCIES.find(f => f.id === src.frequency) || PAY_FREQUENCIES[3];
    const monthlyGross = (src.gross || 0) * freq.perMonth;
    return { ...src, monthlyGross, _freq: freq };
  });

  const taxedSources = sources.filter(s => s.applyTax);
  const taxedMonthlyTotal = taxedSources.reduce((a, s) => a + s.monthlyGross, 0);
  const untaxedMonthlyTotal = sources.filter(s => !s.applyTax).reduce((a, s) => a + s.monthlyGross, 0);
  const taxedAnnual = taxedMonthlyTotal * 12;

  // Step 2: federal income tax on taxed-source income.
  const stdDed = STD_DEDUCTION[filing] || STD_DEDUCTION.single;
  const taxableAnnual = Math.max(0, taxedAnnual - stdDed);
  const federalAnnual = federalTaxOwed(taxableAnnual, FEDERAL_BRACKETS[filing]);

  // Step 3: FICA on taxed wages.
  const ssAnnual = Math.min(taxedAnnual, SS_WAGE_BASE) * SS_RATE;
  const medicareAnnual = taxedAnnual * MEDICARE_RATE;
  const addThresh = ADD_MEDICARE_THRESHOLD[filing] || ADD_MEDICARE_THRESHOLD.single;
  const addMedicareAnnual = Math.max(0, taxedAnnual - addThresh) * ADD_MEDICARE_RATE;
  const ficaAnnual = ssAnnual + medicareAnnual + addMedicareAnnual;

  // Step 4: state and local income tax (flat-rate approximation on taxed gross).
  const stateAnnual = taxedAnnual * (stateInfo.rate || 0);
  const localAnnual = taxedAnnual * localRate;

  // Monthly equivalents.
  const federalMonthly = federalAnnual / 12;
  const ficaMonthly = ficaAnnual / 12;
  const ssMonthly = ssAnnual / 12;
  const medicareMonthly = (medicareAnnual + addMedicareAnnual) / 12;
  const stateMonthly = stateAnnual / 12;
  const localMonthly = localAnnual / 12;
  const totalTaxMonthly = federalMonthly + ficaMonthly + stateMonthly + localMonthly;

  // Compute per-source net by allocating taxes pro-rata across taxed sources.
  const totalTaxedGross = taxedMonthlyTotal || 1; // avoid div-by-zero
  sources.forEach(s => {
    if (s.applyTax) {
      const share = s.monthlyGross / totalTaxedGross;
      s.taxMonthly = totalTaxMonthly * share;
      s.netMonthly = s.monthlyGross - s.taxMonthly;
    } else {
      s.taxMonthly = 0;
      s.netMonthly = s.monthlyGross;
    }
  });

  const grossMonthlyTotal = taxedMonthlyTotal + untaxedMonthlyTotal;
  const computedNetMonthly = grossMonthlyTotal - totalTaxMonthly;
  const takeHomeMonthly = (tax.manualOverride !== null && tax.manualOverride !== undefined)
    ? tax.manualOverride
    : computedNetMonthly;

  return {
    sources,
    grossMonthly: grossMonthlyTotal,
    taxedMonthly: taxedMonthlyTotal,
    untaxedMonthly: untaxedMonthlyTotal,
    federalMonthly,
    ficaMonthly,
    ssMonthly,
    medicareMonthly,
    stateMonthly,
    localMonthly,
    totalTaxMonthly,
    netMonthly: computedNetMonthly,
    takeHomeMonthly,
    overridden: tax.manualOverride !== null && tax.manualOverride !== undefined,
    stateInfo,
    filingStatus: filing,
  };
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch {}
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    if (raw) {
      const loaded = JSON.parse(raw);
      config = { clientId: '', theme: 'matcha', collapsedSections: {}, accountsChartRange: 'all', excludeFundsFromNetWorth: false, ...loaded };
      // Migrate the old add-funds toggle (removed — it double-counted money
      // already sitting inside an account) to the new subtract-based one.
      delete config.includeFundsInNetWorth;
      if (!config.collapsedSections || typeof config.collapsedSections !== 'object') {
        config.collapsedSections = {};
      }
      if (!CHART_RANGES.some(r => r.id === config.accountsChartRange)) config.accountsChartRange = 'all';
    }
  } catch {}
  migrateState();
}
function saveLocal() {
  state.updatedAt = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function saveConfig() {
  localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
}

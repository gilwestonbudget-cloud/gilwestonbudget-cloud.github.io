function setSyncStatus(status, text) {
  const el = document.getElementById('sync-status');
  el.className = 'sync-status ' + status;
  document.getElementById('sync-text').textContent = text;
  el.querySelector('.sync-dot').classList.toggle('spin', status === 'syncing');
}

window.gapiInit = function() {};
function loadGapi() {
  return new Promise((resolve) => {
    if (gapiReady) return resolve();
    const check = () => {
      if (window.gapi) {
        gapi.load('client', async () => {
          await gapi.client.init({
            discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
          });
          gapiReady = true;
          resolve();
        });
      } else {
        setTimeout(check, 100);
      }
    };
    check();
  });
}
function loadGis() {
  return new Promise((resolve) => {
    if (gisReady) return resolve();
    const check = () => {
      if (window.google?.accounts?.oauth2) {
        gisReady = true;
        resolve();
      } else {
        setTimeout(check, 100);
      }
    };
    check();
  });
}

async function initAuth() {
  if (!config.clientId) {
    setSyncStatus('offline', 'No Client ID set');
    return false;
  }
  await Promise.all([loadGapi(), loadGis()]);
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: config.clientId,
    scope: DRIVE_SCOPE,
    callback: '',
  });
  return true;
}

function requestToken(prompt = '') {
  return new Promise((resolve, reject) => {
    if (!tokenClient) return reject(new Error('Auth not initialized'));
    tokenClient.callback = (resp) => {
      if (resp.error) return reject(new Error(resp.error));
      accessToken = resp.access_token;
      gapi.client.setToken({ access_token: accessToken });
      resolve(accessToken);
    };
    tokenClient.requestAccessToken({ prompt });
  });
}

async function findDriveFile() {
  const resp = await gapi.client.drive.files.list({
    q: `name='${DRIVE_FILE_NAME}' and trashed=false`,
    spaces: 'drive',
    fields: 'files(id, name, modifiedTime)',
  });
  const files = resp.result.files || [];
  return files[0] || null;
}

async function downloadDriveFile(fileId) {
  const resp = await gapi.client.drive.files.get({
    fileId, alt: 'media',
  });
  return typeof resp.body === 'string' ? JSON.parse(resp.body) : resp.result;
}

async function uploadDriveFile(fileId, data) {
  const body = JSON.stringify(data);
  const url = fileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;

  if (fileId) {
    const resp = await fetch(url, {
      method: 'PATCH',
      headers: {
        'Authorization': 'Bearer ' + accessToken,
        'Content-Type': 'application/json',
      },
      body,
    });
    if (!resp.ok) throw new Error('Upload failed: ' + resp.status);
    return (await resp.json()).id;
  } else {
    const boundary = '-------budgetapp' + Date.now();
    const meta = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
    const multipart =
      `--${boundary}\r\n` +
      `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
      JSON.stringify(meta) + `\r\n` +
      `--${boundary}\r\n` +
      `Content-Type: application/json\r\n\r\n` +
      body + `\r\n` +
      `--${boundary}--`;
    const resp = await fetch(url, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + accessToken,
        'Content-Type': 'multipart/related; boundary=' + boundary,
      },
      body: multipart,
    });
    if (!resp.ok) throw new Error('Create failed: ' + resp.status);
    return (await resp.json()).id;
  }
}

async function sync(options = {}) {
  if (!config.clientId) {
    toast('Set your Google Client ID in Settings first', 'error');
    return;
  }
  try {
    setSyncStatus('syncing', 'Syncing…');
    if (!gapiReady || !gisReady) {
      const ok = await initAuth();
      if (!ok) return;
    }
    if (!accessToken) {
      await requestToken(options.interactive ? 'consent' : '');
    }

    const existing = await findDriveFile();
    if (existing) {
      driveFileId = existing.id;
      const remote = await downloadDriveFile(driveFileId);
      if (remote.updatedAt && remote.updatedAt > (state.updatedAt || 0)) {
        state = remote;
        migrateState();
        saveLocal();
        render();
        toast('Pulled latest from Drive', 'success');
      } else if ((state.updatedAt || 0) > (remote.updatedAt || 0)) {
        await uploadDriveFile(driveFileId, state);
        toast('Pushed changes to Drive', 'success');
      }
    } else {
      driveFileId = await uploadDriveFile(null, state);
      toast('Created Drive file', 'success');
    }

    setSyncStatus('synced', 'Synced · ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }));
  } catch (err) {
    console.error(err);
    setSyncStatus('error', 'Sync failed');
    toast('Sync failed: ' + err.message, 'error');
  }
}

function debouncedSync() {
  if (!config.clientId) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => sync(), 2000);
}

// ============================================================
function monthTxns() {
  return state.transactions[activeMonth] || [];
}
function spentByCategory() {
  const map = {};
  monthTxns().forEach(t => { map[t.categoryId] = (map[t.categoryId] || 0) + t.amount; });
  // Auto-payment categories count as fully spent at their planned amount.
  const allCats = [...currentPlan().needs, ...currentPlan().wants, ...currentPlan().savings];
  allCats.forEach(c => {
    if (c.isAuto && c.planned > 0) {
      map[c.id] = (map[c.id] || 0) + c.planned;
    }
  });
  return map;
}
function groupTotals() {
  const spent = spentByCategory();
  const sum = (cats) => cats.reduce((a, c) => a + (spent[c.id] || 0), 0);
  const sumP = (cats) => cats.reduce((a, c) => a + c.planned, 0);
  return {
    needs: sum(currentPlan().needs), needsPlanned: sumP(currentPlan().needs),
    wants: sum(currentPlan().wants), wantsPlanned: sumP(currentPlan().wants),
    savings: sum(currentPlan().savings), savingsPlanned: sumP(currentPlan().savings),
  };
}
function currentTakeHome() {
  return computeIncome(currentPlan().income).takeHomeMonthly;
}

function updatePlanItem(group, id, field, value) {
  const items = currentPlan()[group];
  const item = items.find(i => i.id === id);
  if (!item) return;
  if (field === 'planned') {
    item.planned = parseFloat(value) || 0;
    // Sync linked fund's rate for the month being edited.

      if (fund) setFundRate(fund, activeMonth, item.planned);
    }
  } else if (field === 'isAuto') {
    item.isAuto = !!value;
    // If turning off auto, also unlink the fund.
    if (!item.isAuto) item.linkedFundId = null;
  } else if (field === 'linkedFundId') {
    if (value === '__create__') {
      // Auto-create a fund named after this category.
      const mk = activeMonth;
      const newFund = {
        id: 'fund-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        name: item.name + ' fund',
        monthlyAmount: item.planned,
        startMonth: mk,
        rates: [{ startMonth: mk, amount: item.planned }],
        goalAmount: 0,
        withdrawals: [],
      };
      state.autoFunds.push(newFund);
      item.linkedFundId = newFund.id;
    } else {
      item.linkedFundId = value || null;
      // Sync the fund's rate to this plan item's planned value.
      if (item.linkedFundId) {
        const fund = state.autoFunds.find(f => f.id === item.linkedFundId);
        if (fund) setFundRate(fund, activeMonth, item.planned);
      }
    }
  } else {
    item[field] = value;
  }
  saveLocal();
  if (field === 'isAuto' || field === 'linkedFundId') render();
  debouncedSync();
}
function addCategory(group) {

// ----- Assets snapshot actions -----

// Sorted copy of snapshots, oldest first (by date then creation order).
function sortedSnapshots() {
  return [...state.assets].sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (a.id < b.id ? -1 : 1);
  });
}

// Net worth math for a single snapshot. Each entry's classification comes
// from the account it references (not the entry itself) — so re-labeling
// an account as a liability instantly reclassifies it across every
// snapshot's totals, past and present.
function snapshotTotals(snap) {
  let assets = 0, nonAvailable = 0, liabilities = 0;
  (snap.entries || []).forEach(e => {
    const acct = state.accounts.find(a => a.id === e.accountId);
    if (!acct) return; // account was deleted — excluded from totals
    const amt = e.amount || 0;
    if (acct.category === 'liability') liabilities += amt;
    else if (acct.category === 'nonAvailable') nonAvailable += amt;
    else assets += amt;
  });
  // Sinking fund money is already physically inside one of the accounts
  // above (it's just mentally earmarked for something) — so it's already
  // counted once in the totals above. The toggle on the Accounts tab lets
  // you optionally SUBTRACT that committed amount to see what's actually
  // free/uncommitted, rather than adding it (which would double-count it).
  const funds = (snap.fundBalance !== null && snap.fundBalance !== undefined) ? snap.fundBalance : 0;
  const fundsExcluded = !!config.excludeFundsFromNetWorth;
  const fundsAdj = fundsExcluded ? -funds : 0;
  const net = assets + nonAvailable - liabilities + fundsAdj;
  // Available = liquid assets minus liabilities (non-available excluded; funds subtracted only if toggled on).
  const liquid = assets - liabilities + fundsAdj;
  return { assets, nonAvailable, liabilities, net, liquid, funds, fundsExcluded };
}

function snapshotDateExists(dateStr, excludeId) {
  return state.assets.some(s => s.date === dateStr && s.id !== excludeId);
}

function addSnapshot() {
  if (state.accounts.length === 0) {
    toast('Add an account first, then take a snapshot', 'error');
    activeTab = 'accounts';
    render();
    return;
  }
  const today = new Date().toISOString().slice(0, 10);
  const existing = state.assets.find(s => s.date === today);
  if (existing) {
    toast("You already have a snapshot for today — opening it", 'error');
    config.collapsedSections['snap-' + existing.id] = false;
    saveConfig();
    render();
    setTimeout(() => {
      const card = document.querySelector(`.snap-card[data-snap-id="${existing.id}"]`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 0);
    return;
  }
  // One row per account that already existed by today — never one you add
  // later — carrying forward each account's balance from the most recent
  // snapshot it appeared in (0 if it's brand new), so taking a new
  // snapshot is just editing numbers, never retyping every account.
  const sorted = sortedSnapshots();
  const prior = sorted[sorted.length - 1];
  const entries = accountsAsOf(today).map(acct => {
    const priorEntry = prior ? prior.entries.find(e => e.accountId === acct.id) : null;
    return {
      id: 'ent-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
      accountId: acct.id,
      amount: priorEntry ? priorEntry.amount : 0,
    };
  });
  // Capture current fund balance at snapshot time.
  const fundBalance = state.autoFunds.reduce((a, f) => a + computeFund(f).balance, 0);
  const snap = {
    id: 'snap-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
    date: today,
    label: '',
    entries,
    fundBalance,
  };
  state.assets.push(snap);
  saveLocal();
  render();
  debouncedSync();
  setTimeout(() => {
    const card = document.querySelector(`.snap-card[data-snap-id="${snap.id}"]`);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const d = card.querySelector('.snap-date-input');
      if (d) d.focus();
    }
  }, 0);
}

function removeSnapshot(id) {
  const snap = state.assets.find(s => s.id === id);
  if (!snap) return;
  if (!confirm(`Delete the snapshot from ${snap.date}? This can't be undone.`)) return;
  state.assets = state.assets.filter(s => s.id !== id);
  saveLocal();
  render();
  debouncedSync();
}

function updateSnapshotField(id, field, value) {
  const snap = state.assets.find(s => s.id === id);
  if (!snap) return;
  if (field === 'date') {
    if (snapshotDateExists(value, id)) {
      toast('Another snapshot already exists for that date', 'error');
      render(); // reset the input back to the unchanged stored date
      return;
    }
    snap.date = value;
  }
  else if (field === 'label') snap.label = value;
  saveLocal();
  render();
  debouncedSync();
}

// Sets (creating if needed) the balance a snapshot records for one account.
// Snapshot rows are always driven by the current Accounts list, so an
// account added after a snapshot was taken simply starts at $0 in it until
// edited here.
function updateEntryAmount(snapId, accountId, value) {
  const snap = state.assets.find(s => s.id === snapId);
  if (!snap) return;
  let ent = snap.entries.find(e => e.accountId === accountId);
  if (!ent) {
    ent = { id: 'ent-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), accountId, amount: 0 };
    snap.entries.push(ent);
  }
  ent.amount = parseFloat(value) || 0;
  saveLocal();
  render();
  debouncedSync();
}

// ============================================================
//  ACCOUNTS — CRUD
// ============================================================
function findAccount(id) {
  return state.accounts.find(a => a.id === id);
}

function addAccount(data) {
  const acct = {
    id: 'acct-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
    name: (data.name || '').trim() || accountTypeInfo(data.type).label,
    type: data.type || 'other',
    institutionId: data.institutionId || 'custom',
    institutionCustom: (data.institutionCustom || '').trim(),
    last4: (data.last4 || '').replace(/\D/g, '').slice(0, 4),
    category: data.category || accountTypeInfo(data.type).defaultCategory,
    dateAdded: data.dateAdded || new Date().toISOString().slice(0, 10),
  };
  ensureAccountShape(acct);
  state.accounts.push(acct);
  saveLocal();
  render();
  debouncedSync();
  toast(`Added ${acct.name}`, 'success');
}

// True if two accounts have identical metadata — name, type, institution,
// last 4, and category all matching exactly. This is deliberately strict:
// merging is only offered when every field lines up, so it only fires when
// you've actually made two records describe the same real account, never
// on a coincidental partial match.
function accountsMatch(a, b) {
  if (!a || !b || a.id === b.id) return false;
  if (a.name.trim().toLowerCase() !== b.name.trim().toLowerCase()) return false;
  if (a.type !== b.type) return false;
  if (a.institutionId !== b.institutionId) return false;
  if (a.institutionId === 'custom' && a.institutionCustom.trim().toLowerCase() !== b.institutionCustom.trim().toLowerCase()) return false;
  if ((a.last4 || '') !== (b.last4 || '')) return false;
  if (a.category !== b.category) return false;
  return true;
}

// Folds `mergeId` into `keepId`: every snapshot entry that belonged to the
// merged account gets reassigned to the kept one, so its full balance
// history becomes part of a single account instead of being split across
// two records — exactly the situation old Assets-tab data can end up in,
// where the same real account was typed under two different names.
function mergeAccounts(keepId, mergeId) {
  const keep = findAccount(keepId);
  const merged = findAccount(mergeId);
  if (!keep || !merged || keep.id === merged.id) return;

  state.assets.forEach(snap => {
    const mergedEntry = snap.entries.find(e => e.accountId === merged.id);
    if (!mergedEntry) return;
    const keepEntry = snap.entries.find(e => e.accountId === keep.id);
    if (keepEntry) {
      // Same snapshot already has an entry for both — a duplicate-entry
      // slip rather than real data. Keep whichever balance is non-zero.
      if (keepEntry.amount === 0 && mergedEntry.amount !== 0) keepEntry.amount = mergedEntry.amount;
      snap.entries = snap.entries.filter(e => e !== mergedEntry);
    } else {
      mergedEntry.accountId = keep.id;
    }
  });

  // The merged account should stay visible across the full combined
  // history, and count as active if either side was.
  if (merged.dateAdded < keep.dateAdded) keep.dateAdded = merged.dateAdded;
  if (!merged.deletedDate) keep.deletedDate = null;

  state.accounts = state.accounts.filter(a => a.id !== merged.id);
}

function updateAccount(id, data) {
  const acct = findAccount(id);
  if (!acct) return;
  if (data.name !== undefined) acct.name = data.name.trim();
  if (data.type !== undefined) acct.type = data.type;
  if (data.institutionId !== undefined) acct.institutionId = data.institutionId;
  if (data.institutionCustom !== undefined) acct.institutionCustom = data.institutionCustom.trim();
  if (data.last4 !== undefined) acct.last4 = data.last4.replace(/\D/g, '').slice(0, 4);
  if (data.category !== undefined) acct.category = data.category;
  if (data.dateAdded !== undefined && data.dateAdded) acct.dateAdded = data.dateAdded;
  ensureAccountShape(acct);

  // If this edit just made the account an exact match for another one,
  // offer to combine them — this is how two old differently-named entries
  // for the same real account become one, once you've retitled them to
  // match.
  const dup = state.accounts.find(a => accountsMatch(a, acct));
  if (dup) {
    const mergeConfirmed = confirm(
      `This now exactly matches "${dup.name}" (same type, institution, last 4, and category). Merge them into one account? All snapshot history from both will be combined.`
    );
    if (mergeConfirmed) {
      mergeAccounts(acct.id, dup.id);
      saveLocal();
      render();
      debouncedSync();
      toast(`Merged into ${acct.name}`, 'success');
      return;
    }
  }

  saveLocal();
  render();
  debouncedSync();
}

function removeAccount(id) {
  const acct = findAccount(id);
  if (!acct) return;
  const hasHistory = state.assets.some(snap => snap.entries.some(e => e.accountId === id));

  if (!hasHistory) {
    // Never appeared in a snapshot — nothing to preserve, so a plain
    // delete is safe and unambiguous.
    if (!confirm(`Delete "${acct.name}"? This can't be undone.`)) return;
    state.accounts = state.accounts.filter(a => a.id !== id);
    saveLocal();
    render();
    debouncedSync();
    toast(`Deleted ${acct.name}`, 'success');
    return;
  }

  // Has snapshot history — archive rather than delete, so its label and
  // recorded amounts stay exactly as they were in every snapshot it was
  // already part of. It just stops appearing in the active account list
  // and in any snapshot taken from here on.
  const today = new Date().toISOString().slice(0, 10);
  if (!confirm(`Remove "${acct.name}"? It'll disappear from new snapshots going forward, but keeps its label and amounts in every snapshot up through today. You can restore it later from Removed Accounts.`)) return;
  acct.deletedDate = today;
  saveLocal();
  render();
  debouncedSync();
  toast(`Removed ${acct.name}`, 'success');
}

// Un-archives a removed account — clears its removal date so it becomes
// active again and shows up in new snapshots going forward. Its past
// snapshot entries were never touched, so history is unaffected either way.
function restoreAccount(id) {
  const acct = findAccount(id);
  if (!acct) return;
  acct.deletedDate = null;
  saveLocal();
  render();
  debouncedSync();
  toast(`Restored ${acct.name}`, 'success');
}

// Permanently erases an archived account and strips it out of every
// snapshot's history — unlike removeAccount, this cannot be undone.
function hardDeleteAccount(id) {
  const acct = findAccount(id);
  if (!acct) return;
  if (!confirm(`Permanently delete "${acct.name}"? This erases it from every snapshot's history too, and can't be undone.`)) return;
  state.accounts = state.accounts.filter(a => a.id !== id);
  state.assets.forEach(snap => {
    snap.entries = snap.entries.filter(e => e.accountId !== id);
  });
  saveLocal();
  render();
  debouncedSync();
  toast(`Permanently deleted ${acct.name}`, 'success');
}

// Latest recorded balance for an account, or null if it's never appeared
// in a snapshot yet.
function latestBalanceForAccount(accountId) {
  const snaps = sortedSnapshots();
  for (let i = snaps.length - 1; i >= 0; i--) {
    const ent = snaps[i].entries.find(e => e.accountId === accountId);
    if (ent) return ent.amount;
  }
  return null;
}

// Accounts that existed on or before a given date — used so a snapshot
// only ever shows accounts that were actually open at that point in time.
// A brand-new account never retroactively appears in (or zeroes out) your
// older history.
function accountsAsOf(dateStr) {
  return state.accounts.filter(a => a.dateAdded <= dateStr && (!a.deletedDate || dateStr <= a.deletedDate));
}

// Collapse/expand a single snapshot. Reuses config.collapsedSections so the
// state persists across reloads, same mechanism as the Plan sections.
function toggleSnapshot(snapId) {
  const key = 'snap-' + snapId;
  config.collapsedSections[key] = !config.collapsedSections[key];
  saveConfig();
  render();
}

// Collapse or expand a generic named section (Plan sections, the Accounts
// section, the whole Snapshots section, etc).
function toggleSection(key) {
  config.collapsedSections[key] = !config.collapsedSections[key];
  saveConfig();
  render();
}

// ============================================================
//  SINKING FUNDS
// ============================================================
function ensureFundShape(fund) {
  if (!fund.id) fund.id = 'fund-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
  if (typeof fund.name !== 'string') fund.name = 'New fund';
  if (typeof fund.goalAmount !== 'number') fund.goalAmount = 0;
  if (!Array.isArray(fund.withdrawals)) fund.withdrawals = [];
  fund.withdrawals.forEach(w => {
    if (!w.id) w.id = 'fw-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
    if (typeof w.amount !== 'number') w.amount = parseFloat(w.amount) || 0;
    if (!w.date) w.date = new Date().toISOString();
    if (typeof w.note !== 'string') w.note = '';
  });
  // Migrate flat monthlyAmount + startMonth → rates array.
  if (!Array.isArray(fund.rates) || fund.rates.length === 0) {
    const amt = parseFloat(fund.monthlyAmount) || 0;
    const start = fund.startMonth || currentMonthKey();
    fund.rates = [{ startMonth: start, amount: amt }];
  }
  fund.rates.sort((a, b) => a.startMonth.localeCompare(b.startMonth));
  // Keep monthlyAmount in sync with the current (latest) rate.
  fund.monthlyAmount = fund.rates[fund.rates.length - 1].amount;
  fund.startMonth = fund.rates[0].startMonth;
}

// ---- Month arithmetic helpers ----
function prevMonthKey(mk) {
  let [y, m] = mk.split('-').map(Number);
  m--;
  if (m < 1) { m = 12; y--; }
  return `${y}-${String(m).padStart(2, '0')}`;
}

// Months from 'from' to 'to', inclusive of both ends.
function monthsInclusive(from, to) {
  const [fY, fM] = from.split('-').map(Number);
  const [tY, tM] = to.split('-').map(Number);
  return Math.max(0, (tY - fY) * 12 + (tM - fM) + 1);
}

// ---- Rate history helpers ----
// Set or update the contribution rate for a specific month.
function setFundRate(fund, month, amount) {
  if (!Array.isArray(fund.rates)) fund.rates = [];
  const existing = fund.rates.find(r => r.startMonth === month);
  if (existing) {
    existing.amount = amount;
  } else {
    fund.rates.push({ startMonth: month, amount });
    fund.rates.sort((a, b) => a.startMonth.localeCompare(b.startMonth));
  }
  // Sync convenience fields.
  fund.monthlyAmount = fund.rates[fund.rates.length - 1].amount;
  fund.startMonth = fund.rates[0].startMonth;
}

// Total contributed by a fund up through a given month (inclusive),
// respecting rate changes over time.
function fundContributedThrough(fund, asOfMonth) {
  const rates = fund.rates;
  if (!rates || rates.length === 0) return 0;
  let total = 0;
  for (let i = 0; i < rates.length; i++) {
    const start = rates[i].startMonth;
    if (start > asOfMonth) break; // future rate, not yet active
    // End of this rate's period: month before the next rate starts, or asOfMonth.
    let end;
    if (i < rates.length - 1 && rates[i + 1].startMonth <= asOfMonth) {
      end = prevMonthKey(rates[i + 1].startMonth);
    } else {
      end = asOfMonth;
    }
    const months = monthsInclusive(start, end);
    if (months > 0) total += months * rates[i].amount;
  }
  return total;
}

// How many months have elapsed from first rate to now (inclusive).
function fundMonthsElapsed(fund) {
  return monthsInclusive(fund.rates[0].startMonth, currentMonthKey());
}

// Compute balance and stats for a single fund as of the current month.
function computeFund(fund) {
  const months = fundMonthsElapsed(fund);
  const totalContributed = fundContributedThrough(fund, currentMonthKey());
  const totalWithdrawn = fund.withdrawals.reduce((a, w) => a + w.amount, 0);
  const balance = totalContributed - totalWithdrawn;
  const goalPct = fund.goalAmount > 0 ? (balance / fund.goalAmount) * 100 : 0;
  return { months, totalContributed, totalWithdrawn, balance, goalPct };
}

// Get the contribution rate that was active during a specific month.
function rateForMonth(fund, monthKey) {
  const rates = fund.rates;
  if (!rates || rates.length === 0) return 0;
  let active = rates[0].amount;
  for (const r of rates) {
    if (r.startMonth <= monthKey) active = r.amount;
    else break;
  }
  return active;
}

// Find the plan category linked to a given fund (searches current month's plan).
function linkedPlanItem(fundId) {
  const plan = currentPlan();
  for (const group of ['needs', 'wants', 'savings']) {
    for (const item of plan[group]) {
      if (item.linkedFundId === fundId) return { item, group };
    }
  }
  return null;
}

function updateFund(id, field, value) {
  const fund = state.autoFunds.find(f => f.id === id);
  if (!fund) return;
  if (field === 'monthlyAmount') {
    setFundRate(fund, currentMonthKey(), parseFloat(value) || 0);
  } else if (field === 'goalAmount') {
    fund.goalAmount = parseFloat(value) || 0;
  } else if (field === 'startMonth') {
    // Update the first rate's start month.
    if (fund.rates.length > 0) fund.rates[0].startMonth = value;
    fund.startMonth = value;
  } else {
    fund[field] = value;
  }
  saveLocal();
  render();
  debouncedSync();
}

  const fund = state.autoFunds.find(f => f.id === id);

  if (!confirm(`Delete the "${fund.name}" fund and all its history?`)) return;
  state.autoFunds = state.autoFunds.filter(f => f.id !== id);
  saveLocal();
  render();
  debouncedSync();
}

// ============================================================
//  DRAG TO REORDER
// ============================================================
// Pointer-event-based reorder. On touch devices a long-press
// initiates the drag so single taps and scrolls still work. On mouse,
// drag starts immediately on pointerdown. The lifted row is moved to
// document.body so that re-renders of the view (e.g. from a Drive sync
// completing mid-drag) can't tear it out of the DOM.

const DRAG = {
  active: false,
  pressing: false,
  startX: 0, startY: 0,
  pointerId: null,
  handleEl: null,
  rowEl: null,           // the lifted clone (moved to body)
  originalRowEl: null,   // the original row (now hidden in place as placeholder)
  list: null,
  groupKey: null,
  dragId: null,
  rowRect: null,
  offsetX: 0,
  offsetY: 0,
  pressTimer: null,
  targetIndex: -1,
  isTouch: false,
  cancelled: false,
};

// One persistent indicator lives in body the whole session. Hidden by default.
let DRAG_INDICATOR_EL = null;
function ensureDragIndicator() {
  if (DRAG_INDICATOR_EL && DRAG_INDICATOR_EL.isConnected) return DRAG_INDICATOR_EL;
  DRAG_INDICATOR_EL = document.createElement('div');
  DRAG_INDICATOR_EL.className = 'drop-indicator';
  DRAG_INDICATOR_EL.style.display = 'none';
  DRAG_INDICATOR_EL.style.position = 'fixed';
  DRAG_INDICATOR_EL.style.pointerEvents = 'none';
  DRAG_INDICATOR_EL.style.zIndex = '60';
  document.body.appendChild(DRAG_INDICATOR_EL);
  return DRAG_INDICATOR_EL;
}
function hideDragIndicator() {
  if (DRAG_INDICATOR_EL) DRAG_INDICATOR_EL.style.display = 'none';
}

// Returns the currently-rendered original rows in a drag list (excludes
// any lifted clone living in body).
function dragRowsInList(list) {
  if (!list || !list.isConnected) return [];
  return [...list.querySelectorAll(':scope > [data-drag-id]:not([data-drag-clone])')];
}

function isDragActive() {
  return DRAG.active || DRAG.pressing;
}

function attachDragHandlers() {
  document.querySelectorAll('[data-drag-handle]').forEach(handle => {
    handle.addEventListener('pointerdown', onDragPointerDown);
  });
}

function onDragPointerDown(e) {
  if (e.button !== undefined && e.button !== 0) return;
  // If a previous drag somehow didn't clean up, force-reset now.
  if (DRAG.active || DRAG.pressing) hardResetDrag();

  const handle = e.currentTarget;
  const row = handle.closest('[data-drag-id]');
  if (!row) return;
  const list = row.parentElement;
  if (!list || !list.classList.contains('drag-list')) return;

  DRAG.handleEl = handle;
  DRAG.originalRowEl = row;
  DRAG.list = list;
  DRAG.groupKey = row.dataset.dragKey;
  DRAG.dragId = row.dataset.dragId;
  DRAG.startX = e.clientX;
  DRAG.startY = e.clientY;
  DRAG.pointerId = e.pointerId;
  DRAG.isTouch = e.pointerType === 'touch';
  DRAG.pressing = true;
  DRAG.active = false;
  DRAG.cancelled = false;
  DRAG.targetIndex = -1;

  row.classList.add('drag-pressing');

  // Listen on window so we never miss a pointerup, even if the user
  // releases outside the handle. Avoid pointer capture — pointer
  // capture is lost when the captured element's parent re-renders,
  // which has been a source of stuck drags.
  window.addEventListener('pointermove', onDragPointerMove, { passive: false });
  window.addEventListener('pointerup', onDragPointerUp, true);
  window.addEventListener('pointercancel', onDragPointerCancel, true);

  const initiateDelay = DRAG.isTouch ? 350 : 0;
  DRAG.pressTimer = setTimeout(() => {
    if (DRAG.pressing && !DRAG.cancelled) startDragging(e);
  }, initiateDelay);
}

function startDragging(e) {
  if (!DRAG.originalRowEl || !DRAG.originalRowEl.isConnected) {
    hardResetDrag();
    return;
  }
  DRAG.active = true;
  const rect = DRAG.originalRowEl.getBoundingClientRect();
  DRAG.rowRect = rect;
  DRAG.offsetX = DRAG.startX - rect.left;
  DRAG.offsetY = DRAG.startY - rect.top;

  // Clone the row and lift the clone into document.body so a mid-drag
  // re-render (sync, etc.) can't destroy it.
  const clone = DRAG.originalRowEl.cloneNode(true);
  clone.setAttribute('data-drag-clone', '1');
  clone.classList.remove('drag-pressing');
  clone.classList.add('drag-lifted');
  clone.style.position = 'fixed';
  clone.style.top = rect.top + 'px';
  clone.style.left = rect.left + 'px';
  clone.style.width = rect.width + 'px';
  clone.style.margin = '0';
  clone.style.pointerEvents = 'none';
  clone.style.zIndex = '70';
  // Disable form-control interactivity in the clone.
  clone.querySelectorAll('input, select, button, textarea').forEach(el => {
    el.disabled = true;
    el.tabIndex = -1;
  });
  document.body.appendChild(clone);
  DRAG.rowEl = clone;

  // Hide the original in place so its slot is preserved.
  DRAG.originalRowEl.classList.remove('drag-pressing');
  DRAG.originalRowEl.classList.add('drag-ghost');

  ensureDragIndicator();

  if (DRAG.isTouch && navigator.vibrate) navigator.vibrate(15);

  updateDropTarget(e.clientY);
}

function onDragPointerMove(e) {
  if (!DRAG.pressing) return;

  if (!DRAG.active) {
    const dx = Math.abs(e.clientX - DRAG.startX);
    const dy = Math.abs(e.clientY - DRAG.startY);
    if (dx > 8 || dy > 8) {
      // User moved before long-press fired — treat as scroll, cancel.
      DRAG.cancelled = true;
      clearTimeout(DRAG.pressTimer);
      DRAG.pressTimer = null;
      if (DRAG.originalRowEl) DRAG.originalRowEl.classList.remove('drag-pressing');
      finishDrag(false);
    }
    return;
  }

  e.preventDefault();
  if (DRAG.rowEl) {
    DRAG.rowEl.style.top = (e.clientY - DRAG.offsetY) + 'px';
    DRAG.rowEl.style.left = (e.clientX - DRAG.offsetX) + 'px';
  }
  updateDropTarget(e.clientY);

  const edge = 60;
  if (e.clientY < edge) window.scrollBy(0, -8);
  else if (e.clientY > window.innerHeight - edge) window.scrollBy(0, 8);
}

function updateDropTarget(clientY) {
  if (!DRAG.list || !DRAG.list.isConnected) { hideDragIndicator(); return; }
  const rows = dragRowsInList(DRAG.list).filter(r => r !== DRAG.originalRowEl);
  if (rows.length === 0) {
    DRAG.targetIndex = 0;
    hideDragIndicator();
    return;
  }

  let bestIndex = -1;
  let bestPosition = 'before';
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].getBoundingClientRect();
    const midY = r.top + r.height / 2;
    if (clientY < midY) {
      bestIndex = i;
      bestPosition = 'before';
      break;
    }
    if (i === rows.length - 1) {
      bestIndex = i;
      bestPosition = 'after';
    }
  }
  if (bestIndex === -1) { bestIndex = 0; bestPosition = 'before'; }

  const refRect = rows[bestIndex].getBoundingClientRect();
  const ind = ensureDragIndicator();
  ind.style.display = 'block';
  ind.style.left = refRect.left + 'px';
  ind.style.width = refRect.width + 'px';
  ind.style.top = (bestPosition === 'before' ? refRect.top - 1 : refRect.bottom - 1) + 'px';

  // Compute final index in the underlying data array.
  const fullRows = dragRowsInList(DRAG.list);
  const draggedOriginalIdx = fullRows.indexOf(DRAG.originalRowEl);
  const targetOriginalIdx = fullRows.indexOf(rows[bestIndex]);
  let finalIdx = bestPosition === 'before' ? targetOriginalIdx : targetOriginalIdx + 1;
  if (draggedOriginalIdx >= 0 && draggedOriginalIdx < targetOriginalIdx) finalIdx -= 1;
  DRAG.targetIndex = finalIdx;
}

function onDragPointerUp(e) {
  if (!DRAG.pressing) return;
  clearTimeout(DRAG.pressTimer);
  DRAG.pressTimer = null;

  const shouldCommit = DRAG.active && !DRAG.cancelled && DRAG.targetIndex >= 0;
  finishDrag(shouldCommit);
}

function onDragPointerCancel(e) {
  if (!DRAG.pressing) return;
  clearTimeout(DRAG.pressTimer);
  DRAG.pressTimer = null;
  finishDrag(false);
}

function finishDrag(commit) {
  const groupKey = DRAG.groupKey;
  const dragId = DRAG.dragId;
  const targetIndex = DRAG.targetIndex;

  // Tear down DOM and listeners first so the subsequent render() starts
  // from a clean slate.
  hardResetDrag();

  if (commit) commitReorder(groupKey, dragId, targetIndex);
}

// Synchronously remove every trace of a drag from the DOM and reset state.
// Safe to call at any time, even if no drag is active.
function hardResetDrag() {
  clearTimeout(DRAG.pressTimer);
  DRAG.pressTimer = null;

  window.removeEventListener('pointermove', onDragPointerMove, { passive: false });
  window.removeEventListener('pointerup', onDragPointerUp, true);
  window.removeEventListener('pointercancel', onDragPointerCancel, true);

  // Remove any lifted clone(s). Use a query in case multiple ever leaked.
  document.querySelectorAll('[data-drag-clone]').forEach(el => el.remove());

  // Restore the original row's visual state.
  if (DRAG.originalRowEl) {
    DRAG.originalRowEl.classList.remove('drag-pressing', 'drag-ghost');
  }
  // Belt and suspenders: any row in the document that still has these
  // classes (e.g. survived a re-render with stale state) gets cleaned up.
  document.querySelectorAll('.drag-pressing, .drag-ghost').forEach(el => {
    el.classList.remove('drag-pressing', 'drag-ghost');
  });

  hideDragIndicator();

  DRAG.active = false;
  DRAG.pressing = false;
  DRAG.cancelled = false;
  DRAG.handleEl = null;
  DRAG.rowEl = null;
  DRAG.originalRowEl = null;
  DRAG.list = null;
  DRAG.groupKey = null;
  DRAG.dragId = null;
  DRAG.pointerId = null;
  DRAG.targetIndex = -1;
}

function commitReorder(groupKey, id, targetIndex) {
  if (targetIndex < 0) return;
  const plan = currentPlan();
  let arr;
  if (groupKey === 'income') arr = plan.income.sources;
  else arr = plan[groupKey];
  if (!arr) return;
  const fromIdx = arr.findIndex(x => x.id === id);
  if (fromIdx < 0) return;
  const [item] = arr.splice(fromIdx, 1);
  const clamped = Math.max(0, Math.min(targetIndex, arr.length));
  if (clamped === fromIdx) {
    // No actual change — re-insert in place; skip save+sync.
    arr.splice(fromIdx, 0, item);
    return;
  }
  arr.splice(clamped, 0, item);
  saveLocal();
  render();
  debouncedSync();
}

// ============================================================
//  VIEWS
// ============================================================
function render() {
  // If a re-render happens while a drag is in flight (e.g. a Drive sync
  // completed mid-drag, or some other state mutation triggered render),
  // tear the drag down first so we never leave orphaned DOM behind.
  if (typeof hardResetDrag === 'function' && (DRAG.active || DRAG.pressing)) {
    hardResetDrag();
  }
  document.getElementById('month-label').textContent = 'Personal · ' + monthLabel(activeMonth);
  updateMonthTrigger();
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === activeTab);
  });
  const mobileSelect = document.getElementById('tabs-mobile-select');
  if (mobileSelect) mobileSelect.value = activeTab;
  document.getElementById('settings-btn').classList.toggle('active', activeTab === 'settings');
  document.getElementById('version-label').textContent = 'v' + APP_VERSION;
  const fab = document.getElementById('fab');
  if (fab) {
    const fabHidden = activeTab === 'plan' || activeTab === 'settings';
    fab.style.display = fabHidden ? 'none' : 'flex';
    fab.setAttribute('aria-label', activeTab === 'accounts' ? 'Add account snapshot' : activeTab === 'funds' ? 'Add fund' : 'Add transaction');
    fab.title = activeTab === 'accounts' ? 'New snapshot' : activeTab === 'funds' ? 'New fund' : 'New transaction';
  }
  const view = document.getElementById('view');
  if (activeTab === 'dashboard') view.innerHTML = renderDashboard();
  else if (activeTab === 'transactions') view.innerHTML = renderTransactions();
  else if (activeTab === 'plan') view.innerHTML = renderPlan();
  else if (activeTab === 'accounts') view.innerHTML = renderAccounts();
  else if (activeTab === 'funds') view.innerHTML = renderFunds();
  else if (activeTab === 'settings') view.innerHTML = renderSettings();
  attachViewHandlers();
}

function renderDashboard() {
  const { needs, wants, savings, needsPlanned, wantsPlanned, savingsPlanned } = groupTotals();
  const takeHome = currentTakeHome();
  const allSpent = needs + wants + savings;
  const remaining = takeHome - allSpent;
  const remainingPct = takeHome > 0 ? (remaining / takeHome) * 100 : 0;
  const needsPct = takeHome > 0 ? (needs / takeHome) * 100 : 0;
  const wantsPct = takeHome > 0 ? (wants / takeHome) * 100 : 0;
  const savingsPct = takeHome > 0 ? (savings / takeHome) * 100 : 0;
  const remainingState = remaining < 0 ? 'negative' : (takeHome > 0 && remaining < takeHome * 0.05) ? 'warn' : '';
  const txnCount = monthTxns().length;
  const spent = spentByCategory();

  // Calculate auto-committed total.
  const allCats = [...currentPlan().needs, ...currentPlan().wants, ...currentPlan().savings];
  const autoTotal = allCats.filter(c => c.isAuto && c.planned > 0).reduce((a, c) => a + c.planned, 0);
  const autoCount = allCats.filter(c => c.isAuto && c.planned > 0).length;

  const catGroup = (title, items, total, planned) => `
    <div class="group-section">
      <div class="group-header">
        <h2 class="group-title">${title}</h2>
        <div class="group-stats">$${fmt(total)} of $${fmt(planned)} planned</div>
      </div>
      <div class="cat-grid">
        ${items.map(item => {
          const s = spent[item.id] || 0;
          const pct = item.planned > 0 ? (s / item.planned) * 100 : 0;
          const isOver = pct > 100;
          const isWarn = pct > 80 && !isOver;
          const isAuto = !!item.isAuto;
          const linkedFund = item.linkedFundId ? state.autoFunds.find(f => f.id === item.linkedFundId) : null;
          const fundBal = linkedFund ? computeFund(linkedFund).balance : 0;
          return `
            <div class="cat-card ${isOver ? 'over' : isWarn ? 'warn' : ''}" ${linkedFund ? `data-action="go-to-fund" data-fund-id="${linkedFund.id}" style="cursor:pointer;"` : ''}>
              <div class="cat-name" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                ${escapeHtml(item.name)}
                ${isAuto ? '<span class="auto-badge"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>Auto</span>' : ''}
              </div>
              <div class="cat-amounts">
                <span class="cat-spent">$${fmt(s)}</span>
                <span class="cat-planned">/ $${item.planned}</span>
              </div>
              <div class="cat-progress">
                <div class="cat-progress-fill ${isOver ? 'over' : isWarn ? 'warn' : ''}" style="width: ${Math.min(pct, 100)}%"></div>
              </div>
              <div class="cat-pct">
                ${item.planned === 0 ? 'No budget set'
                  : isAuto ? 'Auto-deducted'
                  : pct.toFixed(0) + '% used' + (isOver ? ' — over' : '')}
                ${linkedFund ? ` · <span class="linked-badge" style="display:inline-flex;" data-action="go-to-fund" data-fund-id="${linkedFund.id}">↗ Fund: $${fmt(fundBal)}</span>` : ''}
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>`;

  const planViewMode = config.planViewMode === 'planned' ? 'planned' : 'spent';
  const isPlannedView = planViewMode === 'planned';
  const dNeeds = isPlannedView ? needsPlanned : needs;
  const dWants = isPlannedView ? wantsPlanned : wants;
  const dSavings = isPlannedView ? savingsPlanned : savings;
  const dNeedsPct = takeHome > 0 ? (dNeeds / takeHome) * 100 : 0;
  const dWantsPct = takeHome > 0 ? (dWants / takeHome) * 100 : 0;
  const dSavingsPct = takeHome > 0 ? (dSavings / takeHome) * 100 : 0;
  const unallocated = takeHome - (dNeeds + dWants + dSavings);
  const unallocatedPct = takeHome > 0 ? (unallocated / takeHome) * 100 : 0;
  const isOverAllocated = unallocated < -0.005;

  const remainingStickyBar = `
    <div class="net-worth-sticky" id="remaining-sticky">
      <span class="net-worth-sticky-label">Remaining this month</span>
      <span class="net-worth-sticky-value ${remainingState === 'negative' ? 'negative' : ''}">$${fmt(remaining)}</span>
      ${takeHome > 0 ? `<span class="net-worth-sticky-delta">${remainingPct.toFixed(0)}% unspent</span>` : ''}
    </div>
  `;

  return `
    ${remainingStickyBar}
    <div class="dashboard-top">
      <div class="hero-card">
        <div class="hero-label">Remaining this month</div>
        <div class="hero-amount ${remainingState}">$${fmt(remaining)}</div>
        <div class="hero-detail">of $${fmt(takeHome)} take-home · ${takeHome > 0 ? remainingPct.toFixed(0) : '0'}% unspent · ${txnCount} transactions${autoCount > 0 ? ` · $${fmt(autoTotal)} auto-committed` : ''}</div>
        <div class="hero-bar">
          <div class="hero-bar-seg hero-bar-needs" style="width: ${Math.min(needsPct, 100)}%"></div>
          <div class="hero-bar-seg hero-bar-wants" style="width: ${Math.min(wantsPct, 100)}%"></div>
          <div class="hero-bar-seg hero-bar-savings" style="width: ${Math.min(savingsPct, 100)}%"></div>
        </div>
        <div class="hero-legend">
          <div class="hero-legend-item"><div class="hero-legend-dot" style="background:var(--bar-needs)"></div>Needs $${fmt(needs)} (${needsPct.toFixed(0)}%)</div>
          <div class="hero-legend-item"><div class="hero-legend-dot" style="background:var(--bar-wants)"></div>Wants $${fmt(wants)} (${wantsPct.toFixed(0)}%)</div>
          <div class="hero-legend-item"><div class="hero-legend-dot" style="background:var(--bar-savings)"></div>Savings $${fmt(savings)} (${savingsPct.toFixed(0)}%)</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-card-head">
          <div class="hero-label">50/30/20 plan</div>
          <div class="plan-view-toggle">
            <button class="plan-view-btn ${!isPlannedView ? 'active' : ''}" data-action="set-plan-view" data-view="spent">Spent</button>
            <button class="plan-view-btn ${isPlannedView ? 'active' : ''}" data-action="set-plan-view" data-view="planned">Planned</button>
          </div>
        </div>
        <div class="summary-row">
          <span class="summary-label">Needs</span>
          <span><span class="summary-value">$${fmt(dNeeds)}</span><span class="summary-pct">${dNeedsPct.toFixed(0)}% / 50%</span></span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Wants</span>
          <span><span class="summary-value">$${fmt(dWants)}</span><span class="summary-pct">${dWantsPct.toFixed(0)}% / 30%</span></span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Savings</span>
          <span><span class="summary-value">$${fmt(dSavings)}</span><span class="summary-pct">${dSavingsPct.toFixed(0)}% / 20%</span></span>
        </div>
        ${isPlannedView ? `
        <div class="summary-row summary-row-unalloc ${isOverAllocated ? 'over' : ''}">
          <span class="summary-label">${isOverAllocated ? 'Over-allocated' : 'Unallocated'}</span>
          <span><span class="summary-value">$${fmt(Math.abs(unallocated))}</span><span class="summary-pct">${Math.abs(unallocatedPct).toFixed(0)}%</span></span>
        </div>` : ''}
      </div>
    </div>
    ${catGroup('Savings', currentPlan().savings, savings, savingsPlanned)}
    ${catGroup('Needs', currentPlan().needs, needs, needsPlanned)}
    ${catGroup('Wants', currentPlan().wants, wants, wantsPlanned)}
    ${state.autoFunds.length > 0 ? renderDashboardFundsSummary() : ''}
  `;
}

function renderDashboardFundsSummary() {
  const funds = state.autoFunds;
  const totalBal = funds.reduce((a, f) => a + computeFund(f).balance, 0);
  const totalMonthly = funds.reduce((a, f) => a + f.monthlyAmount, 0);
  return `
    <div class="group-section">
      <div class="group-header">
        <h2 class="group-title">Sinking Funds</h2>
        <div class="group-stats">$${fmt(totalMonthly)}/mo auto-funded</div>
      </div>
      <div class="cat-grid">
        ${funds.map(fund => {
          const c = computeFund(fund);
          const hasGoal = fund.goalAmount > 0;
          const pct = hasGoal ? (c.balance / fund.goalAmount) * 100 : 0;
          const isOver = pct >= 100;
          const isWarn = pct > 70 && !isOver;
          return `
            <div class="cat-card ${isOver ? '' : isWarn ? 'warn' : ''}">
              <div class="cat-name">${escapeHtml(fund.name)}</div>
              <div class="cat-amounts">
                <span class="cat-spent" style="color:var(--accent);">$${fmt(c.balance)}</span>
                ${hasGoal ? `<span class="cat-planned">/ $${fmt(fund.goalAmount)} goal</span>` : `<span class="cat-planned">$${fmt(fund.monthlyAmount)}/mo</span>`}
              </div>
              ${hasGoal ? `
                <div class="cat-progress">
                  <div class="cat-progress-fill ${isOver ? '' : isWarn ? 'warn' : ''}" style="width: ${Math.min(pct, 100)}%;${isOver ? 'background:var(--good);' : ''}"></div>
                </div>
                <div class="cat-pct">${isOver ? 'Goal reached!' : pct.toFixed(0) + '% of goal'}</div>
              ` : `
                <div class="cat-pct">${c.months} month${c.months !== 1 ? 's' : ''} · $${fmt(c.totalContributed)} contributed</div>
              `}
            </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function renderTransactions() {
  const txns = monthTxns();
  const allCats = [...currentPlan().needs, ...currentPlan().wants, ...currentPlan().savings];

  const sorted = [...txns].sort((a, b) => new Date(b.date) - new Date(a.date));

  return `

// Build a clean single-line SVG area chart of net worth over time — no
// overlaid assets/liabilities/available series, just the one trend line,
// closer to how most net-worth trackers present it. Pure SVG so it themes
// via CSS vars and needs no external library.
function buildNetWorthChart(snaps) {
  if (snaps.length === 0) return '';

  const W = 720, H = 220;
  const padL = 50, padR = 12, padT = 14, padB = 30;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const points = snaps.map(s => ({ date: s.date, net: snapshotTotals(s).net }));

  let minV = Math.min(0, ...points.map(p => p.net));
  let maxV = Math.max(0, ...points.map(p => p.net));
  if (minV === maxV) { maxV = minV + 1; } // avoid divide by zero
  const range = maxV - minV;
  maxV += range * 0.1;
  minV -= range * 0.1;

  const n = points.length;
  // Position points proportionally to elapsed time, not just index — a
  // 6-month gap reads visibly wider than a 2-week gap.
  const times = points.map(p => new Date(p.date + 'T00:00:00').getTime());
  const minT = times[0];
  const maxT = times[n - 1];
  const timeRange = maxT - minT;
  const xFor = (i) => (n === 1 || timeRange === 0)
    ? padL + plotW / 2
    : padL + ((times[i] - minT) / timeRange) * plotW;
  const yFor = (v) => padT + (1 - (v - minV) / (maxV - minV)) * plotH;

  // X-axis date labels: keep first & last, greedily fill in between as
  // space allows so labels never overlap regardless of spacing.
  const minGap = 60;
  const labelIndices = [0];
  for (let i = 1; i < n; i++) {
    const isLast = i === n - 1;
    if (isLast || xFor(i) - xFor(labelIndices[labelIndices.length - 1]) >= minGap) {
      labelIndices.push(i);
    }
  }
  if (labelIndices.length > 2) {
    const lastTwo = labelIndices.slice(-2);
    if (xFor(lastTwo[1]) - xFor(lastTwo[0]) < minGap) {
      labelIndices.splice(labelIndices.length - 2, 1);
    }
  }
  const labelIdx = new Set(labelIndices);

  let xLabels = '';
  points.forEach((p, i) => {
    if (!labelIdx.has(i)) return;
    const anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
    xLabels += `<text x="${xFor(i).toFixed(1)}" y="${H - 8}" class="chart-axis-label" text-anchor="${anchor}">${escapeHtml(formatDateShort(p.date))}</text>`;
  });

  // Zero baseline emphasized if within range.
  let zeroSvg = '';
  if (minV < 0 && maxV > 0) {
    const yz = yFor(0);
    zeroSvg = `<line x1="${padL}" y1="${yz.toFixed(1)}" x2="${W - padR}" y2="${yz.toFixed(1)}" class="chart-zero" />`;
  }

  const netLine = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${xFor(i).toFixed(1)},${yFor(p.net).toFixed(1)}`).join(' ');
  const baseY = (minV < 0 && maxV > 0) ? yFor(0) : (padT + plotH);
  const areaPath = `${netLine} L${xFor(n - 1).toFixed(1)},${baseY.toFixed(1)} L${xFor(0).toFixed(1)},${baseY.toFixed(1)} Z`;

  const endDot = `<circle cx="${xFor(n - 1).toFixed(1)}" cy="${yFor(points[n - 1].net).toFixed(1)}" r="4" class="chart-dot" />`;

  // Stash everything the hover-tooltip handler needs. Read fresh on every
  // pointermove rather than baked into the SVG, since points/xFor close
  // over this render's scale — a later render replaces this object wholesale.
  chartHoverState = { points, xPix: points.map((_, i) => xFor(i)), yFor, padT, plotH };

  return `
    <div class="chart-wrap">
      <svg class="assets-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Net worth trend chart">
        ${zeroSvg}
        <path d="${areaPath}" class="chart-area" />
        <path d="${netLine}" class="chart-line chart-line-net" />
        ${endDot}
        ${xLabels}
        <line id="chart-hover-line" class="chart-hoverline" x1="0" y1="0" x2="0" y2="0" style="opacity:0" />
        <circle id="chart-hover-dot-net" class="chart-hoverdot dot-net" r="4.5" style="opacity:0" />
      </svg>
      <div class="chart-tooltip" id="chart-tooltip" style="opacity:0"></div>
    </div>
  `;
}

// Wires up the crosshair + tooltip for the net worth trend chart. Called
// after every render(); no-ops harmlessly if the chart isn't on screen.
function setupNetWorthChartHover() {
  const data = chartHoverState;
  const svg = document.querySelector('.assets-chart');
  const wrap = document.querySelector('.chart-wrap');
  const tooltip = document.getElementById('chart-tooltip');
  const hoverLine = document.getElementById('chart-hover-line');
  if (!data || !svg || !wrap || !tooltip || !hoverLine) return;

  const dotNet = document.getElementById('chart-hover-dot-net');

  function nearestIndex(svgX) {
    let best = 0, bestDist = Infinity;
    data.xPix.forEach((x, i) => {
      const d = Math.abs(x - svgX);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    return best;
  }

  // Converts a point's SVG-space coordinates to screen pixels, so the
  // tooltip can be anchored to where the line actually is on screen —
  // not to wherever a finger happens to be touching.
  function pointScreenPos(x, y) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const pt = svg.createSVGPoint();
    pt.x = x; pt.y = y;
    return pt.matrixTransform(ctm);
  }

  function showAt(i) {
    const p = data.points[i];
    const x = data.xPix[i];
    const y = data.yFor(p.net);
    hoverLine.setAttribute('x1', x); hoverLine.setAttribute('x2', x);
    hoverLine.setAttribute('y1', data.padT); hoverLine.setAttribute('y2', data.padT + data.plotH);
    hoverLine.style.opacity = 1;

    dotNet.setAttribute('cx', x); dotNet.setAttribute('cy', y); dotNet.style.opacity = 1;

    tooltip.innerHTML = `<div class="chart-tooltip-date">${escapeHtml(formatDateShort(p.date))}</div>
      <div class="chart-tooltip-row">Net worth <strong>$${fmt(p.net)}</strong></div>`;
    tooltip.style.opacity = 1;

    const wrapRect = wrap.getBoundingClientRect();
    const screenPos = pointScreenPos(x, y);
    if (!screenPos) return;
    const pointX = screenPos.x - wrapRect.left;
    const pointY = screenPos.y - wrapRect.top;
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    const gap = 12; // clearance between the tooltip and the plotted line

    // Always place the tooltip above the line at this point — never below
    // it, where a thumb would be covering the chart on a touch device.
    let left = pointX - tw / 2;
    let top = pointY - th - gap;
    if (left < 4) left = 4;
    if (left + tw > wrapRect.width - 4) left = wrapRect.width - tw - 4;
    if (top < 4) top = 4; // pinned near the top if the line itself is close to it
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }

  function hide() {
    hoverLine.style.opacity = 0;
    dotNet.style.opacity = 0;
    tooltip.style.opacity = 0;
  }

  function handleMove(e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return;
    const loc = pt.matrixTransform(ctm.inverse());
    showAt(nearestIndex(loc.x));
  }

  svg.addEventListener('pointermove', handleMove);
  svg.addEventListener('pointerdown', handleMove);
  svg.addEventListener('pointerleave', hide);
}

// Keeps a reference to the current observer so we can disconnect it before
// each re-render sets up a fresh one — each tab replaces the DOM wholesale
// on every state change, so a stale observer would otherwise keep watching
// a detached element.
let stickyBarObserver = null;

// Shows a condensed summary bar pinned to the top of the screen once
// you've scrolled past that tab's main hero card — so the headline number
// stays visible while you're down browsing categories or snapshots.
// Checks every known hero/bar pair; only one tab is ever on screen at a
// time, so at most one pair will actually be found in the DOM.
function setupStickyBar() {
  if (stickyBarObserver) {
    stickyBarObserver.disconnect();
    stickyBarObserver = null;
  }
  if (typeof IntersectionObserver === 'undefined') return;

  const pairs = [
    { hero: '.assets-hero', bar: 'net-worth-sticky' },
    { hero: '.hero-card', bar: 'remaining-sticky' },
  ];
  for (const { hero, bar } of pairs) {
    const heroEl = document.querySelector(hero);
    const barEl = document.getElementById(bar);
    if (!heroEl || !barEl) continue;
    stickyBarObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        // Only show once the hero has scrolled up and out of view — not
        // before it's been scrolled to in the first place.
        const scrolledPast = !entry.isIntersecting && entry.boundingClientRect.top < 0;
        barEl.classList.toggle('visible', scrolledPast);
      });
    }, { threshold: 0 });
    stickyBarObserver.observe(heroEl);
    break;
  }
}

// Compact currency for axis labels: $1.2k, $45k, $1.3M, etc.
function fmtCompact(v) {
  const neg = v < 0;
  let a = Math.abs(v);
  let s;
  if (a >= 1e6) s = (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  else if (a >= 1e3) s = (a / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'k';
  else s = a.toFixed(0);
  return (neg ? '-$' : '$') + s;
}

function formatDateShort(iso) {
  // iso is YYYY-MM-DD; render as e.g. "Jun 7 '26"
  const parts = String(iso).split('-');
  if (parts.length !== 3) return iso;
  const [y, m, d] = parts.map(Number);
  const dt = new Date(y, m - 1, d);
  if (isNaN(dt)) return iso;
  return `${MONTH_NAMES[dt.getMonth()]} ${dt.getDate()} '${String(y).slice(2)}`;
}

// Cards for the standalone "Your Accounts" management section — one card
// per persistent account, showing its institution badge, type, last 4
// digits, category, and latest recorded balance.
// Renders account groups (Cash, Investments, Real Estate, etc.) as cards,
// each with a group total + delta over the selected chart range, and every
// account within it listed by latest balance and last-updated date.
// `baselineSnap` is the snapshot at the start of the selected range —
// used to compute each group's delta consistently with the hero above it.
function renderAccountGroups(baselineSnap, latestSnap) {
  const activeAccounts = state.accounts.filter(a => !a.deletedDate);
  const removedAccounts = state.accounts.filter(a => a.deletedDate);

  if (activeAccounts.length === 0 && removedAccounts.length === 0) {
    return `
      <div class="empty acct-empty">
        <div class="empty-big">No accounts yet</div>
        <div>Add every account you want to track — checking, savings, credit cards, retirement, brokerage, loans, anything. Label each one so your net worth always adds up correctly.</div>
        <button class="btn-primary assets-empty-btn" data-action="add-account">Add your first account</button>
      </div>
    `;
  }

  function balanceInSnap(snap, acctId) {
    if (!snap) return null;
    const ent = snap.entries.find(e => e.accountId === acctId);
    return ent ? ent.amount : null;
  }

  const groups = ACCOUNT_GROUP_ORDER
    .map(name => ({ name, accounts: activeAccounts.filter(a => accountGroupName(a) === name) }))
    .filter(g => g.accounts.length > 0);

  const groupCards = groups.map(g => {
    const latestTotal = g.accounts.reduce((sum, a) => sum + (balanceInSnap(latestSnap, a.id) ?? 0), 0);
    const baseTotal = baselineSnap
      ? g.accounts.reduce((sum, a) => sum + (balanceInSnap(baselineSnap, a.id) ?? 0), 0)
      : null;
    const groupDelta = baseTotal !== null ? latestTotal - baseTotal : null;
    const groupPct = (baseTotal && baseTotal !== 0) ? (groupDelta / Math.abs(baseTotal)) * 100 : null;
    const isLiabGroup = g.name === 'Liabilities';

    const rows = g.accounts.map(acct => {
      const bal = latestBalanceForAccount(acct.id);
      const balClass = bal === null ? '' : isLiabGroup ? 'neg' : bal < 0 ? 'neg' : 'pos';
      const lastDate = (() => {
        const snaps = sortedSnapshots();
        for (let i = snaps.length - 1; i >= 0; i--) {
          if (snaps[i].entries.some(e => e.accountId === acct.id)) return snaps[i].date;
        }
        return null;
      })();
      return `
        <div class="acct-row" data-action="edit-account" data-acct-id="${acct.id}">
          ${institutionBadge(acct, 36)}
          <div class="acct-row-info">
            <div class="acct-row-name">${escapeHtml(acct.name)}</div>
            <div class="acct-row-meta">${escapeHtml(accountTypeInfo(acct.type).label)}${acct.last4 ? ` · •••• ${escapeHtml(acct.last4)}` : ''}</div>
          </div>
          <div class="acct-row-side">
            <span class="acct-row-balance ${balClass}">${bal === null ? '—' : `$${fmt(bal)}`}</span>
            <span class="acct-row-updated">${lastDate ? relativeDateLabel(lastDate) : 'no data yet'}</span>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="acct-group-card">
        <div class="acct-group-head">
          <div>
            <div class="acct-group-name">${escapeHtml(g.name)}</div>
            ${groupDelta !== null ? `
              <div class="acct-group-delta ${groupDelta >= 0 ? 'pos' : 'neg'}">
                ${groupDelta >= 0 ? '↑' : '↓'} $${fmt(Math.abs(groupDelta))}${groupPct !== null ? ` (${Math.abs(groupPct).toFixed(1)}%)` : ''}
              </div>` : ''}
          </div>
          <span class="acct-group-total ${isLiabGroup ? 'neg' : 'pos'}">$${fmt(latestTotal)}</span>
        </div>
        <div class="acct-group-rows">${rows}</div>
      </div>
    `;
  }).join('');

  const activeEmptyHint = activeAccounts.length === 0 ? `
    <div class="empty acct-empty">
      <div class="empty-big">No active accounts</div>
      <div>All your accounts are currently removed. Add a new one, or restore one below.</div>
      <button class="btn-primary assets-empty-btn" data-action="add-account">Add an account</button>
    </div>
  ` : '';

  // Removed accounts stay out of the active groups and out of new
  // snapshots, but their label and every past recorded amount are
  // untouched — this list is just for restoring them or, if you're sure,
  // erasing them for good.
  const removedCollapsed = !!config.collapsedSections['removed-accounts'];
  const removedSection = removedAccounts.length > 0 ? `
    <div class="acct-removed-section">
      <button class="acct-removed-toggle ${removedCollapsed ? 'collapsed' : ''}" data-action="toggle-section" data-section-key="removed-accounts" aria-expanded="${!removedCollapsed}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
        Removed accounts (${removedAccounts.length})
      </button>
      <div class="section-body ${removedCollapsed ? 'collapsed' : ''}">
        <div class="acct-group-card">
          <div class="acct-group-rows">
            ${removedAccounts.map(acct => `
              <div class="acct-row acct-row-removed">
                ${institutionBadge(acct, 36)}
                <div class="acct-row-info">
                  <div class="acct-row-name">${escapeHtml(acct.name)}</div>
                  <div class="acct-row-meta">Removed ${escapeHtml(formatDateShort(acct.deletedDate))}</div>
                </div>
                <div class="acct-row-removed-actions">
                  <button class="btn-secondary btn-sm" data-action="restore-account" data-acct-id="${acct.id}">Restore</button>
                  <button class="icon-btn" data-action="hard-delete-account" data-acct-id="${acct.id}" aria-label="Permanently delete ${escapeHtml(acct.name)}" title="Delete permanently">🗑</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
  ` : '';

  return `<div class="acct-group-list">${groupCards}${activeEmptyHint}${removedSection}</div>`;
}

function renderAccounts() {
  const snaps = sortedSnapshots();
  chartHoverState = null; // reset; buildNetWorthChart() repopulates it if called below

  const acctSectionCollapsed = !!config.collapsedSections['accounts-section'];
  const buildHeaderRow = (baselineSnap, latestSnap) => `
    <div class="group-header assets-list-header">
      <div class="plan-section-head-left">
        <button class="section-toggle ${acctSectionCollapsed ? 'collapsed' : ''}" data-action="toggle-section" data-section-key="accounts-section" aria-label="Toggle accounts section" aria-expanded="${!acctSectionCollapsed}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <h2 class="group-title">Accounts</h2>
      </div>
      <div class="assets-list-actions">
        <button class="btn-secondary" data-action="add-account">+ Add account</button>
      </div>
    </div>
    <div class="section-body ${acctSectionCollapsed ? 'collapsed' : ''}">
      ${renderAccountGroups(baselineSnap, latestSnap)}
    </div>
  `;

  if (snaps.length === 0) {
    return `
      ${buildHeaderRow(null, null)}
      <div class="assets-intro">
        <div class="empty">
          <div class="empty-big">No snapshots yet</div>
          <div>${state.accounts.length === 0
            ? 'Add your accounts above, then take a snapshot to start tracking your net worth over time.'
            : "Take a snapshot of your accounts' balances on any day. Add a few over time and you'll see your net worth trend here."}</div>
          ${state.accounts.length > 0 ? `<button class="btn-primary assets-empty-btn" data-action="add-snapshot">Take your first snapshot</button>` : ''}
        </div>
      </div>
    `;
  }

  const latest = snaps[snaps.length - 1];
  const latestTotals = snapshotTotals(latest);

  // Change since your immediately previous snapshot — independent of
  // whatever chart range is selected below.
  const prev = snaps.length > 1 ? snaps[snaps.length - 2] : null;
  const prevNet = prev ? snapshotTotals(prev).net : null;
  const lastDelta = prevNet === null ? null : latestTotals.net - prevNet;
  const lastDeltaPct = (lastDelta !== null && prevNet !== 0) ? (lastDelta / Math.abs(prevNet)) * 100 : null;
  const lastDeltaClass = lastDelta === null ? '' : lastDelta >= 0 ? 'pos' : 'neg';
  const lastDeltaStr = lastDelta === null ? '' :
    `${lastDelta >= 0 ? '↑' : '↓'} $${fmt(Math.abs(lastDelta))}${lastDeltaPct !== null ? ` (${Math.abs(lastDeltaPct).toFixed(1)}%)` : ''} since last snapshot`;

  // The chart + range delta both respect the selected time range, filtered
  // and anchored to your most recent snapshot (see filterSnapsByRange).
  const range = config.accountsChartRange || 'all';
  const rangedSnaps = filterSnapsByRange(snaps, range);
  const baseline = rangedSnaps.length > 0 ? rangedSnaps[0] : snaps[0];
  const baselineNet = snapshotTotals(baseline).net;
  const delta = (rangedSnaps.length > 1) ? latestTotals.net - baselineNet : null;
  const deltaPct = (delta !== null && baselineNet !== 0) ? (delta / Math.abs(baselineNet)) * 100 : null;
  const deltaClass = delta === null ? '' : delta >= 0 ? 'pos' : 'neg';
  const deltaStr = delta === null ? '' :
    `${delta >= 0 ? '↑' : '↓'} $${fmt(Math.abs(delta))}${deltaPct !== null ? ` (${Math.abs(deltaPct).toFixed(1)}%)` : ''} · ${chartRangeLabel(range)}`;

  const rangePills = CHART_RANGES.map(r =>
    `<button class="range-pill ${range === r.id ? 'active' : ''}" data-action="set-chart-range" data-range="${r.id}">${r.label}</button>`
  ).join('');

  const stickyBar = `
    <div class="net-worth-sticky" id="net-worth-sticky">
      <span class="net-worth-sticky-label">Net worth</span>
      <span class="net-worth-sticky-value ${latestTotals.net < 0 ? 'negative' : ''}">$${fmt(latestTotals.net)}</span>
      ${lastDelta !== null ? `<span class="net-worth-sticky-delta ${lastDeltaClass}">${lastDelta >= 0 ? '↑' : '↓'} $${fmt(Math.abs(lastDelta))}</span>` : ''}
    </div>
  `;

  const fundsToggleRow = state.autoFunds.length > 0 ? `
    <div class="funds-toggle-row">
      <span class="funds-toggle-label">Subtract Committed Funds</span>
      <div class="plan-view-toggle">
        <button class="plan-view-btn ${!config.excludeFundsFromNetWorth ? 'active' : ''}" data-action="set-funds-in-net" data-value="false">Off</button>
        <button class="plan-view-btn ${config.excludeFundsFromNetWorth ? 'active' : ''}" data-action="set-funds-in-net" data-value="true">On</button>
      </div>
    </div>
  ` : '';

  const heroChart = `
    <div class="assets-hero">
      <div class="hero-label">Net worth · ${escapeHtml(formatDateShort(latest.date))}</div>
      <div class="assets-net ${latestTotals.net < 0 ? 'negative' : ''}">$${fmt(latestTotals.net)}</div>
      ${delta !== null
        ? `<div class="assets-delta ${deltaClass}">${deltaStr}</div>`
        : `<div class="assets-delta muted">${snaps.length < 2 ? 'Add another snapshot to start tracking change.' : 'Not enough snapshots in this range to show change.'}</div>`}
      ${lastDelta !== null ? `<div class="assets-delta-sub ${lastDeltaClass}">${lastDeltaStr}</div>` : ''}
      ${rangedSnaps.length >= 2 ? buildNetWorthChart(rangedSnaps) : `<div class="chart-hint">${snaps.length < 2 ? 'Add at least one more snapshot to see your trend chart.' : 'Not enough snapshots in this range yet — try a wider one.'}</div>`}
      <div class="range-pills">${rangePills}</div>
      ${fundsToggleRow}
    </div>
  `;

  // Snapshot editor cards — most recent first. Each snapshot only shows
  // accounts that were active on its date — added by then and not yet
  // removed — or already has a recorded entry (a safety net for when a
  // snapshot's date gets edited backward after the fact, or an account is
  // later archived). So a brand-new account never appears in your older
  // history, and a removed one keeps showing correctly in every snapshot
  // from before it was removed. Older snapshots start rolled up
  // automatically; only the latest one opens by default, though every one
  // stays expandable.
  const sortedDesc = [...snaps].reverse();
  const snapCards = sortedDesc.map((snap, idx) => {
    const t = snapshotTotals(snap);
    const visibleAccounts = state.accounts.filter(acct =>
      (acct.dateAdded <= snap.date && (!acct.deletedDate || snap.date <= acct.deletedDate))
      || snap.entries.some(e => e.accountId === acct.id)
    );
    const entryRows = visibleAccounts.map(acct => {
      const ent = snap.entries.find(e => e.accountId === acct.id);
      const amount = ent ? ent.amount : 0;
      return `
      <div class="entry-row">
        <div class="entry-acct-label">
          ${institutionBadge(acct, 24)}
          <span class="entry-acct-name">${escapeHtml(acct.name)}${acct.last4 ? ` <span class="entry-acct-last4">•••• ${escapeHtml(acct.last4)}</span>` : ''}</span>
        </div>
        <span class="acct-cat-badge acct-cat-badge-sm ${categoryClass(acct.category)}">${categoryLabel(acct.category)}</span>
        <input class="plan-input entry-amount ${categoryClass(acct.category)}" type="number" step="0.01" inputmode="decimal"
               value="${amount}" data-snap-id="${snap.id}" data-acct-id="${acct.id}" data-entry-amount-field="amount" placeholder="0.00" />
      </div>
    `;
    }).join('');

    const key = 'snap-' + snap.id;
    const collapsed = key in config.collapsedSections ? !!config.collapsedSections[key] : idx !== 0;
    return `
      <div class="snap-card" data-snap-id="${snap.id}">
        <div class="snap-head">
          <div class="snap-head-left">
            <button class="section-toggle snap-toggle ${collapsed ? 'collapsed' : ''}" data-action="toggle-snapshot" data-snap-id="${snap.id}" aria-label="Toggle snapshot details" aria-expanded="${!collapsed}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <input class="snap-date-input" type="date" value="${escapeHtml(snap.date)}"
                   data-snap-id="${snap.id}" data-snap-field="date" aria-label="Snapshot date" />
            <input class="snap-label-input" type="text" value="${escapeHtml(snap.label)}"
                   data-snap-id="${snap.id}" data-snap-field="label" placeholder="Label (optional)" />
          </div>
          <div class="snap-head-right">
            <span class="snap-net ${t.net < 0 ? 'negative' : ''}">$${fmt(t.net)}</span>
            <button class="snap-delete" data-action="remove-snapshot" data-snap-id="${snap.id}" aria-label="Delete snapshot" title="Delete snapshot">🗑</button>
          </div>
        </div>
        <div class="section-body snap-body ${collapsed ? 'collapsed' : ''}">
          <div class="snap-entries">
            <div class="entry-row entry-row-head">
              <span>Account</span><span>Category</span><span>Balance</span>
            </div>
            ${entryRows || `<div class="snap-empty">${state.accounts.length === 0 ? 'No accounts yet — add one above.' : "No accounts existed yet as of this snapshot's date."}</div>`}
          </div>
        </div>
        <div class="snap-foot">
          <span>Assets <strong class="pos">$${fmt(t.assets)}</strong></span>
          ${t.nonAvailable > 0 ? `<span>Non-Avail <strong style="color:var(--text-dim);">$${fmt(t.nonAvailable)}</strong></span>` : ''}
          <span>Liabilities <strong class="neg">$${fmt(t.liabilities)}</strong></span>
          ${t.funds > 0 ? `<span>Funds <strong style="color:var(--warn);">$${fmt(t.funds)}</strong> <span style="color:var(--text-faint);font-size:10px;">${t.fundsExcluded ? '(subtracted)' : '(not subtracted)'}</span></span>` : ''}
          <span class="snap-foot-net">Net <strong class="${t.net < 0 ? 'neg' : 'pos'}">$${fmt(t.net)}</strong></span>
        </div>
      </div>
    `;
  }).join('');

  const snapshotsSectionCollapsed = !!config.collapsedSections['snapshots-section'];
  return `
    ${stickyBar}
    ${heroChart}
    ${buildHeaderRow(baseline, latest)}
    <div class="group-header assets-list-header">
      <div class="plan-section-head-left">
        <button class="section-toggle ${snapshotsSectionCollapsed ? 'collapsed' : ''}" data-action="toggle-section" data-section-key="snapshots-section" aria-label="Toggle snapshots section" aria-expanded="${!snapshotsSectionCollapsed}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
